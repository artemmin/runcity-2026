                var html_c639b16f2c4affb91f7298822b317458 = $(`<div id="html_c639b16f2c4affb91f7298822b317458" style="width: 100.0%; height: 100.0%;"><b>КП 90</b> · Этап 1<br>Петергофское шоссе, д. 47<br><i>Участок газона перед зданием. Закладной камень. Табличка на постаменте</i><br><b>Задание:</b> Самое длинное слово, написанное латиницей<br><details><summary>Правильный ответ</summary><b>foundation</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">«Балтийская жемчужина» — один из крупнейших проектов комплексного освоения территории в Санкт-Петербурге, появившийся на юго-западе города у Финского залива. Проект стартовал в 2005 году при участии китайского инвестора и задумывался как полноценный городской район с жильём, магазинами, ТРК, школами, детскими садами и другой инфраструктурой. На территории площадью около 200 гектаров многие годы формировался самостоятельный городской кластер с жилыми кварталами, общественными пространствами, каналами и набережными.<br><br>Подчиняясь единой концепции, застройка, тем не менее, демонстрирует разнообразие архитектурных решений и неоднородную высотность. Важной частью замысла стала связь района с водой и зелёными пространствами: из локаций внутри комплекса открываются виды на Финский залив, каналы и парки. Одним из самых заметных зданий проекта стал деловой центр «Балтийская жемчужина», построенный в 2006–2007 годах. Его форма обыгрывает название комплекса: изогнутый корпус напоминает раскрытую раковину, а остеклённый сферический объём внутри неё — жемчужину.<br><br>Реализация проекта не уложилась в первоначальные сроки: так, ещё в 2009 году завершение строительства планировалось на 2013 год. Одной из проблем долгое время оставалась транспортная доступность, поскольку развитие нового района опережало возможности прилегающей дорожной сети. В итоге проект «Балтийская жемчужина» был официально завершён только в сентябре 2026 года.</div></details></div>`)[0];

                var html_23addc1ee90e0c30698194eb9a54f67c = $(`<div id="html_23addc1ee90e0c30698194eb9a54f67c" style="width: 100.0%; height: 100.0%;"><b>КП 80</b> · Этап 1<br>Пр. Ветеранов, д. 123<br><i>Мемориал в сквере рядом со зданием.</i><br><b>Задание:</b> Количество противотанковых ежей (считать все, которые находятся в сквере)<br><details><summary>Правильный ответ</summary><b>10</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исторический район Лигово находится между Петергофским шоссе, проспектом Маршала Жукова, Балтийской линией железной дороги и рекой Ивановкой. Этот район, чье название происходит от древнего финского наименования реки Дудергофки (&quot;Лига&quot; может переводиться как &quot;грязь, лужа&quot;), известен с XVI века как поселение в составе Водской пятины. В 1710 году Лига была личным имением Петра I, где селились дворцовые служители. Когда в 1716 году на Дудергофке была сооружена плотина, в этой местности образовался Лиговский пруд. Во второй половине XVIII столетия владельцем поселения стал Григорий Орлов, при котором был разбит Лиговский парк, носящий сейчас название Полежаевского.<br><br>Дачный поселок Лигово возник на рубеже XIX-XX веков к северу от одноимённой железнодорожной станции. В 1913 году в честь трёхсотлетия монаршего дома дачный посёлок получил название Романовский. Уже в 1918 году он стал Урицком (в честь председателя Петроградской ЧК Моисея Соломоновича Урицкого). В 1925 году Урицк стал городом. С 19 сентября 1941 года по 10 января 1944 года Урицк был оккупирован германскими войсками и почти полностью уничтожен в ходе боевых действий. В 1960-х годах Урицк и Лигово вошли в состав Ленинграда.</div></details></div>`)[0];

                var html_f59c99a280a3c8b20c87b810da04fb6b = $(`<div id="html_f59c99a280a3c8b20c87b810da04fb6b" style="width: 100.0%; height: 100.0%;"><b>КП 190</b> · Этап 2<br>Пр. Ветеранов, д. 99<br><i>Лестница № 4</i><br><b>Задание:</b> Диапазон квартир на 8 этаже согласно данным таблички у входа<br><details><summary>Правильный ответ</summary><b>136-139</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Версий о происхождении названия «Ульянка» несколько. Одна из них связывает наименование района с церковью с созвучным названием, заложенной во времена Петра I. Менее правдоподобная — с некоей Ульяной, владевшей в этой местности кабаком. Третья — с названием финской деревни Уляля, обозначенной на чертеже Ижорской земли Андриана Шхонбека. Заселение этой территории началось вскоре после основания Санкт-Петербурга. Вдоль дороги в Петергоф появились мызы Бутурлина, Брюса, Головина, Воронцовых, Щербатовых и других приближённых императора. В 1857 году, с появлением железной дороги, Ульянка стала дачной местностью. В годы Великой Отечественной войны дачи, как и большинство зданий в районе, были уничтожены. С 1950-х годов началась активная застройка Ульянки, а в 1977 году в районе появилась станция метро «Проспект Ветеранов». Но в первую очередь, этот небольшой район, ограниченный проспектом Маршала Жукова, улицей Козлова и проспектом Народного Ополчения, знаменит своими жителями. В Ульянке жили Михаил Жванецкий, Сергей Довлатов, Иосиф Бродский и Виктор Цой. Последний — в доме 99 по проспекту Ветеранов.</div></details></div>`)[0];

                var html_ff19132f6a82c9495600d43610de8e7b = $(`<div id="html_ff19132f6a82c9495600d43610de8e7b" style="width: 100.0%; height: 100.0%;"><b>КП 370</b> · Этап 2<br>Наземный вестибюль станции метро &quot;Путиловская&quot;<br><i>Рисунок на стене между входом и выходом</i><br><b>Задание:</b> Селфи на фоне рисунка<br><details><summary>Правильный ответ</summary><b>Селфи</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Станция метро «Путиловская» открылась в декабре 2025 года в Кировском районе, став одной из первых станций новой Красносельско-Калининской линии. Она получила название в память о Путиловском заводе — одном из старейших и крупнейших металлургических и машиностроительных предприятий страны, на протяжении двух веков определявшем жизнь этой части города.<br><br>Вестибюль «Путиловской» также отсылает к истории завода: над наклонным ходом эскалатора размещено масштабное панно, на котором в абстрактной форме изображены чугунолитейное, машиностроительное и художественно-литейное производства. С ним перекликается и композиция на фасаде здания станции, изображающая тоннель, «уходящий в перспективу». В оформлении подземного зала использованы сдержанные серые и металлические оттенки, натуральный камень и лаконичные геометрические формы.<br><br>«Путиловская» стала важным пересадочным узлом – через неё пассажиры переходят на соседний «Кировский завод» Кировско-Выборгской линии. Ради нового перехода пришлось изменить облик старой станции: бюст Ленина, установленный в торце центрального зала, был перенесён в полукруглую нишу между входом и выходом вестибюля «Кировского завода».</div></details></div>`)[0];

                var html_f659e023bca4d5d34cd1139320a164cc = $(`<div id="html_f659e023bca4d5d34cd1139320a164cc" style="width: 100.0%; height: 100.0%;"><b>КП 75</b> · Этап 2<br>Турбинная ул., д. 18а, лит. А<br><i>Стенд с исторической справкой в сквере рядом со зданием.</i><br><b>Задание:</b> Второе слово в первой строке под гербом<br><details><summary>Правильный ответ</summary><b>образование</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: P202<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 2019 году скверу на северо-восточном углу Турбинной и Оборонной улиц было присвоено название — Ушаковский, «в честь купца Ушакова, много сделавшего для развития этой местности». Нынешняя улица Зои Космодемьянской носила имя купца и благотворителя вплоть до середины XX века.<br><br>Ушакову принадлежали парники и оранжереи за Нарвской заставой. Его цветы заказывали для ресторанов, гостиниц, дворцов, театров, магазинов и зимних садов. Кроме того, Ушаков был владельцем 24 доходных домов.<br><br>При этом Ушаков был крупным благотворителем. Так, на его средства были открыты бесплатное земское училище и Ушаковская больница — тоже бесплатная.<br><br>На илл.: Абрам Михайлович Ушаков<img src="https://img.runcity.org/storage/1/d2/336ba99db8675cee4c8d08468b359d21.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_359930ca86fb940b6b42f29eefa767fc = $(`<div id="html_359930ca86fb940b6b42f29eefa767fc" style="width: 100.0%; height: 100.0%;"><b>КП 59</b> · Этап 3<br>Наб. Обводного канала, д. 169, стр. 1<br><i>Ближайший корпус с Лермонтовскому проспекту. Газон перед корпусом</i><br><b>Задание:</b> Количество кормушек<br><details><summary>Правильный ответ</summary><b>2</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Провиантские магазины на Обводном канале были построены в 1819–1821 годах по проекту Василия Петровича Стасова для лейб-гвардии Измайловского полка. Магазинами в то время называли военные склады, предназначенные для хранения продовольствия. На Обводном планировалось разместить «35 тысяч кулей» провианта. За основу проекта Стасов взял Троицкие провиантские магазины авторства Фёдора Ивановича Демерцова, построенные в 1808 году (не сохранились).<br><br>Четыре двухэтажных корпуса расположены у южной стороны полкового плаца. Кроме непосредственно материальной задачи, магазины выполнили ещё и художественную, став частью оформления набережной Обводного канала. Выходящим на него строгим классическим фасадам придают парадный вид гладкие ризалиты и аттики.<br><br>В 1915-1916 годах два западных корпуса объединили и приспособили под манеж Николаевского кавалерийского училища. Соединил корпуса шестиколонный дорический портик под гладким фронтоном. Очередная реконструкция комплекса прошла в 1950-е годы – тогда, в частности, были изменены оконные проёмы.<br><br>Мстислав Валерианович Добужинский. Петербург. Обводный канал. 1902 год.<img src="https://img.runcity.org/storage/e/47/289d62d71984688f44739cc8ce94947e.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_7b2d084f239cf9f81b1705a3574cd613 = $(`<div id="html_7b2d084f239cf9f81b1705a3574cd613" style="width: 100.0%; height: 100.0%;"><b>КП 71</b> · Этап 3<br>Парк Екатерингоф. Лифляндская ул., д. 5<br><i>Участок газона севернее здания, рядом с пешеходной дорожкой. Клумба с высаженными растениями. Табличка про лаванду узколистную</i><br><b>Задание:</b> Последние две буквы последней строчки на табличке<br><details><summary>Правильный ответ</summary><b>са</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1823 году Екатерингоф был благоустроен по инициативе военного генерал-губернатора Петербурга графа Михаила Андреевича Милорадовича — уже как общедоступный парк. По проекту Огюста Монферрана были возведены псевдоготические павильоны Ферма, Львиный и Мавританский, — а также Катальная горка и Воксхолл. Двухэтажная Ферма с башней по сути представляла собой загородный дом генерал-губернатора. Готический (Львиный) павильон был сторожевой башней на берегу Екатерингофки и мог использоваться как маяк. Огромный одноэтажный Вокзал (он же Воксхолл) с круглым танцевальным залом предназначался для балов, музыкальных вечеров и прочих увеселений.<br><br>В связи с возросшей популярностью парка городские власти выделили средства на садовника, смотрителя и другие должности. Для смотрителя в 1830-х годах даже был построен двухэтажный деревянный дом у Молвинского моста. Впрочем, к 1870-м годам парк снова постепенно пришёл в упадок — и из-за недостатка финансирования, и из-за активного строительства в районе заводов и фабрик.<br><br>На илл.: Иван Андреевич Иванов. Пейзаж с рекой. Екатерингоф. 1844 год.<img src="https://img.runcity.org/storage/4/c1/3e0735c9bf1ac80f17f4839d94765c14.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_616f434fc99c9c6684fbe43078dba1d0 = $(`<div id="html_616f434fc99c9c6684fbe43078dba1d0" style="width: 100.0%; height: 100.0%;"><b>КП 06</b> · Этап 4<br>Главная ул., д. 32<br><i>Участок ограды со стороны парка. Бетонные &quot;ступеньки&quot; под металлической оградой</i><br><b>Задание:</b> Какое животное изображено на внешней части одной из &quot;ступенек&quot;?<br><details><summary>Правильный ответ</summary><b>еж</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1839–1840 годах особняк генерала Никитина был перестроен в духе классицизма по проекту Алексея Максимовича Горностаева. Этот же зодчий отвечал за возведение дачи Китаевой в Царском селе и надстройку Митрополичьего корпуса Александро-Невской лавры. Строгие классические фасады и сдержанные интерьеры жилых покоев особняка Никитина резко контрастировали с пышными парадными залами. При особняке был разбит парк с прудами и водопадом «Плакун» и «Аллеей любви» из райских яблонь. При Елизавете Алексеевне в парке соорудили танцевальный павильон с эстрадой. Кроме того, в честь Елизаветы Алексеевны была названа Елизаветинская улица (сейчас она называется Главной).<br><br>В советский период особняк неоднократно менял назначение: в нём размещались клуб, кинематограф, в годы войны — интернат для детей-инвалидов. С 1960-х годов после ремонта в здании работал интернат для престарелых. В ходе многочисленных перестроек XX века здание потеряло множество деталей экстерьера и интерьера, а парк практически утратил первоначальный облик.<br><br>В 2018-2019 годах прошла комплексная реконструкция парка — была восстановлена его историческая ландшафтная планировка. В парке были проложены дорожки, высажены новые деревья и проведено лечение старых, на склонах были устроены лестницы, на аллеях — установлены скамейки. Берега пруда были укреплены. Сам парк был обнесён новой оградой. В 2021 году началась реставрация усадебного дома.<br><br>На илл.:<br><br>Парк графа Орлова-Денисова в Коломягах. 1900-е годы.<br><br>Елизавета Алексеевна Орлова-Денисова. 1860-е годы.<img src="https://img.runcity.org/storage/b/20/c366fbcf2c5003d7f2f4ba9235f1c20b.jpg" style="max-width:100%;margin-top:6px"><img src="https://img.runcity.org/storage/2/9e/ada773d0c61660070ee0dfea350a89e2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_cc42dc66f5f801d7bd78f55ca8cfa07c = $(`<div id="html_cc42dc66f5f801d7bd78f55ca8cfa07c" style="width: 100.0%; height: 100.0%;"><b>КП 07</b> · Этап 4<br>Пересечение Земского пер. и Вербной ул.<br><i>Пространство &quot;Крылатые качели&quot; неподалеку от пересечения. Изображение книги на стойке</i><br><b>Задание:</b> Фамилия автора на обложке<br><details><summary>Правильный ответ</summary><b>Бухарев</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В начале XVIII века Коломяги входили в состав мызы Каменный Нос, принадлежавшей Андрею Ивановичу Остерману, сподвижнику Петра I, одному из высших сановников Российской империи. В 1746 году Елизавета Петровна передала мызу своему канцлеру, Алексею Петровичу Бестужеву-Рюмину. В 1760-е годы тот построил на набережной Большой Невки в Старой Деревне деревянную церковь Благовещения Пресвятой Богородицы. По ней мыза получила второе название — село Благовещенское. В 1789 году «село Благовещенское, Каменный Нос тож, с деревнями Новой, Старой и Коломягами» приобрёл горнозаводчик Сергей Саввич Яковлев. В 1834 году Коломяги перешли его зятю, генералу, герою Отечественной войны 1812 года, Алексею Петровичу Никитину. В 1858 году имение унаследовали его дочь Елизавета Алексеевна и её муж, граф Фёдор Васильевич Орлов-Денисов. В 1898 году хозяевами Коломяг стали супруги Мария Николаевна и Николай Николаевич Граббе — внук Елизаветы Алексеевны. После смерти супруга в 1913 году Мария Николаевна пять лет — до эмиграции — жила в усадьбе со своими детьми.<br><br>На илл.: Пимен Орлов. Портрет Алексея Петровича Никитина. 1840-е годы.<img src="https://img.runcity.org/storage/4/1f/435c200a6981e28e323fbabba15601f4.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_5133d2dc9aa2ea19477ffc4e5664ed0e = $(`<div id="html_5133d2dc9aa2ea19477ffc4e5664ed0e" style="width: 100.0%; height: 100.0%;"><b>КП 09</b> · Этап 4<br>Перекрёсток ул. 3-я линия 1-й половины и Солунской ул.<br><i>Дом Граббе на южном углу перекрёстка</i><br><b>Задание:</b> Количество фонарных столбов с двумя светильниками у забора<br><details><summary>Правильный ответ</summary><b>5</b></details><br>Взяли: <b>6/9</b> (67%)<br>Не взяли: P252, P259, P255<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Последним владельцем Коломяг был внук Елизаветы Алексеевны Орловой-Денисовой, граф Николай Николаевич Граббе, камергер Императорского двора, статский советник. В начале XX века для его семьи был построен небольшой особняк — на 3-й линии 1-й половины.<br><br>Дом с башней был построен в стиле модерн по проекту неизвестного зодчего предположительно в 1901-1909 годах неподалёку от железнодорожной станции. Стены двухэтажного здания были выполнены из монолитного шлакобетона, при этом на уровне второго этажа восточного фасада был использован полнотелый глиняный кирпич. Характерной особенностью особняка является свойственный модерну деревянный декор: фигурные деревянные кронштейны и резные арки под скатами крыш северного и южного фасадов. Высокая шатровая кровля над башней была утрачена в советский период.<br><br>Внешний облик здания, включая башню с шатровой кровлей, был восстановлен по архивным фотографиям в ходе масштабной реставрации 2018-2021 годов.<br><br>На илл.:<br><br>Приморская железная дорога у дома Граббе. 1910-е годы.<img src="https://img.runcity.org/storage/8/be/cce3398c83d05943d3df93ad08e4fbe8.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_5083745d07c236038f4901ab68b321d6 = $(`<div id="html_5083745d07c236038f4901ab68b321d6" style="width: 100.0%; height: 100.0%;"><b>КП 05</b> · Этап 4<br>Ж.д. ст. Удельная<br><i>Площадка перед павильоном платформы &quot;На Петербург&quot;. Скульптура шарманщика</i><br><b>Задание:</b> Количество монет на шарманке<br><details><summary>Правильный ответ</summary><b>7</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Название «Удельная» известно с конца XVIII века: тогда местность к северу от столицы, прежде принадлежавшую казне, передали в ведение Департамента уделов.<br><br>В начале XIX века западнее современной Удельной англичанин Александр Давидсон организовал показательную сельскохозяйственную ферму. Она дала название Фермскому шоссе. В 1832-1866 годах на территории фермы Давидсона размещалось Удельнинское земледельческое училище. При нём — в качестве учебной базы — был разбит парк. Нам он известен как Удельный. В конце 1860-х годов его разделила на две неравные части линия железной дороги Рийхимяки — Санкт-Петербург.<br><br>В 1869 году к северу от парка появилась и станция Удельная. Деревянный вокзал для неё построил архитектор Вольмер Вестлинг, автор проектов первых вокзалов станций Шувалово, Левашово и Ланская.<br><br>В 1915 году другой финский архитектор, Бруно Фердинанд Гранхольм возвёл новое здание вокзала — в стиле модерн. В том же стиле зодчий построил и новые вокзалы для станций Парголово, Ланская, Шувалово и Левашово. К 1917 году Гранхольм подготовил проекты вокзалов Раяйоки (в современном Белоострове) и Терийоки (Зеленогорск).<br><br>На илл.:<br><br>Удельная. 1910 год.<img src="https://img.runcity.org/storage/0/b0/a92deb21b5db1fedfb1ae437634efb00.JPG" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_bc51742d7ad34f2f0513d94d9b4298af = $(`<div id="html_bc51742d7ad34f2f0513d94d9b4298af" style="width: 100.0%; height: 100.0%;"><b>КП 33</b> · Этап 5<br>Ул. Декабристов, д. 34<br><i>Стена со стороны Крюкова канала. Пластиковая табличка с исторической справкой про рынок</i><br><b>Задание:</b> Фамилия на букву &quot;Д&quot;<br><details><summary>Правильный ответ</summary><b>Даймонд</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_3e73876a26fdc1ab7581087ce5ce4376 = $(`<div id="html_3e73876a26fdc1ab7581087ce5ce4376" style="width: 100.0%; height: 100.0%;"><b>КП 36</b> · Этап 5<br>Ул. Декабристов, д. 54а<br><i>Плакат с исторической информацией на трёх языках на стене рядом со входом</i><br><b>Задание:</b> Перепишите последнее слово текста на эстонском языке<br><details><summary>Правильный ответ</summary><b>toel</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Эстонская община в столице с середины XVIII века постоянно росла. В Петербург постоянно приезжали эстонские подённые рабочие, домашняя прислуга, солдаты и матросы. Первоначально они посещали богослужения вместе с финнами. В 1787-1801 годах службы на эстонском языке проводились в немецкой церкви при 1-м Сухопутном кадетском корпусе на Васильевском острове. После упразднения этой церкви в 1839 году эстонцев приняла шведская церковь на Малой Конюшенной улице.<br><br>В начале 1840-х годов община арендовала в Дровяном переулке дом для богослужений. Отделку домовой церкви выполнил Владимир Андреевич Шрейбер. В 1850-х годах и она стала тесной: потребовался новый храм, способный вместить множество эстонских прихожан, включая служивших в гвардии.<br><br>Поэтому в 1859-1860 годах на Офицерской улице (современной улице Декабристов) по проекту Геральда Андреевича Боссе в псевдороманском стиле была построена Церковь Святого Апостола Иоанна (Яани Кирик). В её приходе было более двадцати тысяч человек. В церковном доме, построенном одновременно с Яани Кирик, размещались сиротский приют, богадельня и эстонская школа. С противоположной стороны от храма, на углу с Мастерской улицей, в 1909-1911 годах был возведён шестиэтажный доходный дом в стиле модерн, тоже принадлежавший эстонской церкви.<br><br>В 1931 году здание церкви было отдано под клуб и перестроено в стиле конструктивизм. Её колокольня была снесена, к фасаду, выходящему на улицу Декабристов, была пристроена лестница, а сам фасад был оштукатурен.<br><br>В 1997 году здание церкви было возвращено эстонской лютеранской общине. Прежний облик храма был восстановлен в 2009-2011 годах.<br><br>На илл.:<br><br>Лютеранская церковь Святого Иоанна. Начало XX века.<img src="https://img.runcity.org/storage/5/63/9d5c0c407ed2c7a65b445c2042b40635.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_f48b10f702450e4a6a5861f2b84c655f = $(`<div id="html_f48b10f702450e4a6a5861f2b84c655f" style="width: 100.0%; height: 100.0%;"><b>КП 41</b> · Этап 5<br>Пл. Тургенева, д. 1<br><i>Памятный знак в центре сквера на площади. Цитата на обратной стороне</i><br><b>Задание:</b> Первое слово цитаты<br><details><summary>Правильный ответ</summary><b>верною</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1798-1803 годах Иван Егорович Старов построил Церковь Покрова Пресвятой Богородицы. Храм, средства на строительство которого собрали сами прихожане, стал последней работой зодчего. Западный фасад однокупольной церкви в стиле классицизм был оформлен дорическим портиком, над которым возвышалась двухъярусная колокольня со шпилем. По церкви получили название площадь (ныне площадь Тургенева), сквер и остров, на котором она находилась.<br><br>В 1934 году храм был снесён.<br><br>По воскресеньям, летом и зимою,<br><br>Вдова ходила с нею к Покрову,<br><br>И становилася перед толпою<br><br>У крылоса налево. Я живу<br><br>Теперь не там, но верною мечтою<br><br>Люблю летать, заснувши наяву,<br><br>В Коломну, к Покрову — и в воскресенье<br><br>Там слушать русское богослуженье.<br><br>Александр Сергеевич Пушкин. Домик в Коломне.<br><br>На илл.:<br><br>Церковь Покрова Пресвятой Богородицы. Конец XIX века<img src="https://img.runcity.org/storage/6/ed/caf921bad2ebf4df2a4fc9d817941ed6.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
