                var html_006b5008659a153e8d69a089aa37ca09 = $(`<div id="html_006b5008659a153e8d69a089aa37ca09" style="width: 100.0%; height: 100.0%;"><b>КП 76</b> · Этап 1<br>Нарвский пр., д. 1/29<br><i>Звонница, выходящая на перекрёсток Нарвского пр. и Старо-Петергофского пр.</i><br><b>Задание:</b> Количество колоколов (на территорию для выполнения задания заходить не требуется)<br><details><summary>Правильный ответ</summary><b>11</b></details><br>Взяли: <b>47/157</b> (30%)<br>Не взяли: P400, P401, P406, P408, P414, P418, P421, P428, P433, P436, P439, P445, P453, P454, P460, P465, P466, P467, P469, P492 … +90<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Датой основания Успенского монастыря в Старой Ладоге считается 1156 год. На его территории находится собор Успения Пресвятой Богородицы, самый северный домонгольский храм страны. Среди насельниц этой обители — царица Евдокия Лопухина, первая супруга Петра I, и Евдокия Андреевна Ганнибал, первая жена петровского крестника.<br><br>Монастырь выкупил участок под подворье на Нарвском проспекте в 1902 году — вскоре там был освящён временный деревянный храм. Каменный же храм во имя Казанской иконы Божией матери был заложен в июле 1905 года. Проект здания, построенного на пожертвования прихожан, подготовил Василий Антонович Косяков. Главный престол завершённого храма был торжественно освящён в 1910 году.<br><br>После революции подворье было ликвидировано. В 1929 году часовня и иконная лавка были отданы под жилые помещения. В 1935 году бывшую Казанскую церковь передали под универмаг.<br><br>В августе 1989 года комплекс снова стал монастырским подворьем — уже Валаамского мужского монастыря. В январе 1991 года на церкви вновь были установлены кресты. Главный престол был освящён после реставрации в апреле 1994 года. Часовня Новомучеников и Исповедников Российских была освящена в 1995 году.<br><br>На илл.:<br><br>Казанская церковь. Начало XX века.<img src="https://img.runcity.org/storage/d/39/010783c353c08bdc0480819ea59bd39d.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_7bd0aedc990fc6563d79478805190172 = $(`<div id="html_7bd0aedc990fc6563d79478805190172" style="width: 100.0%; height: 100.0%;"><b>КП 173</b> · Этап 1<br>Старо-Петергофский пр., д. 42<br><i>Мемориальная табличка на стене дома</i><br><b>Задание:</b> Количество букв &quot;Б&quot;<br><details><summary>Правильный ответ</summary><b>2</b></details><br>Взяли: <b>137/157</b> (87%)<br>Не взяли: P483, P499, P4171, P4109, P4131, P4181, P4125, P4134, P4141, P463, P4154, P4183, P4184, P4209, P4119, P4166, P4188, P4135, P4116, P458<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_b85bcf0d6af251dcf7dfd11d0189a0dc = $(`<div id="html_b85bcf0d6af251dcf7dfd11d0189a0dc" style="width: 100.0%; height: 100.0%;"><b>КП 273</b> · Этап 1<br>Парк Екатерингоф. Пруд за памятником героям Краснодона<br><i>Два постамента на западном берегу пруда</i><br><b>Задание:</b> Количество клумб между постаментами<br><details><summary>Правильный ответ</summary><b>4</b></details><br>Взяли: <b>157/157</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1930-е годы на территории бывшей императорской резиденции, получившей название «Парк имени Первого мая», работали цирк, летний кинотеатр, лекторий и библиотека. В 1948 году парк получил новое название в честь 30-летия ВЛКСМ. В январе 1956 году в нём был установлен памятник членам подпольной организации «Молодая гвардия», погибшим в 1943 году. Позднее в западной части парка были построены стадион и конно-спортивная школа. В 1992 году Екатерингоф вернул своё историческое название.<br><br>Следующая реставрация парка запланирована на 2027 год.<br><br>На илл.: И. Урениус. Катальная горка в Екатерингофе. 1824 год.<img src="https://img.runcity.org/storage/a/81/4d10b568d7845cd1db47cceffe63e81a.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_03c4f6cf2d3cab574492f970221fbb98 = $(`<div id="html_03c4f6cf2d3cab574492f970221fbb98" style="width: 100.0%; height: 100.0%;"><b>КП 165</b> · Этап 1<br>Площадь Балтийского вокзала<br><i>Балтийский сад</i><br><b>Задание:</b> Количество противопарковочных полусфер со стороны вокзала<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>156/157</b> (99%)<br>Не взяли: P4129<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1856-1857 годах по инициативе барона Александра Людвиговича фон Штиглица была построена Петергофская железная дорога — для сообщения столицы с дачами Стрельны и Петергофа. В Петербурге для новой дороги было воздвигнуто здание Петергофского вокзала по проекту Александра Николаевича Кракау.<br><br>Симметричные башни главного фасада вокзала, двухэтажные флигели с ризалитами и их арочные проёмы отсылают к архитектуре Ренессанса. В центре фасада, выходящего на площадь, размещён полукруглый витраж. В витраже позднее были установлены уличные часы фирмы «Павел Буре».<br><br>В 1859 году начало работу ответвление Петергофской дороги — от станции Красносельская (переименованной в Лиговскую) до Красного Села. В 1864 году основную линию продлили до Ораниенбаума. Спустя шесть лет обе ветки Петергофской железной дороги выкупило Общество Балтийской железной дороги. Благодаря этой сделке линия до Красного села была продлена до Гатчины, а столичный вокзал стал называться Балтийским.<br><br>В 1931-1932 годах из-под купола здания Балтийского вокзала были убраны пути, боковые входы были закрыты, а на месте арочных окон появился центральный вход. Реконструкция прошла для открытия движения электропоездов в 1933 году. В 1955 году к вокзалу был пристроен наземный вестибюль станции метро «Балтийская».<br><br>В 1861 году в пользование Петергофской железной дороге была передана площадь перед вокзалом до набережной Обводного канала. Вскоре на площади был разбит сквер — он тоже содержался на средства железной дороги. В 1907-1908 годы вокруг сквера (в наши дни это Балтийский сад) было было проложено трамвайное кольцо. В 1965 году в сквере, напротив центрального входа в вокзал, был установлен памятник, посвящённый жителям Ленинского района, ушедшим на фронт в составе Ленинградской армии народного ополчения.<br><br>На илл.: Балтийский вокзал. 1913 год.<img src="https://img.runcity.org/storage/0/05/4c8ed293a448f698d0491b9ad906a050.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_17a4f067bf9c841841e6ea0d0283829c = $(`<div id="html_17a4f067bf9c841841e6ea0d0283829c" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 2<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>70/157</b> (45%)<br>Не взяли: P404, P415, P441, P444, P449, P455, P457, P481, P4158, P4189, P4204, P403, P407, P409, P425, P432, P434, P442, P451, P464 … +67<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_a330d5120982cf758281f24c49b586b7 = $(`<div id="html_a330d5120982cf758281f24c49b586b7" style="width: 100.0%; height: 100.0%;"><b>КП 59</b> · Этап 2<br>Наб. Обводного канала, д. 169, стр. 1<br><i>Ближайший корпус с Лермонтовскому проспекту. Газон перед корпусом</i><br><b>Задание:</b> Количество кормушек<br><details><summary>Правильный ответ</summary><b>2</b></details><br>Взяли: <b>156/157</b> (99%)<br>Не взяли: P423<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Провиантские магазины на Обводном канале были построены в 1819–1821 годах по проекту Василия Петровича Стасова для лейб-гвардии Измайловского полка. Магазинами в то время называли военные склады, предназначенные для хранения продовольствия. На Обводном планировалось разместить «35 тысяч кулей» провианта. За основу проекта Стасов взял Троицкие провиантские магазины авторства Фёдора Ивановича Демерцова, построенные в 1808 году (не сохранились).<br><br>Четыре двухэтажных корпуса расположены у южной стороны полкового плаца. Кроме непосредственно материальной задачи, магазины выполнили ещё и художественную, став частью оформления набережной Обводного канала. Выходящим на него строгим классическим фасадам придают парадный вид гладкие ризалиты и аттики.<br><br>В 1915-1916 годах два западных корпуса объединили и приспособили под манеж Николаевского кавалерийского училища. Соединил корпуса шестиколонный дорический портик под гладким фронтоном. Очередная реконструкция комплекса прошла в 1950-е годы – тогда, в частности, были изменены оконные проёмы.<br><br>Мстислав Валерианович Добужинский. Петербург. Обводный канал. 1902 год.<img src="https://img.runcity.org/storage/e/47/289d62d71984688f44739cc8ce94947e.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_10d21dff318edd67778d2fe9e8e35c8e = $(`<div id="html_10d21dff318edd67778d2fe9e8e35c8e" style="width: 100.0%; height: 100.0%;"><b>КП 30</b> · Этап 2<br>Пр. Римского-Корсакова, д. 37<br><i>Табличка с QR-кодом, располагающаяся под адресной</i><br><b>Задание:</b> Четырехзначное число в ссылке<br><details><summary>Правильный ответ</summary><b>5504</b></details><br>Взяли: <b>153/157</b> (97%)<br>Не взяли: P427, P446, P4166, P4147<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Напротив указанного дома расположен Никольский сад, разбитый ещё в XVIII веке. В 1753-1762 годах в его центре по проекту архитектора Саввы Ивановича Чевакинского был построен Никольский морской собор, по которому сад и был назван.<br><br>Отдельно стоящая четырёхъярусная колокольня собора, завершенная высоким шпилем, была возведена в 1755-1758 годах. С 1870 года при Никольском соборе действовало благотворительное общество со школой, больницей, приютом и женской богадельней. После Октябрьской революции собор не был закрыт, а в 1941-1999 годах он и вовсе был кафедральным — на хорах собора даже жили Ленинградские митрополиты. Кроме сада, собор дал название Никольским площади, переулку, рынку, а также Старо- и Ново-Никольскому мостам.<br><br>На илл.:<br><br>Зинаида Серебрякова. Никольский собор. 1910 год.<img src="https://img.runcity.org/storage/5/c1/28089cb46c115282c300481d15bbdc15.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2a7263649ea2bdc12fdb36ab5b1f27c0 = $(`<div id="html_2a7263649ea2bdc12fdb36ab5b1f27c0" style="width: 100.0%; height: 100.0%;"><b>КП 31</b> · Этап 3<br>Пр. Римского-Корсакова, д. 24<br><i>Сквер рядом с домом. Скульптурная композиция в сквере</i><br><b>Задание:</b> Фамилия на хлястике<br><details><summary>Правильный ответ</summary><b>Крьлов</b></details><br>Взяли: <b>153/157</b> (97%)<br>Не взяли: P4164, P4178, P4135, P4147<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исидоровская церковь на проспекте Римского-Корсакова появилась благодаря петербургской общине православных эстонцев, сформировавшейся в Коломне в конце XIX века. Храм получил своё название в честь священномученика Исидора Юрьевского — эстонского православного священника XV века, погибшего за веру.<br><br>Сначала собственного храма у общины не было, и богослужения проходили в подвале утраченной Малоколоменской Воскресенской церкви (в наши дни на её месте — Воскресенский сквер). Инициатором строительства нового храма стал священник Павел Петрович Кульбуш (Платон). Он же основал благотворительную организацию общины — Православное русско-эстонское братство в честь священномученика Исидора Юрьевского. Проект церкви поручили члену Братства, молодому архитектору Александру Артемьевичу Полещуку. Первый взнос на строительство сделал Иоанн Кронштадтский. Позднее, в 1903 году, в его же присутствии была освящена временная эстонская церковь.<br><br>Строительство пятиглавой каменной церкви в русском стиле началось в том же году. Храм был вчерне достроен в 1907 году. Кроме основного здания храма, Полещук подготовил проект целого приходского комплекса со школой, общежитием, библиотекой и помещениями для собраний. Для богослужений внутри Исидоровской церкви были предусмотрены верхний храм с тремя приделами и нижняя церковь во имя Николая Чудотворца. Иконостасы были выполнены по рисункам самого Полещука. В 1910-х годах престолы были облицованы белым каррарским мрамором.<br><br>К 1911 году приход насчитывал более 2500 человек, причём службы проходили на русском и эстонском языках. После революции храм постепенно лишился прежней общины и в 1935 году был закрыт – его здание впоследствии использовали для светских нужд. В 1994 году церковь вернули верующим, и сегодня в ней вновь проходят богослужения.<br><br>На илл.:<br><br>Поднятие крестов на эстонскую православную церковь. Сентябрь 1906 года.<img src="https://img.runcity.org/storage/d/fc/b8043e5f096856074252de487b09dfcd.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_e66d38d195aab95fcd07ee3f45e69e51 = $(`<div id="html_e66d38d195aab95fcd07ee3f45e69e51" style="width: 100.0%; height: 100.0%;"><b>КП 32</b> · Этап 3<br>Наб. Крюкова канала, д. 7/2<br><i>Плакаты в окнах первого этажа, выходящих на канал</i><br><b>Задание:</b> Имя дракона<br><details><summary>Правильный ответ</summary><b>Нянь</b></details><br>Взяли: <b>150/157</b> (96%)<br>Не взяли: P405, P4164, P4178, P4135, P4147, P4116, P458<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>Доминик Перро. Проект новой сцены Мариинского театра. 2003 год.<img src="https://img.runcity.org/storage/6/f8/3edf75778d3580217f1d2cda465b7f86.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_30e020e83133be1071dee303ec8d2e6c = $(`<div id="html_30e020e83133be1071dee303ec8d2e6c" style="width: 100.0%; height: 100.0%;"><b>КП 36</b> · Этап 3<br>Ул. Декабристов, д. 54а<br><i>Плакат с исторической информацией на трёх языках на стене рядом со входом</i><br><b>Задание:</b> Перепишите последнее слово текста на эстонском языке<br><details><summary>Правильный ответ</summary><b>toel</b></details><br>Взяли: <b>150/157</b> (96%)<br>Не взяли: P4119, P4164, P4178, P4135, P4147, P458, P4161<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Эстонская община в столице с середины XVIII века постоянно росла. В Петербург постоянно приезжали эстонские подённые рабочие, домашняя прислуга, солдаты и матросы. Первоначально они посещали богослужения вместе с финнами. В 1787-1801 годах службы на эстонском языке проводились в немецкой церкви при 1-м Сухопутном кадетском корпусе на Васильевском острове. После упразднения этой церкви в 1839 году эстонцев приняла шведская церковь на Малой Конюшенной улице.<br><br>В начале 1840-х годов община арендовала в Дровяном переулке дом для богослужений. Отделку домовой церкви выполнил Владимир Андреевич Шрейбер. В 1850-х годах и она стала тесной: потребовался новый храм, способный вместить множество эстонских прихожан, включая служивших в гвардии.<br><br>Поэтому в 1859-1860 годах на Офицерской улице (современной улице Декабристов) по проекту Геральда Андреевича Боссе в псевдороманском стиле была построена Церковь Святого Апостола Иоанна (Яани Кирик). В её приходе было более двадцати тысяч человек. В церковном доме, построенном одновременно с Яани Кирик, размещались сиротский приют, богадельня и эстонская школа. С противоположной стороны от храма, на углу с Мастерской улицей, в 1909-1911 годах был возведён шестиэтажный доходный дом в стиле модерн, тоже принадлежавший эстонской церкви.<br><br>В 1931 году здание церкви было отдано под клуб и перестроено в стиле конструктивизм. Её колокольня была снесена, к фасаду, выходящему на улицу Декабристов, была пристроена лестница, а сам фасад был оштукатурен.<br><br>В 1997 году здание церкви было возвращено эстонской лютеранской общине. Прежний облик храма был восстановлен в 2009-2011 годах.<br><br>На илл.:<br><br>Лютеранская церковь Святого Иоанна. Начало XX века.<img src="https://img.runcity.org/storage/5/63/9d5c0c407ed2c7a65b445c2042b40635.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_402f1f66b4e3324301fa14468106c312 = $(`<div id="html_402f1f66b4e3324301fa14468106c312" style="width: 100.0%; height: 100.0%;"><b>КП 37</b> · Этап 3<br>Ул. Писарева. Алексеевский сад<br><i>Фонтан в саду. Охранная табличка</i><br><b>Задание:</b> Год на табличке<br><details><summary>Правильный ответ</summary><b>1885</b></details><br>Взяли: <b>150/157</b> (96%)<br>Не взяли: P4159, P4164, P4178, P4135, P4147, P458, P4161<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1883-1885 годах Максимилиан Егорович Месмахер перестроил особняк на набережной Мойки в дворец для великого князя Алексея Александровича. В 1885 году зодчий перепланировал и сад при дворце.<br><br>Четвёртый сын Александра II, Алексей Александрович, с рождения был зачислен в морской гвардейский экипаж. В 1857 году он получил звание мичмана — в семь лет. С десяти лет великий князь участвовал в плаваниях на военных кораблях. В 1871-1872 годах он путешествовал на фрегате «Светлана» в составе дипломатической эскадры в Северо-Американские Соединенные Штаты. В 1880 году Алексей Александрович стал членом Государственного совета и Главным начальником флота и Морского ведомства.<br><br>Место для дворца Главного начальника флота и Морского ведомства было подобрано неслучайно: поблизости располагались казармы Гвардейского морского экипажа, Адмиралтейские верфи и Новая Голландия. Работая над проектом Алексеевского дворца, Месмахер сохранил существовавшее ранее сочетание разновеликих объёмов особняка и дополнил его двумя башнями. Доминирующее положение в новой композиции заняла четырёхъярусная башня с шатровым верхом. Со стороны реки были обустроены два подъезда: Главный и Собственный. Главный был украшен картушем с гербом великого князя и фонарями на три светильника. На балюстрадах над подъездом было установлено десять бюстов. Собственный подъезд был скромнее: его украсили шесть бюстов.<br><br>После революции дворец был национализирован. В 1920-х годах его занимало Издательство Географического института. В 1960-х годах в здание переехал трест «Ленинградоргстрой». С 2006 года в здании дворца работает Санкт-Петербургский Дом музыки.<br><br>Строительство дворца повлекло за собой прокладку новой улицы — Алексеевской (в наши дни это улица Писарева). От неё высокой каменной стеной был отделён Собственный сад, разбитый перед южным фасадом дворца. Другой сад — парадный — был обращён к Мойке. Важнейшим элементом его художественного решения стала ограда, состоящая из декоративных копий и трезубцев и украшенная коронованной монограммой «АА».<br><br>Пейзажный Собственный сад оттенял разноплановое здание дворца. Сад полностью соответствовал своему названию: там даже хоронили собак великого князя. На местах захоронений были установлены скульптуры. Перед окнами кабинета Алексея Александровича — тоже по проекту Месмахера — был сооружён гранитный фонтан. Его реставрация была проведена в 2013 году.<br><br>На илл.: Сад дворца великого князя Алексея Александровича. Конец XIX века.<img src="https://img.runcity.org/storage/f/03/b714537adf8d51c4dd540be536c1d03f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_32c7a54e2c93e213e82b598501c648aa = $(`<div id="html_32c7a54e2c93e213e82b598501c648aa" style="width: 100.0%; height: 100.0%;"><b>КП 40</b> · Этап 3<br>Псковская ул., д. 6<br><i>Сквер напротив дома. Памятник в сквере</i><br><b>Задание:</b> Количество клумб рядом с памятником<br><details><summary>Правильный ответ</summary><b>6</b></details><br>Взяли: <b>147/157</b> (94%)<br>Не взяли: P489, P4180, P4143, P4119, P4188, P4164, P4135, P4147, P458, P4161<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В конце XVIII века пустырь в конце Торговой улицы (современная Союза Печатников) назывался Козьим болотом. В 1832 году жители Малой Коломны начали сбор средств на строительство церкви на пустыре. Поводов для её возведения было два: избавление от эпидемии холеры и рождение младшего сына императора – великого князя Михаила Николаевича. Церковь Воскресения Христова и Михаила Архангела в Малой Коломне (таково её полное название) возводили на сваях — местность действительно была болотистой. Образовавшуюся вокруг площадь назвали Воскресенской — по церкви.<br><br>В 1932 году храм был взорван, а спустя двадцать лет и площадь по идеологическим причинам переименовали. Она получила название в честь изобретателя-самоучки Ивана Петровича Кулибина (хотя сам знаменитый механик здесь никогда не жил).<br><br>На илл.: Воскресенская церковь. 1900 год.<img src="https://img.runcity.org/storage/c/09/d6a3ee9933748a1598bbde462435109c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_fc147d17eb51afb097eb85a9c91de898 = $(`<div id="html_fc147d17eb51afb097eb85a9c91de898" style="width: 100.0%; height: 100.0%;"><b>КП 41</b> · Этап 4<br>Пл. Тургенева, д. 1<br><i>Памятный знак в центре сквера на площади. Цитата на обратной стороне</i><br><b>Задание:</b> Первое слово цитаты<br><details><summary>Правильный ответ</summary><b>верною</b></details><br>Взяли: <b>149/157</b> (95%)<br>Не взяли: P448, P4168, P4130, P4164, P4178, P4135, P4147, P4161<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1798-1803 годах Иван Егорович Старов построил Церковь Покрова Пресвятой Богородицы. Храм, средства на строительство которого собрали сами прихожане, стал последней работой зодчего. Западный фасад однокупольной церкви в стиле классицизм был оформлен дорическим портиком, над которым возвышалась двухъярусная колокольня со шпилем. По церкви получили название площадь (ныне площадь Тургенева), сквер и остров, на котором она находилась.<br><br>В 1934 году храм был снесён.<br><br>По воскресеньям, летом и зимою,<br><br>Вдова ходила с нею к Покрову,<br><br>И становилася перед толпою<br><br>У крылоса налево. Я живу<br><br>Теперь не там, но верною мечтою<br><br>Люблю летать, заснувши наяву,<br><br>В Коломну, к Покрову — и в воскресенье<br><br>Там слушать русское богослуженье.<br><br>Александр Сергеевич Пушкин. Домик в Коломне.<br><br>На илл.:<br><br>Церковь Покрова Пресвятой Богородицы. Конец XIX века<img src="https://img.runcity.org/storage/6/ed/caf921bad2ebf4df2a4fc9d817941ed6.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
