                var html_190f1dd68d8067682874200fa4348b13 = $(`<div id="html_190f1dd68d8067682874200fa4348b13" style="width: 100.0%; height: 100.0%;"><b>КП 75</b> · Этап 1<br>Турбинная ул., д. 18а, лит. А<br><i>Стенд с исторической справкой в сквере рядом со зданием.</i><br><b>Задание:</b> Второе слово в первой строке под гербом<br><details><summary>Правильный ответ</summary><b>образование</b></details><br>Взяли: <b>14/14</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 2019 году скверу на северо-восточном углу Турбинной и Оборонной улиц было присвоено название — Ушаковский, «в честь купца Ушакова, много сделавшего для развития этой местности». Нынешняя улица Зои Космодемьянской носила имя купца и благотворителя вплоть до середины XX века.<br><br>Ушакову принадлежали парники и оранжереи за Нарвской заставой. Его цветы заказывали для ресторанов, гостиниц, дворцов, театров, магазинов и зимних садов. Кроме того, Ушаков был владельцем 24 доходных домов.<br><br>При этом Ушаков был крупным благотворителем. Так, на его средства были открыты бесплатное земское училище и Ушаковская больница — тоже бесплатная.<br><br>На илл.: Абрам Михайлович Ушаков<img src="https://img.runcity.org/storage/1/d2/336ba99db8675cee4c8d08468b359d21.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_13ab1b05b2eaa1d6aa807c042d17161e = $(`<div id="html_13ab1b05b2eaa1d6aa807c042d17161e" style="width: 100.0%; height: 100.0%;"><b>КП 73</b> · Этап 2<br>Старо-Петергофский пр., д. 42<br><i>Участок стены с проемом в сквере рядом с домом</i><br><b>Задание:</b> Количество проходящих насквозь труб в верхней части стены<br><details><summary>Правильный ответ</summary><b>9</b></details><br>Взяли: <b>14/14</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_99fc05c911c874c64b9d432f8d7a454e = $(`<div id="html_99fc05c911c874c64b9d432f8d7a454e" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 2<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>13/14</b> (93%)<br>Не взяли: X317<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_4225e1504e4b7e6ddda96eadb0a41da3 = $(`<div id="html_4225e1504e4b7e6ddda96eadb0a41da3" style="width: 100.0%; height: 100.0%;"><b>КП 165</b> · Этап 2<br>Площадь Балтийского вокзала<br><i>Балтийский сад</i><br><b>Задание:</b> Количество противопарковочных полусфер со стороны вокзала<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>14/14</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1856-1857 годах по инициативе барона Александра Людвиговича фон Штиглица была построена Петергофская железная дорога — для сообщения столицы с дачами Стрельны и Петергофа. В Петербурге для новой дороги было воздвигнуто здание Петергофского вокзала по проекту Александра Николаевича Кракау.<br><br>Симметричные башни главного фасада вокзала, двухэтажные флигели с ризалитами и их арочные проёмы отсылают к архитектуре Ренессанса. В центре фасада, выходящего на площадь, размещён полукруглый витраж. В витраже позднее были установлены уличные часы фирмы «Павел Буре».<br><br>В 1859 году начало работу ответвление Петергофской дороги — от станции Красносельская (переименованной в Лиговскую) до Красного Села. В 1864 году основную линию продлили до Ораниенбаума. Спустя шесть лет обе ветки Петергофской железной дороги выкупило Общество Балтийской железной дороги. Благодаря этой сделке линия до Красного села была продлена до Гатчины, а столичный вокзал стал называться Балтийским.<br><br>В 1931-1932 годах из-под купола здания Балтийского вокзала были убраны пути, боковые входы были закрыты, а на месте арочных окон появился центральный вход. Реконструкция прошла для открытия движения электропоездов в 1933 году. В 1955 году к вокзалу был пристроен наземный вестибюль станции метро «Балтийская».<br><br>В 1861 году в пользование Петергофской железной дороге была передана площадь перед вокзалом до набережной Обводного канала. Вскоре на площади был разбит сквер — он тоже содержался на средства железной дороги. В 1907-1908 годы вокруг сквера (в наши дни это Балтийский сад) было было проложено трамвайное кольцо. В 1965 году в сквере, напротив центрального входа в вокзал, был установлен памятник, посвящённый жителям Ленинского района, ушедшим на фронт в составе Ленинградской армии народного ополчения.<br><br>На илл.: Балтийский вокзал. 1913 год.<img src="https://img.runcity.org/storage/0/05/4c8ed293a448f698d0491b9ad906a050.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_e326c0f55d276c31d8006da901e745ac = $(`<div id="html_e326c0f55d276c31d8006da901e745ac" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 3<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>8/14</b> (57%)<br>Не взяли: X300, X361, X316, X333, X317, X334<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_5b2f0820bf3e49d76b74957a08ff94c0 = $(`<div id="html_5b2f0820bf3e49d76b74957a08ff94c0" style="width: 100.0%; height: 100.0%;"><b>КП 253</b> · Этап 3<br>Наб. Обводного канала, д. 167а<br><b>Задание:</b> Количество водосточных труб<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>13/14</b> (93%)<br>Не взяли: X334<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Провиантские магазины на Обводном канале были построены в 1819–1821 годах по проекту Василия Петровича Стасова для лейб-гвардии Измайловского полка. Магазинами в то время называли военные склады, предназначенные для хранения продовольствия. На Обводном планировалось разместить «35 тысяч кулей» провианта. За основу проекта Стасов взял Троицкие провиантские магазины авторства Фёдора Ивановича Демерцова, построенные в 1808 году (не сохранились).<br><br>Четыре двухэтажных корпуса расположены у южной стороны полкового плаца. Кроме непосредственно материальной задачи, магазины выполнили ещё и художественную, став частью оформления набережной Обводного канала. Выходящим на него строгим классическим фасадам придают парадный вид гладкие ризалиты и аттики.<br><br>В 1915-1916 годах два западных корпуса объединили и приспособили под манеж Николаевского кавалерийского училища. Соединил корпуса шестиколонный дорический портик под гладким фронтоном. Очередная реконструкция комплекса прошла в 1950-е годы – тогда, в частности, были изменены оконные проёмы.<br><br>На илл.:<br><br>Мстислав Валерианович Добужинский. Петербург. Обводный канал. 1902 год.<img src="https://img.runcity.org/storage/e/47/289d62d71984688f44739cc8ce94947e.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_21ea70376a899b989733b53f980ff828 = $(`<div id="html_21ea70376a899b989733b53f980ff828" style="width: 100.0%; height: 100.0%;"><b>КП 145</b> · Этап 3<br>Никольская пл., д. 1а<br><i>Вход со стороны Никольского сквера Табличка над дверью</i><br><b>Задание:</b> Верхнее слово<br><details><summary>Правильный ответ</summary><b>испытание</b></details><br>Взяли: <b>14/14</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Никольский сад был разбит ещё в XVIII веке. В 1753-1762 годах в его центре по проекту архитектора Саввы Ивановича Чевакинского был построен Никольский морской собор, по которому сад и был назван.<br><br>Отдельно стоящая четырёхъярусная колокольня собора, завершенная высоким шпилем, была возведена в 1755-1758 годах. С 1870 года при Никольском соборе действовало благотворительное общество со школой, больницей, приютом и женской богадельней. После Октябрьской революции собор не был закрыт, а в 1941-1999 годах он и вовсе был кафедральным — на хорах собора даже жили Ленинградские митрополиты. Кроме сада, собор дал название Никольским площади, переулку, рынку, а также Старо- и Ново-Никольскому мостам.<br><br>На илл.:<br><br>Зинаида Серебрякова. Никольский собор. 1910 год.<img src="https://img.runcity.org/storage/5/c1/28089cb46c115282c300481d15bbdc15.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_558adad80a557929dffd38cc2d11875f = $(`<div id="html_558adad80a557929dffd38cc2d11875f" style="width: 100.0%; height: 100.0%;"><b>КП 232</b> · Этап 4<br>Ул. Декабристов, д. 34<br><i>Велопарковка со стороны Крюкова канала. Лист с обращением и запрещающим знаком на пандусе рядом парковкой</i><br><b>Задание:</b> К владельцам чего составлено обращение?<br><details><summary>Правильный ответ</summary><b>мопедов</b></details><br>Взяли: <b>14/14</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
