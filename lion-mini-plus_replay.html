                var html_45a04c33ec985187f20d65289d6b217c = $(`<div id="html_45a04c33ec985187f20d65289d6b217c" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 1<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>79/181</b> (44%)<br>Не взяли: mp403, mp419, mp428, mp430, mp436, mp444, mp450, mp458, mp459, mp462, mp469, mp487, mp492, mp496, mp4117, mp4119, mp4124, mp4128, mp4132, mp4134 … +82<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_16362d5945b38080249afc55378129b9 = $(`<div id="html_16362d5945b38080249afc55378129b9" style="width: 100.0%; height: 100.0%;"><b>КП 155</b> · Этап 1<br>Лермонтовский пр., д. 43/1<br><i>Фонтан в сквере перед зданием</i><br><b>Задание:</b> Количество торчащих из воды форсунок, из которых могут бить струи фонтана<br><details><summary>Правильный ответ</summary><b>44</b></details><br>Взяли: <b>178/181</b> (98%)<br>Не взяли: mp4129, mp416, mp4122<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_cbc3cd9dcb03602656481a8d44a4d39e = $(`<div id="html_cbc3cd9dcb03602656481a8d44a4d39e" style="width: 100.0%; height: 100.0%;"><b>КП 63</b> · Этап 3<br>Ул. Циолковского, д. 3<br><i>Стеклянный козырек над входом в поликлинику</i><br><b>Задание:</b> Количество &quot;нитей&quot;, держащих козырек<br><details><summary>Правильный ответ</summary><b>24</b></details><br>Взяли: <b>172/181</b> (95%)<br>Не взяли: mp401, mp4105, mp4156, mp4118, mp4174, mp4177, mp4190, mp4183, mp4205<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Современное название реки Таракановки известно с 1785 года, предположительно, от фамилии владельцев завода — Таракановых. Параллельно до 1849 года существовало и название Чечереновка, произошедшее, вероятно, от фамилии землевладельца Чичерина.<br><br>Некогда её русло шло от Фонтанки (исток находился у Старо-Калинкина моста) по современной улице Циолковского, пересекало русло Обводного канала в районе Таракановского моста. Затем на месте площади Стачек в Таракановку впадала небольшая река Тентелевка (Ольховка), а Таракановка шла дальше к Екатерингофу, отделяя его от материка.<br><br>В 1906 году участок от Фонтанки до Обводного канала был засыпан и превратился в Таракановскую улицу (сейчас она носит имя Константина Эдуардовича Циолковского). В 1920-х годах вместе с Тентелевкой был засыпан и участок от Обводного канала до Бумажного, а все мосты, кроме Молвинского, были разобраны.<br><br>На илл.:<br><br>Таракановка у Нарвских ворот. Начало XX века.<img src="https://img.runcity.org/storage/2/5a/055a2f896b30ffcabb41a18edc9225a2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
