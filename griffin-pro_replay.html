                var html_e5cd663b4f6f258f2e5e9825c1eac209 = $(`<div id="html_e5cd663b4f6f258f2e5e9825c1eac209" style="width: 100.0%; height: 100.0%;"><b>КП 75</b> · Этап 1<br>Турбинная ул., д. 18а, лит. А<br><i>Стенд с исторической справкой в сквере рядом со зданием.</i><br><b>Задание:</b> Второе слово в первой строке под гербом<br><details><summary>Правильный ответ</summary><b>образование</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 2019 году скверу на северо-восточном углу Турбинной и Оборонной улиц было присвоено название — Ушаковский, «в честь купца Ушакова, много сделавшего для развития этой местности». Нынешняя улица Зои Космодемьянской носила имя купца и благотворителя вплоть до середины XX века.<br><br>Ушакову принадлежали парники и оранжереи за Нарвской заставой. Его цветы заказывали для ресторанов, гостиниц, дворцов, театров, магазинов и зимних садов. Кроме того, Ушаков был владельцем 24 доходных домов.<br><br>При этом Ушаков был крупным благотворителем. Так, на его средства были открыты бесплатное земское училище и Ушаковская больница — тоже бесплатная.<br><br>На илл.: Абрам Михайлович Ушаков<img src="https://img.runcity.org/storage/1/d2/336ba99db8675cee4c8d08468b359d21.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_bc219d9fd34a27c11892b363f340d714 = $(`<div id="html_bc219d9fd34a27c11892b363f340d714" style="width: 100.0%; height: 100.0%;"><b>КП 71</b> · Этап 2<br>Парк Екатерингоф. Лифляндская ул., д. 5<br><i>Участок газона севернее здания, рядом с пешеходной дорожкой. Клумба с высаженными растениями. Табличка про лаванду узколистную</i><br><b>Задание:</b> Последние две буквы последней строчки на табличке<br><details><summary>Правильный ответ</summary><b>са</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1823 году Екатерингоф был благоустроен по инициативе военного генерал-губернатора Петербурга графа Михаила Андреевича Милорадовича — уже как общедоступный парк. По проекту Огюста Монферрана были возведены псевдоготические павильоны Ферма, Львиный и Мавританский, — а также Катальная горка и Воксхолл. Двухэтажная Ферма с башней по сути представляла собой загородный дом генерал-губернатора. Готический (Львиный) павильон был сторожевой башней на берегу Екатерингофки и мог использоваться как маяк. Огромный одноэтажный Вокзал (он же Воксхолл) с круглым танцевальным залом предназначался для балов, музыкальных вечеров и прочих увеселений.<br><br>В связи с возросшей популярностью парка городские власти выделили средства на садовника, смотрителя и другие должности. Для смотрителя в 1830-х годах даже был построен двухэтажный деревянный дом у Молвинского моста. Впрочем, к 1870-м годам парк снова постепенно пришёл в упадок — и из-за недостатка финансирования, и из-за активного строительства в районе заводов и фабрик.<br><br>На илл.: Иван Андреевич Иванов. Пейзаж с рекой. Екатерингоф. 1844 год.<img src="https://img.runcity.org/storage/4/c1/3e0735c9bf1ac80f17f4839d94765c14.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_986b399d2e5d489529ae1eb2744f49cc = $(`<div id="html_986b399d2e5d489529ae1eb2744f49cc" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 2<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_0b638797f6a39a565acc00ae7f2dac84 = $(`<div id="html_0b638797f6a39a565acc00ae7f2dac84" style="width: 100.0%; height: 100.0%;"><b>КП 76</b> · Этап 2<br>Нарвский пр., д. 1/29<br><i>Звонница, выходящая на перекрёсток Нарвского пр. и Старо-Петергофского пр.</i><br><b>Задание:</b> Количество колоколов (на территорию для выполнения задания заходить не требуется)<br><details><summary>Правильный ответ</summary><b>11</b></details><br>Взяли: <b>3/9</b> (33%)<br>Не взяли: P802, P846, P803, P800, P830, P888<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Датой основания Успенского монастыря в Старой Ладоге считается 1156 год. На его территории находится собор Успения Пресвятой Богородицы, самый северный домонгольский храм страны. Среди насельниц этой обители — царица Евдокия Лопухина, первая супруга Петра I, и Евдокия Андреевна Ганнибал, первая жена петровского крестника.<br><br>Монастырь выкупил участок под подворье на Нарвском проспекте в 1902 году — вскоре там был освящён временный деревянный храм. Каменный же храм во имя Казанской иконы Божией матери был заложен в июле 1905 года. Проект здания, построенного на пожертвования прихожан, подготовил Василий Антонович Косяков. Главный престол завершённого храма был торжественно освящён в 1910 году.<br><br>После революции подворье было ликвидировано. В 1929 году часовня и иконная лавка были отданы под жилые помещения. В 1935 году бывшую Казанскую церковь передали под универмаг.<br><br>В августе 1989 года комплекс снова стал монастырским подворьем — уже Валаамского мужского монастыря. В январе 1991 года на церкви вновь были установлены кресты. Главный престол был освящён после реставрации в апреле 1994 года. Часовня Новомучеников и Исповедников Российских была освящена в 1995 году.<br><br>На илл.:<br><br>Казанская церковь. Начало XX века.<img src="https://img.runcity.org/storage/d/39/010783c353c08bdc0480819ea59bd39d.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_3e37a952767ff9841df5c2fd7bc02493 = $(`<div id="html_3e37a952767ff9841df5c2fd7bc02493" style="width: 100.0%; height: 100.0%;"><b>КП 165</b> · Этап 2<br>Площадь Балтийского вокзала<br><i>Балтийский сад</i><br><b>Задание:</b> Количество противопарковочных полусфер со стороны вокзала<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: P889<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1856-1857 годах по инициативе барона Александра Людвиговича фон Штиглица была построена Петергофская железная дорога — для сообщения столицы с дачами Стрельны и Петергофа. В Петербурге для новой дороги было воздвигнуто здание Петергофского вокзала по проекту Александра Николаевича Кракау.<br><br>Симметричные башни главного фасада вокзала, двухэтажные флигели с ризалитами и их арочные проёмы отсылают к архитектуре Ренессанса. В центре фасада, выходящего на площадь, размещён полукруглый витраж. В витраже позднее были установлены уличные часы фирмы «Павел Буре».<br><br>В 1859 году начало работу ответвление Петергофской дороги — от станции Красносельская (переименованной в Лиговскую) до Красного Села. В 1864 году основную линию продлили до Ораниенбаума. Спустя шесть лет обе ветки Петергофской железной дороги выкупило Общество Балтийской железной дороги. Благодаря этой сделке линия до Красного села была продлена до Гатчины, а столичный вокзал стал называться Балтийским.<br><br>В 1931-1932 годах из-под купола здания Балтийского вокзала были убраны пути, боковые входы были закрыты, а на месте арочных окон появился центральный вход. Реконструкция прошла для открытия движения электропоездов в 1933 году. В 1955 году к вокзалу был пристроен наземный вестибюль станции метро «Балтийская».<br><br>В 1861 году в пользование Петергофской железной дороге была передана площадь перед вокзалом до набережной Обводного канала. Вскоре на площади был разбит сквер — он тоже содержался на средства железной дороги. В 1907-1908 годы вокруг сквера (в наши дни это Балтийский сад) было было проложено трамвайное кольцо. В 1965 году в сквере, напротив центрального входа в вокзал, был установлен памятник, посвящённый жителям Ленинского района, ушедшим на фронт в составе Ленинградской армии народного ополчения.<br><br>На илл.: Балтийский вокзал. 1913 год.<img src="https://img.runcity.org/storage/0/05/4c8ed293a448f698d0491b9ad906a050.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_caa7575ec8ee1c567768398982ba1ff1 = $(`<div id="html_caa7575ec8ee1c567768398982ba1ff1" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 3<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: P817<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_8f9be1f7bb0769afe4fcfe95d5d3e373 = $(`<div id="html_8f9be1f7bb0769afe4fcfe95d5d3e373" style="width: 100.0%; height: 100.0%;"><b>КП 155</b> · Этап 3<br>Лермонтовский пр., д. 43/1<br><i>Фонтан в сквере перед зданием</i><br><b>Задание:</b> Количество торчащих из воды форсунок, из которых могут бить струи фонтана<br><details><summary>Правильный ответ</summary><b>44</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_c2664c452e0ef97487a45eb184e69135 = $(`<div id="html_c2664c452e0ef97487a45eb184e69135" style="width: 100.0%; height: 100.0%;"><b>КП 253</b> · Этап 3<br>Наб. Обводного канала, д. 167а<br><b>Задание:</b> Количество водосточных труб<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Провиантские магазины на Обводном канале были построены в 1819–1821 годах по проекту Василия Петровича Стасова для лейб-гвардии Измайловского полка. Магазинами в то время называли военные склады, предназначенные для хранения продовольствия. На Обводном планировалось разместить «35 тысяч кулей» провианта. За основу проекта Стасов взял Троицкие провиантские магазины авторства Фёдора Ивановича Демерцова, построенные в 1808 году (не сохранились).<br><br>Четыре двухэтажных корпуса расположены у южной стороны полкового плаца. Кроме непосредственно материальной задачи, магазины выполнили ещё и художественную, став частью оформления набережной Обводного канала. Выходящим на него строгим классическим фасадам придают парадный вид гладкие ризалиты и аттики.<br><br>В 1915-1916 годах два западных корпуса объединили и приспособили под манеж Николаевского кавалерийского училища. Соединил корпуса шестиколонный дорический портик под гладким фронтоном. Очередная реконструкция комплекса прошла в 1950-е годы – тогда, в частности, были изменены оконные проёмы.<br><br>На илл.:<br><br>Мстислав Валерианович Добужинский. Петербург. Обводный канал. 1902 год.<img src="https://img.runcity.org/storage/e/47/289d62d71984688f44739cc8ce94947e.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_676169e53699c2c2b621a3c02a95b0d3 = $(`<div id="html_676169e53699c2c2b621a3c02a95b0d3" style="width: 100.0%; height: 100.0%;"><b>КП 145</b> · Этап 4<br>Никольская пл., д. 1а<br><i>Вход со стороны Никольского сквера Табличка над дверью</i><br><b>Задание:</b> Верхнее слово<br><details><summary>Правильный ответ</summary><b>испытание</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Никольский сад был разбит ещё в XVIII веке. В 1753-1762 годах в его центре по проекту архитектора Саввы Ивановича Чевакинского был построен Никольский морской собор, по которому сад и был назван.<br><br>Отдельно стоящая четырёхъярусная колокольня собора, завершенная высоким шпилем, была возведена в 1755-1758 годах. С 1870 года при Никольском соборе действовало благотворительное общество со школой, больницей, приютом и женской богадельней. После Октябрьской революции собор не был закрыт, а в 1941-1999 годах он и вовсе был кафедральным — на хорах собора даже жили Ленинградские митрополиты. Кроме сада, собор дал название Никольским площади, переулку, рынку, а также Старо- и Ново-Никольскому мостам.<br><br>На илл.:<br><br>Зинаида Серебрякова. Никольский собор. 1910 год.<img src="https://img.runcity.org/storage/5/c1/28089cb46c115282c300481d15bbdc15.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_d805863ab6b0aa64737dc6a334afa2e5 = $(`<div id="html_d805863ab6b0aa64737dc6a334afa2e5" style="width: 100.0%; height: 100.0%;"><b>КП 33</b> · Этап 5<br>Ул. Декабристов, д. 34<br><i>Стена со стороны Крюкова канала. Пластиковая табличка с исторической справкой про рынок</i><br><b>Задание:</b> Фамилия на букву &quot;Д&quot;<br><details><summary>Правильный ответ</summary><b>Даймонд</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_270aaf874b7e9135f05b7edd7e5f1b02 = $(`<div id="html_270aaf874b7e9135f05b7edd7e5f1b02" style="width: 100.0%; height: 100.0%;"><b>КП 36</b> · Этап 5<br>Ул. Декабристов, д. 54а<br><i>Плакат с исторической информацией на трёх языках на стене рядом со входом</i><br><b>Задание:</b> Перепишите последнее слово текста на эстонском языке<br><details><summary>Правильный ответ</summary><b>toel</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Эстонская община в столице с середины XVIII века постоянно росла. В Петербург постоянно приезжали эстонские подённые рабочие, домашняя прислуга, солдаты и матросы. Первоначально они посещали богослужения вместе с финнами. В 1787-1801 годах службы на эстонском языке проводились в немецкой церкви при 1-м Сухопутном кадетском корпусе на Васильевском острове. После упразднения этой церкви в 1839 году эстонцев приняла шведская церковь на Малой Конюшенной улице.<br><br>В начале 1840-х годов община арендовала в Дровяном переулке дом для богослужений. Отделку домовой церкви выполнил Владимир Андреевич Шрейбер. В 1850-х годах и она стала тесной: потребовался новый храм, способный вместить множество эстонских прихожан, включая служивших в гвардии.<br><br>Поэтому в 1859-1860 годах на Офицерской улице (современной улице Декабристов) по проекту Геральда Андреевича Боссе в псевдороманском стиле была построена Церковь Святого Апостола Иоанна (Яани Кирик). В её приходе было более двадцати тысяч человек. В церковном доме, построенном одновременно с Яани Кирик, размещались сиротский приют, богадельня и эстонская школа. С противоположной стороны от храма, на углу с Мастерской улицей, в 1909-1911 годах был возведён шестиэтажный доходный дом в стиле модерн, тоже принадлежавший эстонской церкви.<br><br>В 1931 году здание церкви было отдано под клуб и перестроено в стиле конструктивизм. Её колокольня была снесена, к фасаду, выходящему на улицу Декабристов, была пристроена лестница, а сам фасад был оштукатурен.<br><br>В 1997 году здание церкви было возвращено эстонской лютеранской общине. Прежний облик храма был восстановлен в 2009-2011 годах.<br><br>На илл.:<br><br>Лютеранская церковь Святого Иоанна. Начало XX века.<img src="https://img.runcity.org/storage/5/63/9d5c0c407ed2c7a65b445c2042b40635.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_93d923f8b5ad98b47eca1b5064ddc731 = $(`<div id="html_93d923f8b5ad98b47eca1b5064ddc731" style="width: 100.0%; height: 100.0%;"><b>КП 131</b> · Этап 5<br>Пр. Римского-Корсакова, д. 24<br><i>Лестница №2</i><br><b>Задание:</b> Максимальный номер квартиры согласно данным таблички у входа<br><details><summary>Правильный ответ</summary><b>19</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исидоровская церковь на проспекте Римского-Корсакова появилась благодаря петербургской общине православных эстонцев, сформировавшейся в Коломне в конце XIX века. Храм получил своё название в честь священномученика Исидора Юрьевского — эстонского православного священника XV века, погибшего за веру.<br><br>Сначала собственного храма у общины не было, и богослужения проходили в подвале утраченной Малоколоменской Воскресенской церкви (в наши дни на её месте — Воскресенский сквер). Инициатором строительства нового храма стал священник Павел Петрович Кульбуш (Платон). Он же основал благотворительную организацию общины — Православное русско-эстонское братство в честь священномученика Исидора Юрьевского. Проект церкви поручили члену Братства, молодому архитектору Александру Артемьевичу Полещуку. Первый взнос на строительство сделал Иоанн Кронштадтский. Позднее, в 1903 году, в его же присутствии была освящена временная эстонская церковь.<br><br>Строительство пятиглавой каменной церкви в русском стиле началось в том же году. Храм был вчерне достроен в 1907 году. Кроме основного здания храма, Полещук подготовил проект целого приходского комплекса со школой, общежитием, библиотекой и помещениями для собраний. Для богослужений внутри Исидоровской церкви были предусмотрены верхний храм с тремя приделами и нижняя церковь во имя Николая Чудотворца. Иконостасы были выполнены по рисункам самого Полещука. В 1910-х годах престолы были облицованы белым каррарским мрамором.<br><br>К 1911 году приход насчитывал более 2500 человек, причём службы проходили на русском и эстонском языках. После революции храм постепенно лишился прежней общины и в 1935 году был закрыт – его здание впоследствии использовали для светских нужд. В 1994 году церковь вернули верующим, и сегодня в ней вновь проходят богослужения.<br><br>На илл.:<br><br>Поднятие крестов на эстонскую православную церковь. Сентябрь 1906 года.<img src="https://img.runcity.org/storage/d/fc/b8043e5f096856074252de487b09dfcd.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_d6c4226167c681abadbcbb55b8fbb78c = $(`<div id="html_d6c4226167c681abadbcbb55b8fbb78c" style="width: 100.0%; height: 100.0%;"><b>КП 40</b> · Этап 5<br>Псковская ул., д. 6<br><i>Сквер напротив дома. Памятник в сквере</i><br><b>Задание:</b> Количество клумб рядом с памятником<br><details><summary>Правильный ответ</summary><b>6</b></details><br>Взяли: <b>7/9</b> (78%)<br>Не взяли: P889, P888<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В конце XVIII века пустырь в конце Торговой улицы (современная Союза Печатников) назывался Козьим болотом. В 1832 году жители Малой Коломны начали сбор средств на строительство церкви на пустыре. Поводов для её возведения было два: избавление от эпидемии холеры и рождение младшего сына императора – великого князя Михаила Николаевича. Церковь Воскресения Христова и Михаила Архангела в Малой Коломне (таково её полное название) возводили на сваях — местность действительно была болотистой. Образовавшуюся вокруг площадь назвали Воскресенской — по церкви.<br><br>В 1932 году храм был взорван, а спустя двадцать лет и площадь по идеологическим причинам переименовали. Она получила название в честь изобретателя-самоучки Ивана Петровича Кулибина (хотя сам знаменитый механик здесь никогда не жил).<br><br>На илл.: Воскресенская церковь. 1900 год.<img src="https://img.runcity.org/storage/c/09/d6a3ee9933748a1598bbde462435109c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
