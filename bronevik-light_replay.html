                var html_040bb4e327c50a9f04e198180f31cb0a = $(`<div id="html_040bb4e327c50a9f04e198180f31cb0a" style="width: 100.0%; height: 100.0%;"><b>КП 90</b> · Этап 1<br>Петергофское шоссе, д. 47<br><i>Участок газона перед зданием. Закладной камень. Табличка на постаменте</i><br><b>Задание:</b> Самое длинное слово, написанное латиницей<br><details><summary>Правильный ответ</summary><b>foundation</b></details><br>Взяли: <b>33/33</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">«Балтийская жемчужина» — один из крупнейших проектов комплексного освоения территории в Санкт-Петербурге, появившийся на юго-западе города у Финского залива. Проект стартовал в 2005 году при участии китайского инвестора и задумывался как полноценный городской район с жильём, магазинами, ТРК, школами, детскими садами и другой инфраструктурой. На территории площадью около 200 гектаров многие годы формировался самостоятельный городской кластер с жилыми кварталами, общественными пространствами, каналами и набережными.<br><br>Подчиняясь единой концепции, застройка, тем не менее, демонстрирует разнообразие архитектурных решений и неоднородную высотность. Важной частью замысла стала связь района с водой и зелёными пространствами: из локаций внутри комплекса открываются виды на Финский залив, каналы и парки. Одним из самых заметных зданий проекта стал деловой центр «Балтийская жемчужина», построенный в 2006–2007 годах. Его форма обыгрывает название комплекса: изогнутый корпус напоминает раскрытую раковину, а остеклённый сферический объём внутри неё — жемчужину.<br><br>Реализация проекта не уложилась в первоначальные сроки: так, ещё в 2009 году завершение строительства планировалось на 2013 год. Одной из проблем долгое время оставалась транспортная доступность, поскольку развитие нового района опережало возможности прилегающей дорожной сети. В итоге проект «Балтийская жемчужина» был официально завершён только в сентябре 2026 года.</div></details></div>`)[0];

                var html_c26fcc8d10cb9a0d424bea966bea0f38 = $(`<div id="html_c26fcc8d10cb9a0d424bea966bea0f38" style="width: 100.0%; height: 100.0%;"><b>КП 190</b> · Этап 2<br>Пр. Ветеранов, д. 99<br><i>Лестница № 4</i><br><b>Задание:</b> Диапазон квартир на 8 этаже согласно данным таблички у входа<br><details><summary>Правильный ответ</summary><b>136-139</b></details><br>Взяли: <b>33/33</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Версий о происхождении названия «Ульянка» несколько. Одна из них связывает наименование района с церковью с созвучным названием, заложенной во времена Петра I. Менее правдоподобная — с некоей Ульяной, владевшей в этой местности кабаком. Третья — с названием финской деревни Уляля, обозначенной на чертеже Ижорской земли Андриана Шхонбека. Заселение этой территории началось вскоре после основания Санкт-Петербурга. Вдоль дороги в Петергоф появились мызы Бутурлина, Брюса, Головина, Воронцовых, Щербатовых и других приближённых императора. В 1857 году, с появлением железной дороги, Ульянка стала дачной местностью. В годы Великой Отечественной войны дачи, как и большинство зданий в районе, были уничтожены. С 1950-х годов началась активная застройка Ульянки, а в 1977 году в районе появилась станция метро «Проспект Ветеранов». Но в первую очередь, этот небольшой район, ограниченный проспектом Маршала Жукова, улицей Козлова и проспектом Народного Ополчения, знаменит своими жителями. В Ульянке жили Михаил Жванецкий, Сергей Довлатов, Иосиф Бродский и Виктор Цой. Последний — в доме 99 по проспекту Ветеранов.</div></details></div>`)[0];

                var html_887615cc6502febc5887e7f7e7a2db18 = $(`<div id="html_887615cc6502febc5887e7f7e7a2db18" style="width: 100.0%; height: 100.0%;"><b>КП 370</b> · Этап 3<br>Наземный вестибюль станции метро &quot;Путиловская&quot;<br><i>Рисунок на стене между входом и выходом</i><br><b>Задание:</b> Селфи на фоне рисунка<br><details><summary>Правильный ответ</summary><b>Селфи</b></details><br>Взяли: <b>32/33</b> (97%)<br>Не взяли: L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Станция метро «Путиловская» открылась в декабре 2025 года в Кировском районе, став одной из первых станций новой Красносельско-Калининской линии. Она получила название в память о Путиловском заводе — одном из старейших и крупнейших металлургических и машиностроительных предприятий страны, на протяжении двух веков определявшем жизнь этой части города.<br><br>Вестибюль «Путиловской» также отсылает к истории завода: над наклонным ходом эскалатора размещено масштабное панно, на котором в абстрактной форме изображены чугунолитейное, машиностроительное и художественно-литейное производства. С ним перекликается и композиция на фасаде здания станции, изображающая тоннель, «уходящий в перспективу». В оформлении подземного зала использованы сдержанные серые и металлические оттенки, натуральный камень и лаконичные геометрические формы.<br><br>«Путиловская» стала важным пересадочным узлом – через неё пассажиры переходят на соседний «Кировский завод» Кировско-Выборгской линии. Ради нового перехода пришлось изменить облик старой станции: бюст Ленина, установленный в торце центрального зала, был перенесён в полукруглую нишу между входом и выходом вестибюля «Кировского завода».</div></details></div>`)[0];

                var html_71641d93f5ea11ca9b85bf8db9c96e8d = $(`<div id="html_71641d93f5ea11ca9b85bf8db9c96e8d" style="width: 100.0%; height: 100.0%;"><b>КП 70</b> · Этап 3<br>Пр. Стачек, д. 1<br><i>Плакаты с исторической информацией на стене рядом со входом в антикварный магазин. Плакат к 100-летию Кировского района. Стикер с QR-кодом</i><br><b>Задание:</b> Самое длинное слово<br><details><summary>Правильный ответ</summary><b>болдыревской</b></details><br>Взяли: <b>31/33</b> (94%)<br>Не взяли: L633, L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">От угла загаданного дома открывается вид на Нарвские ворота — вторые по счёту. Изначально триумфальные ворота для встречи войск, победивших Наполеона, были деревянными, временными. Они находились примерно между домами 37 и 44 по современному Нарвскому проспекту.<br><br>В 1827 году проект постоянных ворот заказали Василию Петровичу Стасову. По его предложению ворота были быть установлены на гранитном цоколе, выполнены из кирпича и облицованы листовой медью. Восемь статуй гениев Славы на аттике выполнил скульптор Николай Андреевич Токарев, горельефы летящих Слав — Иван Иванович Леппе, группу колесницы богини победы — Степан Степанович Пименов и Василий Иванович Демут-Малиновский (он же создал фигуры воинов). Торжественное открытие монумента состоялось в августе 1834 года.<br><br>Ворота сильно пострадали во время Великой Отечественной войны. В послевоенной реставрации ворот в 1949-1950 годах приняли участие архитекторы Борис Александрович Розадеев и Ирина Николаевна Бенуа, а также скульптор Александр Евстафьевич Громов. С 1987 года внутри ворот работает экспозиция, посвящённая истории строительства памятника и Отечественной войне 1812 года.<br><br>На илл.: Алексей Родионович Лупанов. Нарвские ворота. 1860-е годы.<img src="https://img.runcity.org/storage/c/f7/c97c27231e70fd7e0282317741692f7c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_cee48f4a47258f5b58c7e01ec2f1015a = $(`<div id="html_cee48f4a47258f5b58c7e01ec2f1015a" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 4<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>33/33</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_6e29c3d6e29acd671253298ed51b2455 = $(`<div id="html_6e29c3d6e29acd671253298ed51b2455" style="width: 100.0%; height: 100.0%;"><b>КП 06</b> · Этап 5<br>Главная ул., д. 32<br><i>Участок ограды со стороны парка. Бетонные &quot;ступеньки&quot; под металлической оградой</i><br><b>Задание:</b> Какое животное изображено на внешней части одной из &quot;ступенек&quot;?<br><details><summary>Правильный ответ</summary><b>еж</b></details><br>Взяли: <b>28/33</b> (85%)<br>Не взяли: L659, L663, L693, L694, L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1839–1840 годах особняк генерала Никитина был перестроен в духе классицизма по проекту Алексея Максимовича Горностаева. Этот же зодчий отвечал за возведение дачи Китаевой в Царском селе и надстройку Митрополичьего корпуса Александро-Невской лавры. Строгие классические фасады и сдержанные интерьеры жилых покоев особняка Никитина резко контрастировали с пышными парадными залами. При особняке был разбит парк с прудами и водопадом «Плакун» и «Аллеей любви» из райских яблонь. При Елизавете Алексеевне в парке соорудили танцевальный павильон с эстрадой. Кроме того, в честь Елизаветы Алексеевны была названа Елизаветинская улица (сейчас она называется Главной).<br><br>В советский период особняк неоднократно менял назначение: в нём размещались клуб, кинематограф, в годы войны — интернат для детей-инвалидов. С 1960-х годов после ремонта в здании работал интернат для престарелых. В ходе многочисленных перестроек XX века здание потеряло множество деталей экстерьера и интерьера, а парк практически утратил первоначальный облик.<br><br>В 2018-2019 годах прошла комплексная реконструкция парка — была восстановлена его историческая ландшафтная планировка. В парке были проложены дорожки, высажены новые деревья и проведено лечение старых, на склонах были устроены лестницы, на аллеях — установлены скамейки. Берега пруда были укреплены. Сам парк был обнесён новой оградой. В 2021 году началась реставрация усадебного дома.<br><br>На илл.:<br><br>Парк графа Орлова-Денисова в Коломягах. 1900-е годы.<br><br>Елизавета Алексеевна Орлова-Денисова. 1860-е годы.<img src="https://img.runcity.org/storage/b/20/c366fbcf2c5003d7f2f4ba9235f1c20b.jpg" style="max-width:100%;margin-top:6px"><img src="https://img.runcity.org/storage/2/9e/ada773d0c61660070ee0dfea350a89e2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_62a059aeb89406a233baa44ab406ba82 = $(`<div id="html_62a059aeb89406a233baa44ab406ba82" style="width: 100.0%; height: 100.0%;"><b>КП 09</b> · Этап 5<br>Перекрёсток ул. 3-я линия 1-й половины и Солунской ул.<br><i>Дом Граббе на южном углу перекрёстка</i><br><b>Задание:</b> Количество фонарных столбов с двумя светильниками у забора<br><details><summary>Правильный ответ</summary><b>5</b></details><br>Взяли: <b>14/33</b> (42%)<br>Не взяли: L609, L629, L676, L612, L660, L633, L606, L601, L613, L617, L662, L659, L663, L661, L608, L693, L630, L694, L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Последним владельцем Коломяг был внук Елизаветы Алексеевны Орловой-Денисовой, граф Николай Николаевич Граббе, камергер Императорского двора, статский советник. В начале XX века для его семьи был построен небольшой особняк — на 3-й линии 1-й половины.<br><br>Дом с башней был построен в стиле модерн по проекту неизвестного зодчего предположительно в 1901-1909 годах неподалёку от железнодорожной станции. Стены двухэтажного здания были выполнены из монолитного шлакобетона, при этом на уровне второго этажа восточного фасада был использован полнотелый глиняный кирпич. Характерной особенностью особняка является свойственный модерну деревянный декор: фигурные деревянные кронштейны и резные арки под скатами крыш северного и южного фасадов. Высокая шатровая кровля над башней была утрачена в советский период.<br><br>Внешний облик здания, включая башню с шатровой кровлей, был восстановлен по архивным фотографиям в ходе масштабной реставрации 2018-2021 годов.<br><br>На илл.:<br><br>Приморская железная дорога у дома Граббе. 1910-е годы.<img src="https://img.runcity.org/storage/8/be/cce3398c83d05943d3df93ad08e4fbe8.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_df6625ac3eba2f837ae0542921800e34 = $(`<div id="html_df6625ac3eba2f837ae0542921800e34" style="width: 100.0%; height: 100.0%;"><b>КП 05</b> · Этап 5<br>Ж.д. ст. Удельная<br><i>Площадка перед павильоном платформы &quot;На Петербург&quot;. Скульптура шарманщика</i><br><b>Задание:</b> Количество монет на шарманке<br><details><summary>Правильный ответ</summary><b>7</b></details><br>Взяли: <b>30/33</b> (91%)<br>Не взяли: L692, L694, L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Название «Удельная» известно с конца XVIII века: тогда местность к северу от столицы, прежде принадлежавшую казне, передали в ведение Департамента уделов.<br><br>В начале XIX века западнее современной Удельной англичанин Александр Давидсон организовал показательную сельскохозяйственную ферму. Она дала название Фермскому шоссе. В 1832-1866 годах на территории фермы Давидсона размещалось Удельнинское земледельческое училище. При нём — в качестве учебной базы — был разбит парк. Нам он известен как Удельный. В конце 1860-х годов его разделила на две неравные части линия железной дороги Рийхимяки — Санкт-Петербург.<br><br>В 1869 году к северу от парка появилась и станция Удельная. Деревянный вокзал для неё построил архитектор Вольмер Вестлинг, автор проектов первых вокзалов станций Шувалово, Левашово и Ланская.<br><br>В 1915 году другой финский архитектор, Бруно Фердинанд Гранхольм возвёл новое здание вокзала — в стиле модерн. В том же стиле зодчий построил и новые вокзалы для станций Парголово, Ланская, Шувалово и Левашово. К 1917 году Гранхольм подготовил проекты вокзалов Раяйоки (в современном Белоострове) и Терийоки (Зеленогорск).<br><br>На илл.:<br><br>Удельная. 1910 год.<img src="https://img.runcity.org/storage/0/b0/a92deb21b5db1fedfb1ae437634efb00.JPG" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2058ec45b290aeeb5a9929f264bb989e = $(`<div id="html_2058ec45b290aeeb5a9929f264bb989e" style="width: 100.0%; height: 100.0%;"><b>КП 37</b> · Этап 6<br>Ул. Писарева. Алексеевский сад<br><i>Фонтан в саду. Охранная табличка</i><br><b>Задание:</b> Год на табличке<br><details><summary>Правильный ответ</summary><b>1885</b></details><br>Взяли: <b>26/33</b> (79%)<br>Не взяли: L663, L691, L661, L693, L630, L694, L6119<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1883-1885 годах Максимилиан Егорович Месмахер перестроил особняк на набережной Мойки в дворец для великого князя Алексея Александровича. В 1885 году зодчий перепланировал и сад при дворце.<br><br>Четвёртый сын Александра II, Алексей Александрович, с рождения был зачислен в морской гвардейский экипаж. В 1857 году он получил звание мичмана — в семь лет. С десяти лет великий князь участвовал в плаваниях на военных кораблях. В 1871-1872 годах он путешествовал на фрегате «Светлана» в составе дипломатической эскадры в Северо-Американские Соединенные Штаты. В 1880 году Алексей Александрович стал членом Государственного совета и Главным начальником флота и Морского ведомства.<br><br>Место для дворца Главного начальника флота и Морского ведомства было подобрано неслучайно: поблизости располагались казармы Гвардейского морского экипажа, Адмиралтейские верфи и Новая Голландия. Работая над проектом Алексеевского дворца, Месмахер сохранил существовавшее ранее сочетание разновеликих объёмов особняка и дополнил его двумя башнями. Доминирующее положение в новой композиции заняла четырёхъярусная башня с шатровым верхом. Со стороны реки были обустроены два подъезда: Главный и Собственный. Главный был украшен картушем с гербом великого князя и фонарями на три светильника. На балюстрадах над подъездом было установлено десять бюстов. Собственный подъезд был скромнее: его украсили шесть бюстов.<br><br>После революции дворец был национализирован. В 1920-х годах его занимало Издательство Географического института. В 1960-х годах в здание переехал трест «Ленинградоргстрой». С 2006 года в здании дворца работает Санкт-Петербургский Дом музыки.<br><br>Строительство дворца повлекло за собой прокладку новой улицы — Алексеевской (в наши дни это улица Писарева). От неё высокой каменной стеной был отделён Собственный сад, разбитый перед южным фасадом дворца. Другой сад — парадный — был обращён к Мойке. Важнейшим элементом его художественного решения стала ограда, состоящая из декоративных копий и трезубцев и украшенная коронованной монограммой «АА».<br><br>Пейзажный Собственный сад оттенял разноплановое здание дворца. Сад полностью соответствовал своему названию: там даже хоронили собак великого князя. На местах захоронений были установлены скульптуры. Перед окнами кабинета Алексея Александровича — тоже по проекту Месмахера — был сооружён гранитный фонтан. Его реставрация была проведена в 2013 году.<br><br>На илл.: Сад дворца великого князя Алексея Александровича. Конец XIX века.<img src="https://img.runcity.org/storage/f/03/b714537adf8d51c4dd540be536c1d03f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
