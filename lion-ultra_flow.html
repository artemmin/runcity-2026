                var html_2e03a2e6669c893cda493b92795bbf98 = $(`<div id="html_2e03a2e6669c893cda493b92795bbf98" style="width: 100.0%; height: 100.0%;"><b>КП 75</b> · Этап 1<br>Турбинная ул., д. 18а, лит. А<br><i>Стенд с исторической справкой в сквере рядом со зданием.</i><br><b>Задание:</b> Второе слово в первой строке под гербом<br><details><summary>Правильный ответ</summary><b>образование</b></details><br>Взяли: <b>75/75</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 2019 году скверу на северо-восточном углу Турбинной и Оборонной улиц было присвоено название — Ушаковский, «в честь купца Ушакова, много сделавшего для развития этой местности». Нынешняя улица Зои Космодемьянской носила имя купца и благотворителя вплоть до середины XX века.<br><br>Ушакову принадлежали парники и оранжереи за Нарвской заставой. Его цветы заказывали для ресторанов, гостиниц, дворцов, театров, магазинов и зимних садов. Кроме того, Ушаков был владельцем 24 доходных домов.<br><br>При этом Ушаков был крупным благотворителем. Так, на его средства были открыты бесплатное земское училище и Ушаковская больница — тоже бесплатная.<br><br>На илл.: Абрам Михайлович Ушаков<img src="https://img.runcity.org/storage/1/d2/336ba99db8675cee4c8d08468b359d21.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_1e12d4703b72dad06c513679963b84d4 = $(`<div id="html_1e12d4703b72dad06c513679963b84d4" style="width: 100.0%; height: 100.0%;"><b>КП 70</b> · Этап 1<br>Пр. Стачек, д. 1<br><i>Плакаты с исторической информацией на стене рядом со входом в антикварный магазин. Плакат к 100-летию Кировского района. Стикер с QR-кодом</i><br><b>Задание:</b> Самое длинное слово<br><details><summary>Правильный ответ</summary><b>болдыревской</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U454<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">От угла загаданного дома открывается вид на Нарвские ворота — вторые по счёту. Изначально триумфальные ворота для встречи войск, победивших Наполеона, были деревянными, временными. Они находились примерно между домами 37 и 44 по современному Нарвскому проспекту.<br><br>В 1827 году проект постоянных ворот заказали Василию Петровичу Стасову. По его предложению ворота были быть установлены на гранитном цоколе, выполнены из кирпича и облицованы листовой медью. Восемь статуй гениев Славы на аттике выполнил скульптор Николай Андреевич Токарев, горельефы летящих Слав — Иван Иванович Леппе, группу колесницы богини победы — Степан Степанович Пименов и Василий Иванович Демут-Малиновский (он же создал фигуры воинов). Торжественное открытие монумента состоялось в августе 1834 года.<br><br>Ворота сильно пострадали во время Великой Отечественной войны. В послевоенной реставрации ворот в 1949-1950 годах приняли участие архитекторы Борис Александрович Розадеев и Ирина Николаевна Бенуа, а также скульптор Александр Евстафьевич Громов. С 1987 года внутри ворот работает экспозиция, посвящённая истории строительства памятника и Отечественной войне 1812 года.<br><br>На илл.: Алексей Родионович Лупанов. Нарвские ворота. 1860-е годы.<img src="https://img.runcity.org/storage/c/f7/c97c27231e70fd7e0282317741692f7c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2004e5848dca52b11508414366ee1bf2 = $(`<div id="html_2004e5848dca52b11508414366ee1bf2" style="width: 100.0%; height: 100.0%;"><b>КП 69</b> · Этап 2<br>Наб. Обводного канала, д. 199-201<br><i>Участок стены рядом с частью вагона метро. Табличка на стене между вагоном и калиткой</i><br><b>Задание:</b> Надпись на английском языке<br><details><summary>Правильный ответ</summary><b>way out</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Современное название реки Таракановки известно с 1785 года, предположительно, от фамилии владельцев завода — Таракановых. Параллельно до 1849 года существовало и название Чечереновка, произошедшее, вероятно, от фамилии землевладельца Чичерина.<br><br>Некогда её русло шло от Фонтанки (исток находился у Старо-Калинкина моста) по современной улице Циолковского, пересекало русло Обводного канала в районе Таракановского моста. Затем на месте площади Стачек в Таракановку впадала небольшая река Тентелевка (Ольховка), а Таракановка шла дальше к Екатерингофу, отделяя его от материка.<br><br>В 1906 году участок от Фонтанки до Обводного канала был засыпан и превратился в Таракановскую улицу (сейчас она носит имя Константина Эдуардовича Циолковского). В 1920-х годах вместе с Тентелевкой был засыпан и участок от Обводного канала до Бумажного, а все мосты, кроме Молвинского, были разобраны.<br><br>На илл.:<br><br>Таракановка у Нарвских ворот. Начало XX века.<img src="https://img.runcity.org/storage/2/5a/055a2f896b30ffcabb41a18edc9225a2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_6dc12c9ee001f8efc28e46080babd1cb = $(`<div id="html_6dc12c9ee001f8efc28e46080babd1cb" style="width: 100.0%; height: 100.0%;"><b>КП 76</b> · Этап 2<br>Нарвский пр., д. 1/29<br><i>Звонница, выходящая на перекрёсток Нарвского пр. и Старо-Петергофского пр.</i><br><b>Задание:</b> Количество колоколов (на территорию для выполнения задания заходить не требуется)<br><details><summary>Правильный ответ</summary><b>11</b></details><br>Взяли: <b>24/75</b> (32%)<br>Не взяли: U400, U404, U407, U408, U409, U411, U413, U419, U436, U437, U439, U447, U448, U449, U450, U477, U4102, U4113, U403, U421 … +31<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Датой основания Успенского монастыря в Старой Ладоге считается 1156 год. На его территории находится собор Успения Пресвятой Богородицы, самый северный домонгольский храм страны. Среди насельниц этой обители — царица Евдокия Лопухина, первая супруга Петра I, и Евдокия Андреевна Ганнибал, первая жена петровского крестника.<br><br>Монастырь выкупил участок под подворье на Нарвском проспекте в 1902 году — вскоре там был освящён временный деревянный храм. Каменный же храм во имя Казанской иконы Божией матери был заложен в июле 1905 года. Проект здания, построенного на пожертвования прихожан, подготовил Василий Антонович Косяков. Главный престол завершённого храма был торжественно освящён в 1910 году.<br><br>После революции подворье было ликвидировано. В 1929 году часовня и иконная лавка были отданы под жилые помещения. В 1935 году бывшую Казанскую церковь передали под универмаг.<br><br>В августе 1989 года комплекс снова стал монастырским подворьем — уже Валаамского мужского монастыря. В январе 1991 года на церкви вновь были установлены кресты. Главный престол был освящён после реставрации в апреле 1994 года. Часовня Новомучеников и Исповедников Российских была освящена в 1995 году.<br><br>На илл.:<br><br>Казанская церковь. Начало XX века.<img src="https://img.runcity.org/storage/d/39/010783c353c08bdc0480819ea59bd39d.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_c45fd48955494b6e967136bb7f7a6b25 = $(`<div id="html_c45fd48955494b6e967136bb7f7a6b25" style="width: 100.0%; height: 100.0%;"><b>КП 176</b> · Этап 2<br>Парк Екатерингоф<br><i>Дорожка, ведущая от входа с Лифляндской ул. (д. 5с) в сторону д. 5 к. 4. Участок газона рядом с дорожкой. Куб с табличкой с исторической информацией про &quot;Павильон Ферма&quot;</i><br><b>Задание:</b> Фамилии магистрантов<br><details><summary>Правильный ответ</summary><b>Костерева, Маркин</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1823 году Екатерингоф был благоустроен по инициативе военного генерал-губернатора Петербурга графа Михаила Андреевича Милорадовича — уже как общедоступный парк. По проекту Огюста Монферрана были возведены псевдоготические павильоны Ферма, Львиный и Мавританский, — а также Катальная горка и Воксхолл. Двухэтажная Ферма с башней по сути представляла собой загородный дом генерал-губернатора. Готический (Львиный) павильон был сторожевой башней на берегу Екатерингофки и мог использоваться как маяк. Огромный одноэтажный Вокзал (он же Воксхолл) с круглым танцевальным залом предназначался для балов, музыкальных вечеров и прочих увеселений.<br><br>В связи с возросшей популярностью парка городские власти выделили средства на садовника, смотрителя и другие должности. Для смотрителя в 1830-х годах даже был построен двухэтажный деревянный дом у Молвинского моста. Впрочем, к 1870-м годам парк снова постепенно пришёл в упадок — и из-за недостатка финансирования, и из-за активного строительства в районе заводов и фабрик.<br><br>На илл.: Иван Андреевич Иванов. Пейзаж с рекой. Екатерингоф. 1844 год.<img src="https://img.runcity.org/storage/4/c1/3e0735c9bf1ac80f17f4839d94765c14.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_52b8ba9a6319b5acbda4822aefd9e35a = $(`<div id="html_52b8ba9a6319b5acbda4822aefd9e35a" style="width: 100.0%; height: 100.0%;"><b>КП 34</b> · Этап 3<br>Ул. Декабристов, д. 29<br><i>Фасад, выходящий на улицу</i><br><b>Задание:</b> Крупно написанный год на уровне окон второго этажа<br><details><summary>Правильный ответ</summary><b>1950</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Дворец культуры им. Первой пятилетки. 1930 год.<img src="https://img.runcity.org/storage/7/11/c95361adaadfedff5204eba3d211c117.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_79ec08f95cf39393660b5fce8e25c7b3 = $(`<div id="html_79ec08f95cf39393660b5fce8e25c7b3" style="width: 100.0%; height: 100.0%;"><b>КП 55</b> · Этап 3<br>Лермонтовский пр., д. 43/1<br><i>Участок газона со флагштоками со стороны Лермонтовского пр.</i><br><b>Задание:</b> Количество клумб рядом со флагштоками<br><details><summary>Правильный ответ</summary><b>4</b></details><br>Взяли: <b>73/75</b> (97%)<br>Не взяли: U466, U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_342a903921158fa27d1c0bd86ba8b68f = $(`<div id="html_342a903921158fa27d1c0bd86ba8b68f" style="width: 100.0%; height: 100.0%;"><b>КП 137</b> · Этап 4<br>Ул. Писарева. Алексеевский сад<br><i>Спортивная площадка. Плакат с правилами эксплуатации</i><br><b>Задание:</b> Что имитирует степ-тренажер? (в ответ записать три слова)<br><details><summary>Правильный ответ</summary><b>подъем по ступенькам</b></details><br>Взяли: <b>69/75</b> (92%)<br>Не взяли: U417, U481, U4110, U427, U429, U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1883-1885 годах Максимилиан Егорович Месмахер перестроил особняк на набережной Мойки в дворец для великого князя Алексея Александровича. В 1885 году зодчий перепланировал и сад при дворце.<br><br>Четвёртый сын Александра II, Алексей Александрович, с рождения был зачислен в морской гвардейский экипаж. В 1857 году он получил звание мичмана — в семь лет. С десяти лет великий князь участвовал в плаваниях на военных кораблях. В 1871-1872 годах он путешествовал на фрегате «Светлана» в составе дипломатической эскадры в Северо-Американские Соединенные Штаты. В 1880 году Алексей Александрович стал членом Государственного совета и Главным начальником флота и Морского ведомства.<br><br>Место для дворца Главного начальника флота и Морского ведомства было подобрано неслучайно: поблизости располагались казармы Гвардейского морского экипажа, Адмиралтейские верфи и Новая Голландия. Работая над проектом Алексеевского дворца, Месмахер сохранил существовавшее ранее сочетание разновеликих объёмов особняка и дополнил его двумя башнями. Доминирующее положение в новой композиции заняла четырёхъярусная башня с шатровым верхом. Со стороны реки были обустроены два подъезда: Главный и Собственный. Главный был украшен картушем с гербом великого князя и фонарями на три светильника. На балюстрадах над подъездом было установлено десять бюстов. Собственный подъезд был скромнее: его украсили шесть бюстов.<br><br>После революции дворец был национализирован. В 1920-х годах его занимало Издательство Географического института. В 1960-х годах в здание переехал трест «Ленинградоргстрой». С 2006 года в здании дворца работает Санкт-Петербургский Дом музыки.<br><br>Строительство дворца повлекло за собой прокладку новой улицы — Алексеевской (в наши дни это улица Писарева). От неё высокой каменной стеной был отделён Собственный сад, разбитый перед южным фасадом дворца. Другой сад — парадный — был обращён к Мойке. Важнейшим элементом его художественного решения стала ограда, состоящая из декоративных копий и трезубцев и украшенная коронованной монограммой «АА».<br><br>Пейзажный Собственный сад оттенял разноплановое здание дворца. Сад полностью соответствовал своему названию: там даже хоронили собак великого князя. На местах захоронений были установлены скульптуры. Перед окнами кабинета Алексея Александровича — тоже по проекту Месмахера — был сооружён гранитный фонтан. Его реставрация была проведена в 2013 году.<br><br>На илл.: Сад дворца великого князя Алексея Александровича. Конец XIX века.<img src="https://img.runcity.org/storage/f/03/b714537adf8d51c4dd540be536c1d03f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_32d97a8e6cfe27e25abde1b64300a430 = $(`<div id="html_32d97a8e6cfe27e25abde1b64300a430" style="width: 100.0%; height: 100.0%;"><b>КП 236</b> · Этап 4<br>Ул. Декабристов, д. 54а<br><i>Оранжевый бокс рядом со зданием</i><br><b>Задание:</b> Первые три цифры номера телефона<br><details><summary>Правильный ответ</summary><b>332</b></details><br>Взяли: <b>73/75</b> (97%)<br>Не взяли: U451, U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Эстонская община в столице с середины XVIII века постоянно росла. В Петербург постоянно приезжали эстонские подённые рабочие, домашняя прислуга, солдаты и матросы. Первоначально они посещали богослужения вместе с финнами. В 1787-1801 годах службы на эстонском языке проводились в немецкой церкви при 1-м Сухопутном кадетском корпусе на Васильевском острове. После упразднения этой церкви в 1839 году эстонцев приняла шведская церковь на Малой Конюшенной улице.<br><br>В начале 1840-х годов община арендовала в Дровяном переулке дом для богослужений. Отделку домовой церкви выполнил Владимир Андреевич Шрейбер. В 1850-х годах и она стала тесной: потребовался новый храм, способный вместить множество эстонских прихожан, включая служивших в гвардии.<br><br>Поэтому в 1859-1860 годах на Офицерской улице (современной улице Декабристов) по проекту Геральда Андреевича Боссе в псевдороманском стиле была построена Церковь Святого Апостола Иоанна (Яани Кирик). В её приходе было более двадцати тысяч человек. В церковном доме, построенном одновременно с Яани Кирик, размещались сиротский приют, богадельня и эстонская школа. С противоположной стороны от храма, на углу с Мастерской улицей, в 1909-1911 годах был возведён шестиэтажный доходный дом в стиле модерн, тоже принадлежавший эстонской церкви.<br><br>В 1931 году здание церкви было отдано под клуб и перестроено в стиле конструктивизм. Её колокольня была снесена, к фасаду, выходящему на улицу Декабристов, была пристроена лестница, а сам фасад был оштукатурен.<br><br>В 1997 году здание церкви было возвращено эстонской лютеранской общине. Прежний облик храма был восстановлен в 2009-2011 годах.<br><br>На илл.:<br><br>Лютеранская церковь Святого Иоанна. Начало XX века.<img src="https://img.runcity.org/storage/5/63/9d5c0c407ed2c7a65b445c2042b40635.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_a055e4c9431b1404d91d672f16d4b6bf = $(`<div id="html_a055e4c9431b1404d91d672f16d4b6bf" style="width: 100.0%; height: 100.0%;"><b>КП 40</b> · Этап 4<br>Псковская ул., д. 6<br><i>Сквер напротив дома. Памятник в сквере</i><br><b>Задание:</b> Количество клумб рядом с памятником<br><details><summary>Правильный ответ</summary><b>6</b></details><br>Взяли: <b>73/75</b> (97%)<br>Не взяли: U4122, U483<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В конце XVIII века пустырь в конце Торговой улицы (современная Союза Печатников) назывался Козьим болотом. В 1832 году жители Малой Коломны начали сбор средств на строительство церкви на пустыре. Поводов для её возведения было два: избавление от эпидемии холеры и рождение младшего сына императора – великого князя Михаила Николаевича. Церковь Воскресения Христова и Михаила Архангела в Малой Коломне (таково её полное название) возводили на сваях — местность действительно была болотистой. Образовавшуюся вокруг площадь назвали Воскресенской — по церкви.<br><br>В 1932 году храм был взорван, а спустя двадцать лет и площадь по идеологическим причинам переименовали. Она получила название в честь изобретателя-самоучки Ивана Петровича Кулибина (хотя сам знаменитый механик здесь никогда не жил).<br><br>На илл.: Воскресенская церковь. 1900 год.<img src="https://img.runcity.org/storage/c/09/d6a3ee9933748a1598bbde462435109c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2e3b69746737852fa1da8cc5ef65a2d1 = $(`<div id="html_2e3b69746737852fa1da8cc5ef65a2d1" style="width: 100.0%; height: 100.0%;"><b>КП 41</b> · Этап 5<br>Пл. Тургенева, д. 1<br><i>Памятный знак в центре сквера на площади. Цитата на обратной стороне</i><br><b>Задание:</b> Первое слово цитаты<br><details><summary>Правильный ответ</summary><b>верною</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U4150<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1798-1803 годах Иван Егорович Старов построил Церковь Покрова Пресвятой Богородицы. Храм, средства на строительство которого собрали сами прихожане, стал последней работой зодчего. Западный фасад однокупольной церкви в стиле классицизм был оформлен дорическим портиком, над которым возвышалась двухъярусная колокольня со шпилем. По церкви получили название площадь (ныне площадь Тургенева), сквер и остров, на котором она находилась.<br><br>В 1934 году храм был снесён.<br><br>По воскресеньям, летом и зимою,<br><br>Вдова ходила с нею к Покрову,<br><br>И становилася перед толпою<br><br>У крылоса налево. Я живу<br><br>Теперь не там, но верною мечтою<br><br>Люблю летать, заснувши наяву,<br><br>В Коломну, к Покрову — и в воскресенье<br><br>Там слушать русское богослуженье.<br><br>Александр Сергеевич Пушкин. Домик в Коломне.<br><br>На илл.:<br><br>Церковь Покрова Пресвятой Богородицы. Конец XIX века<img src="https://img.runcity.org/storage/6/ed/caf921bad2ebf4df2a4fc9d817941ed6.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_540ca9858e9e67a84aa010f4475d5eaf = $(`<div id="html_540ca9858e9e67a84aa010f4475d5eaf" style="width: 100.0%; height: 100.0%;"><b>КП 167</b> · Этап 5<br>Старо-Петергофский пр., д. 19<br><i>Мемориальная табличка на стене дома</i><br><b>Задание:</b> Перепешите первые буквы первых четырех строк<br><details><summary>Правильный ответ</summary><b>всни</b></details><br>Взяли: <b>74/75</b> (99%)<br>Не взяли: U461<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1707 году в Екатерингофе была возведена первая деревянная церковь. В 1721 году она был разобрана: вместо неё новая церковь Святой Екатерины была устроена в здании казённой мануфактуры. При Екатерине II здание мануфактуры было передано Калинкинской больнице, и в 1784 году рядом с ней был построен новый деревянный Екатерининский храм. Когда он обветшал, в 1831–1837 годах на замену ему по проекту архитектора Константина Андреевича Тона возведена каменная церковь в русском стиле. Церковь эта находилась на месте современного дома 6 по Старо-Петергофскому проспекту. В 1871–1873 годах к ней пристроена колокольня по проекту Василия Андриановича Дорогулина. Екатерингоф остался не только в приходе храма, но и в его названии — несмотря на то, что храм давно покинул пределы парка.<br><br>Храм был разобран в 1929 году.<br><br>На илл.: Церковь святой Екатерины в Екатерингофе. 1857 год<img src="https://img.runcity.org/storage/b/ba/3a85d469dc8c5dc781f1984dbe0cdbab.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
