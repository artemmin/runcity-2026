                var html_b8171f3b9fa6613e1f1199fb65930370 = $(`<div id="html_b8171f3b9fa6613e1f1199fb65930370" style="width: 100.0%; height: 100.0%;"><b>КП 185</b> · Этап 1<br>Пр. Стачек, д. 67, к. 3<br><i>Сквер Маринеско рядом с домом. Табличка на постаменте памятника</i><br><b>Задание:</b> Самое длинное слово в кавычках<br><details><summary>Правильный ответ</summary><b>стоуннеруд</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Территория района Автово была заселена уже в XVII веке, когда Ингерманландией ещё владела Швеция. Так, на составленной по архивным данным 1676 года карте Августа Ивановича Бергенгейма, топографа XIX века, встречается название «Autowa», восходящее, вероятно, к финским словам со значениями «пустошь», «пустынный». В первые годы после основания Санкт-Петербурга рядом с деревней Автово была проложена дорога, связавшая столицу с Петергофом. По левую руку от Петергофской дороги возникла деревня Ямская Слобода. Недалеко от нее, на берегу реки Красненькой в конце XVIII столетия появилось Красненькое кладбище. После того, как деревни Автово и Емельяновка были уничтожены наводнением 1824 года, их восстановление было поручено архитектору Василию Петровичу Стасову. Застройка по проекту Стасова сохранилась в районе до самых 1930-х годов. В начале XIX века в район реки Емельяновки был переведен Кронштадтский Казенный чугунолитейный завод, впоследствии приобретенный Николаем Ивановичем Путиловым, благодаря которому был вырыт Морской канал и построены Морской порт и Путиловские верфи. К концу века через Автово была проложена Окружная железная дорога, связавшая Путиловский завод с Балтийской железной дорогой. В ознаменование горячего участия жителей района в трех русских революциях Петергофское шоссе было переименовано в улицу Стачек, получившую в 1940 году статус проспекта. Автово стало частью города лишь в 1917 году, но перестало считаться окраиной лишь после Великой Отечественной войны, а в топонимике некогда фронтового района отразился героизм защитников Ленинграда. По названию местности в 1955 году получила наименование станция метро «Автово», а в 1956 году – Автовская улица (Автовская прорезка) между улицей Возрождения и проспектом Стачек.</div></details></div>`)[0];

                var html_0253ba418e8ae4ecb17a91eb26468459 = $(`<div id="html_0253ba418e8ae4ecb17a91eb26468459" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Бонусные КП<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>13/15</b> (87%)<br>Не взяли: L230, L261<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_1619a6402f19a86f000eda5578148e80 = $(`<div id="html_1619a6402f19a86f000eda5578148e80" style="width: 100.0%; height: 100.0%;"><b>КП 106</b> · Бонусные КП<br>Афанасьевская улица, д. 16<br><i>Вход со стороны Детской железной дороги.\nВензель возле калитки</i><br><b>Задание:</b> Буквы на вензеле (без пробелов и запятых)<br><details><summary>Правильный ответ</summary><b>КВ; ВК</b></details><br>Взяли: <b>9/15</b> (60%)<br>Не взяли: L247, L276, L230, L239, L290, L261<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Идею строительства детской железной дороги (ДЖД) в Ленинграде впервые высказал начальник железнодорожной лаборатории Дворца пионеров Адольф Петрович Синявский в 1939 году. На рассмотрение Народному комиссариату путей сообщения были подготовлены два проекта. Первый маршрут вёл от Витебского вокзала до Детского села, причём вокзалом главной станции должен был стать бывший Императорский павильон. Второй маршрут мог бы пойти от Финляндского железнодорожного моста вдоль реки Оккервиль до Невского лесопарка. Однако из-за начала Великой Отечественной войны ни один из проектов не был реализован.<br><br>В октябре 1946 года Синявский вновь поднял вопрос о строительстве детской железной дороги, и уже в январе следующего года соответствующее решение принял Исполком Ленсовета. По новому проекту, двухпутная ветка длиной около 9 километров должна была пройти от ЦПКиО имени Кирова вдоль Комендантского аэродрома, через Коломяги до Озерков — повторяя дореволюционную Озерковскую линию Приморской железной дороги.<br><br>В августе 1948 года состоялось открытие дороги — однопутной, протяжённостью 8,1 километра, с тремя станциями: Кировская, Зоопарк и Озёрная. Последняя сохранилась на своём месте, Кировская располагалась неподалёку от ЦПКиО, а Зоопарк — у церкви Димитрия Солунского.<br><br>В августе 1964 года на переезде у станции Зоопарк дрезина с юными железнодорожниками попала под колёса самосвала— погибло пять человек. После трагедии Детская железная дорога оказалась на грани закрытия. Её спасло лишь компромиссное решение: закрытие опасного перегона Кировская—Зоопарк. Протяжённость дороги сократилась до 3,1 километра. А в 1991 году она уменьшилась до двух километров — часть территории отдали под жилищное строительство. У железной дороги осталось две станции: Озёрная и Юный.<br><br>В 2011 году открылся новый участок Малой Октябрьской железной дороги — на юге. Ветка протяжённостью 10,8 километра соединила Купчино (станция Молодёжная) и город Пушкин (станция Царскосельская).<br><br>На илл.:<br><br>Станция Озёрная. 1948 год.<img src="https://img.runcity.org/storage/2/d1/2fdaa744a18502ac9f49b8fb3ba62d12.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_e2b82b91c9cf015e0b4590cf08a5c690 = $(`<div id="html_e2b82b91c9cf015e0b4590cf08a5c690" style="width: 100.0%; height: 100.0%;"><b>КП 05</b> · Этап 2<br>Ж.д. ст. Удельная<br><i>Площадка перед павильоном платформы &quot;На Петербург&quot;. Скульптура шарманщика</i><br><b>Задание:</b> Количество монет на шарманке<br><details><summary>Правильный ответ</summary><b>7</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Название «Удельная» известно с конца XVIII века: тогда местность к северу от столицы, прежде принадлежавшую казне, передали в ведение Департамента уделов.<br><br>В начале XIX века западнее современной Удельной англичанин Александр Давидсон организовал показательную сельскохозяйственную ферму. Она дала название Фермскому шоссе. В 1832-1866 годах на территории фермы Давидсона размещалось Удельнинское земледельческое училище. При нём — в качестве учебной базы — был разбит парк. Нам он известен как Удельный. В конце 1860-х годов его разделила на две неравные части линия железной дороги Рийхимяки — Санкт-Петербург.<br><br>В 1869 году к северу от парка появилась и станция Удельная. Деревянный вокзал для неё построил архитектор Вольмер Вестлинг, автор проектов первых вокзалов станций Шувалово, Левашово и Ланская.<br><br>В 1915 году другой финский архитектор, Бруно Фердинанд Гранхольм возвёл новое здание вокзала — в стиле модерн. В том же стиле зодчий построил и новые вокзалы для станций Парголово, Ланская, Шувалово и Левашово. К 1917 году Гранхольм подготовил проекты вокзалов Раяйоки (в современном Белоострове) и Терийоки (Зеленогорск).<br><br>На илл.:<br><br>Удельная. 1910 год.<img src="https://img.runcity.org/storage/0/b0/a92deb21b5db1fedfb1ae437634efb00.JPG" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_aff02ce70c7c93228b568b97c6705474 = $(`<div id="html_aff02ce70c7c93228b568b97c6705474" style="width: 100.0%; height: 100.0%;"><b>КП 02</b> · Этап 3<br>Пересечение Парашютной ул. и Солунской ул.<br><i>Церковь Димитрия Солунского. Любые ворота со стороны Солунской улицы. Таблички</i><br><b>Задание:</b> Причастие<br><details><summary>Правильный ответ</summary><b>Действующий</b></details><br>Взяли: <b>14/15</b> (93%)<br>Не взяли: L261<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Долгое время ближайшим к Коломягам храмом оставалась Благовещенская церковь, построенная ещё в середине XVIII века в Старой Деревне. Меж тем, в деревне к концу XIX столетия проживало около тысячи человек, и ещё четыре тысячи — приезжали летом на дачи. Испытывая потребность в новом храме, крестьяне на сходе в 1883 году постановили построить на горе, при въезде в деревню, каменную часовню Александра Невского — в память о покойном Александре II (на углу 1-й Никитинской улицы и Земледельческого переулка).<br><br>Одной небольшой часовни оказалось недостаточно, и в конце 1890-х годов начался сбор средств на строительство нового тёплого храма. Землю и 5000 рублей на строительство выделил Алексей Фёдорович Орлов-Денисов-Никитин, сын Елизаветы Алексеевны.<br><br>Однопрестольный деревянный храм, посвященный освобождению крестьян и открытию Государственной думы, был построен в 1906 году. Освящён же храм был в честь святого великомученика Димитрия Солунского. За всю свою историю этот храм закрывался лишь на несколько месяцев и оставался действующим даже в дни Блокады.<br><br>Часовня Александра Невского была отреставрирована и вновь освящена в 1990 году, а церковь Димитрия Солунского была отремонтирована в 2006 году. В 2016 году у церкви был установлен памятник Николаю Чудотворцу.<br><br>На илл.:<br><br>Храм Димитрия Солунского. Начало XX века.<img src="https://img.runcity.org/storage/7/7e/d16bd3e480b845d5df1c778261bcc7e7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_a67923c3025f8ac51683f594e4cca435 = $(`<div id="html_a67923c3025f8ac51683f594e4cca435" style="width: 100.0%; height: 100.0%;"><b>КП 06</b> · Этап 3<br>Главная ул., д. 32<br><i>Участок ограды со стороны парка. Бетонные &quot;ступеньки&quot; под металлической оградой</i><br><b>Задание:</b> Какое животное изображено на внешней части одной из &quot;ступенек&quot;?<br><details><summary>Правильный ответ</summary><b>еж</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1839–1840 годах особняк генерала Никитина был перестроен в духе классицизма по проекту Алексея Максимовича Горностаева. Этот же зодчий отвечал за возведение дачи Китаевой в Царском селе и надстройку Митрополичьего корпуса Александро-Невской лавры. Строгие классические фасады и сдержанные интерьеры жилых покоев особняка Никитина резко контрастировали с пышными парадными залами. При особняке был разбит парк с прудами и водопадом «Плакун» и «Аллеей любви» из райских яблонь. При Елизавете Алексеевне в парке соорудили танцевальный павильон с эстрадой. Кроме того, в честь Елизаветы Алексеевны была названа Елизаветинская улица (сейчас она называется Главной).<br><br>В советский период особняк неоднократно менял назначение: в нём размещались клуб, кинематограф, в годы войны — интернат для детей-инвалидов. С 1960-х годов после ремонта в здании работал интернат для престарелых. В ходе многочисленных перестроек XX века здание потеряло множество деталей экстерьера и интерьера, а парк практически утратил первоначальный облик.<br><br>В 2018-2019 годах прошла комплексная реконструкция парка — была восстановлена его историческая ландшафтная планировка. В парке были проложены дорожки, высажены новые деревья и проведено лечение старых, на склонах были устроены лестницы, на аллеях — установлены скамейки. Берега пруда были укреплены. Сам парк был обнесён новой оградой. В 2021 году началась реставрация усадебного дома.<br><br>На илл.:<br><br>Парк графа Орлова-Денисова в Коломягах. 1900-е годы.<br><br>Елизавета Алексеевна Орлова-Денисова. 1860-е годы.<img src="https://img.runcity.org/storage/b/20/c366fbcf2c5003d7f2f4ba9235f1c20b.jpg" style="max-width:100%;margin-top:6px"><img src="https://img.runcity.org/storage/2/9e/ada773d0c61660070ee0dfea350a89e2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_1e02592250a2f5cdd9bf64be90ddd6e4 = $(`<div id="html_1e02592250a2f5cdd9bf64be90ddd6e4" style="width: 100.0%; height: 100.0%;"><b>КП 07</b> · Этап 3<br>Пересечение Земского пер. и Вербной ул.<br><i>Пространство &quot;Крылатые качели&quot; неподалеку от пересечения. Изображение книги на стойке</i><br><b>Задание:</b> Фамилия автора на обложке<br><details><summary>Правильный ответ</summary><b>Бухарев</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В начале XVIII века Коломяги входили в состав мызы Каменный Нос, принадлежавшей Андрею Ивановичу Остерману, сподвижнику Петра I, одному из высших сановников Российской империи. В 1746 году Елизавета Петровна передала мызу своему канцлеру, Алексею Петровичу Бестужеву-Рюмину. В 1760-е годы тот построил на набережной Большой Невки в Старой Деревне деревянную церковь Благовещения Пресвятой Богородицы. По ней мыза получила второе название — село Благовещенское. В 1789 году «село Благовещенское, Каменный Нос тож, с деревнями Новой, Старой и Коломягами» приобрёл горнозаводчик Сергей Саввич Яковлев. В 1834 году Коломяги перешли его зятю, генералу, герою Отечественной войны 1812 года, Алексею Петровичу Никитину. В 1858 году имение унаследовали его дочь Елизавета Алексеевна и её муж, граф Фёдор Васильевич Орлов-Денисов. В 1898 году хозяевами Коломяг стали супруги Мария Николаевна и Николай Николаевич Граббе — внук Елизаветы Алексеевны. После смерти супруга в 1913 году Мария Николаевна пять лет — до эмиграции — жила в усадьбе со своими детьми.<br><br>На илл.: Пимен Орлов. Портрет Алексея Петровича Никитина. 1840-е годы.<img src="https://img.runcity.org/storage/4/1f/435c200a6981e28e323fbabba15601f4.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_ce568ff6024b2ce39ab9b04a75606ac1 = $(`<div id="html_ce568ff6024b2ce39ab9b04a75606ac1" style="width: 100.0%; height: 100.0%;"><b>КП 33</b> · Этап 4<br>Ул. Декабристов, д. 34<br><i>Стена со стороны Крюкова канала. Пластиковая табличка с исторической справкой про рынок</i><br><b>Задание:</b> Фамилия на букву &quot;Д&quot;<br><details><summary>Правильный ответ</summary><b>Даймонд</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_d925676a23a7778933a0339bd242b028 = $(`<div id="html_d925676a23a7778933a0339bd242b028" style="width: 100.0%; height: 100.0%;"><b>КП 41</b> · Этап 4<br>Пл. Тургенева, д. 1<br><i>Памятный знак в центре сквера на площади. Цитата на обратной стороне</i><br><b>Задание:</b> Первое слово цитаты<br><details><summary>Правильный ответ</summary><b>верною</b></details><br>Взяли: <b>15/15</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1798-1803 годах Иван Егорович Старов построил Церковь Покрова Пресвятой Богородицы. Храм, средства на строительство которого собрали сами прихожане, стал последней работой зодчего. Западный фасад однокупольной церкви в стиле классицизм был оформлен дорическим портиком, над которым возвышалась двухъярусная колокольня со шпилем. По церкви получили название площадь (ныне площадь Тургенева), сквер и остров, на котором она находилась.<br><br>В 1934 году храм был снесён.<br><br>По воскресеньям, летом и зимою,<br><br>Вдова ходила с нею к Покрову,<br><br>И становилася перед толпою<br><br>У крылоса налево. Я живу<br><br>Теперь не там, но верною мечтою<br><br>Люблю летать, заснувши наяву,<br><br>В Коломну, к Покрову — и в воскресенье<br><br>Там слушать русское богослуженье.<br><br>Александр Сергеевич Пушкин. Домик в Коломне.<br><br>На илл.:<br><br>Церковь Покрова Пресвятой Богородицы. Конец XIX века<img src="https://img.runcity.org/storage/6/ed/caf921bad2ebf4df2a4fc9d817941ed6.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
