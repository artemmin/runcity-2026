                var html_5d6f5b8a0959fb7ee702fd36e9fa01b0 = $(`<div id="html_5d6f5b8a0959fb7ee702fd36e9fa01b0" style="width: 100.0%; height: 100.0%;"><b>КП 255</b> · Этап 1<br>Троицкий собор<br><i>Участок ограды со стороны Троицкого пр. Охранная табличка на ограде</i><br><b>Задание:</b> Последние две цифры регистрационного номера<br><details><summary>Правильный ответ</summary><b>36</b></details><br>Взяли: <b>98/98</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1754 году для Измайловского полка был заложен новый деревянный пятиглавый храм с приделом мученика Иоанна Воина на берегу реки Фонтанки. Окончательное формирование архитектурного облика военного городка Измайловского полка было завершено в 1835 году после возведения нового Троицкого собора по проекту В.П. Стасова. Деревянную церковь разобрали и на ее месте возвели новый каменный собор, ставший одной из доминант города. Стены Троицкого собора и его синий купол видны с многих площадей и улиц Петербурга.<br><br>Император Николай I подарил собору утварь из самоцветных камней. На стенах Троицкого собора висели трофейные турецкие знамена, захваченные в ходе русско-турецкой войны 1877-1878 годов. Там же хранились полковые реликвии, на стенах были установлены мраморные доски с фамилиями офицеров полка, павших в боях. В 1894-1895 годах напротив храма была построена часовня Святого Александра Невского по проекту Сергея Петровича Кондратьева.<br><br>В 1867 году именно в Троицком соборе Фёдор Михайлович Достоевский венчался с Анной Григорьевной. А в 1894 году в этом храме отпевали композитора Антона Григорьевича Рубинштейна.<br><br>На илл.: Карл Петрович Беггров. Троицкий собор Измайловского полка. 1836 год<img src="https://img.runcity.org/storage/3/7e/e204b8f7163d35d6a95084f5a1ac97e3.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_ebb92f684310637375212ae22dd0336f = $(`<div id="html_ebb92f684310637375212ae22dd0336f" style="width: 100.0%; height: 100.0%;"><b>КП 55</b> · Этап 1<br>Лермонтовский пр., д. 43/1<br><i>Участок газона со флагштоками со стороны Лермонтовского пр.</i><br><b>Задание:</b> Количество клумб рядом со флагштоками<br><details><summary>Правильный ответ</summary><b>4</b></details><br>Взяли: <b>98/98</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2772827710178ab55e3dabd6404a9f2c = $(`<div id="html_2772827710178ab55e3dabd6404a9f2c" style="width: 100.0%; height: 100.0%;"><b>КП 31</b> · Этап 2<br>Пр. Римского-Корсакова, д. 24<br><i>Сквер рядом с домом. Скульптурная композиция в сквере</i><br><b>Задание:</b> Фамилия на хлястике<br><details><summary>Правильный ответ</summary><b>Крьлов</b></details><br>Взяли: <b>95/98</b> (97%)<br>Не взяли: m449, m4127, m4150<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исидоровская церковь на проспекте Римского-Корсакова появилась благодаря петербургской общине православных эстонцев, сформировавшейся в Коломне в конце XIX века. Храм получил своё название в честь священномученика Исидора Юрьевского — эстонского православного священника XV века, погибшего за веру.<br><br>Сначала собственного храма у общины не было, и богослужения проходили в подвале утраченной Малоколоменской Воскресенской церкви (в наши дни на её месте — Воскресенский сквер). Инициатором строительства нового храма стал священник Павел Петрович Кульбуш (Платон). Он же основал благотворительную организацию общины — Православное русско-эстонское братство в честь священномученика Исидора Юрьевского. Проект церкви поручили члену Братства, молодому архитектору Александру Артемьевичу Полещуку. Первый взнос на строительство сделал Иоанн Кронштадтский. Позднее, в 1903 году, в его же присутствии была освящена временная эстонская церковь.<br><br>Строительство пятиглавой каменной церкви в русском стиле началось в том же году. Храм был вчерне достроен в 1907 году. Кроме основного здания храма, Полещук подготовил проект целого приходского комплекса со школой, общежитием, библиотекой и помещениями для собраний. Для богослужений внутри Исидоровской церкви были предусмотрены верхний храм с тремя приделами и нижняя церковь во имя Николая Чудотворца. Иконостасы были выполнены по рисункам самого Полещука. В 1910-х годах престолы были облицованы белым каррарским мрамором.<br><br>К 1911 году приход насчитывал более 2500 человек, причём службы проходили на русском и эстонском языках. После революции храм постепенно лишился прежней общины и в 1935 году был закрыт – его здание впоследствии использовали для светских нужд. В 1994 году церковь вернули верующим, и сегодня в ней вновь проходят богослужения.<br><br>На илл.:<br><br>Поднятие крестов на эстонскую православную церковь. Сентябрь 1906 года.<img src="https://img.runcity.org/storage/d/fc/b8043e5f096856074252de487b09dfcd.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_0117e46a7b9e8a68b21503bfc834a937 = $(`<div id="html_0117e46a7b9e8a68b21503bfc834a937" style="width: 100.0%; height: 100.0%;"><b>КП 164</b> · Этап 3<br>Наб. р. Фонтанки, д. 166<br><i>Соседнее здание, выходящее на Либавский пер. Охранная табличка на стене со стороны Либавского переулка</i><br><b>Задание:</b> Последние две цифры номера на нижней строке<br><details><summary>Правильный ответ</summary><b>45</b></details><br>Взяли: <b>93/98</b> (95%)<br>Не взяли: m451, m419, m4127, m4131, m4150<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В конце XVIII столетия на картах столицы был обозначен Екатерингофский проспект. В состав этой длинной дороги, которая вела из центра Петербурга к летнему дворцу Екатерины I, входили современные проспект Римского-Корсакова и улица Степана Разина. Небольшой переулок, параллельный Екатерингофскому проспекту к югу от Фонтанки, тоже назывался Екатерингофским. В 1859 году, как и многие дороги Нарвской части, этот переулок был переименован в честь города одной из балтийских губерний. Он стал Либавским. В современной Латвии этот город носит название Лиепая.</div></details></div>`)[0];

                var html_dd23bfcbe7b00d5d83df283277cc522b = $(`<div id="html_dd23bfcbe7b00d5d83df283277cc522b" style="width: 100.0%; height: 100.0%;"><b>КП 167</b> · Этап 3<br>Старо-Петергофский пр., д. 19<br><i>Мемориальная табличка на стене дома</i><br><b>Задание:</b> Перепешите первые буквы первых четырех строк<br><details><summary>Правильный ответ</summary><b>всни</b></details><br>Взяли: <b>96/98</b> (98%)<br>Не взяли: m426, m4150<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1707 году в Екатерингофе была возведена первая деревянная церковь. В 1721 году она был разобрана: вместо неё новая церковь Святой Екатерины была устроена в здании казённой мануфактуры. При Екатерине II здание мануфактуры было передано Калинкинской больнице, и в 1784 году рядом с ней был построен новый деревянный Екатерининский храм. Когда он обветшал, в 1831–1837 годах на замену ему по проекту архитектора Константина Андреевича Тона возведена каменная церковь в русском стиле. Церковь эта находилась на месте современного дома 6 по Старо-Петергофскому проспекту. В 1871–1873 годах к ней пристроена колокольня по проекту Василия Андриановича Дорогулина. Екатерингоф остался не только в приходе храма, но и в его названии — несмотря на то, что храм давно покинул пределы парка.<br><br>Храм был разобран в 1929 году.<br><br>На илл.: Церковь святой Екатерины в Екатерингофе. 1857 год<img src="https://img.runcity.org/storage/b/ba/3a85d469dc8c5dc781f1984dbe0cdbab.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
