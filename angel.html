                var html_7b95eb7351a3b4bfb06cde0967b9b78a = $(`<div id="html_7b95eb7351a3b4bfb06cde0967b9b78a" style="width: 100.0%; height: 100.0%;"><b>КП 90</b> · Этап 1<br>Петергофское шоссе, д. 47<br><i>Участок газона перед зданием. Закладной камень. Табличка на постаменте</i><br><b>Задание:</b> Самое длинное слово, написанное латиницей<br><details><summary>Правильный ответ</summary><b>foundation</b></details><br>Взяли: <b>23/24</b> (96%)<br>Не взяли: 162<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">«Балтийская жемчужина» — один из крупнейших проектов комплексного освоения территории в Санкт-Петербурге, появившийся на юго-западе города у Финского залива. Проект стартовал в 2005 году при участии китайского инвестора и задумывался как полноценный городской район с жильём, магазинами, ТРК, школами, детскими садами и другой инфраструктурой. На территории площадью около 200 гектаров многие годы формировался самостоятельный городской кластер с жилыми кварталами, общественными пространствами, каналами и набережными.<br><br>Подчиняясь единой концепции, застройка, тем не менее, демонстрирует разнообразие архитектурных решений и неоднородную высотность. Важной частью замысла стала связь района с водой и зелёными пространствами: из локаций внутри комплекса открываются виды на Финский залив, каналы и парки. Одним из самых заметных зданий проекта стал деловой центр «Балтийская жемчужина», построенный в 2006–2007 годах. Его форма обыгрывает название комплекса: изогнутый корпус напоминает раскрытую раковину, а остеклённый сферический объём внутри неё — жемчужину.<br><br>Реализация проекта не уложилась в первоначальные сроки: так, ещё в 2009 году завершение строительства планировалось на 2013 год. Одной из проблем долгое время оставалась транспортная доступность, поскольку развитие нового района опережало возможности прилегающей дорожной сети. В итоге проект «Балтийская жемчужина» был официально завершён только в сентябре 2026 года.</div></details></div>`)[0];

                var html_eb27410feeed48df340302c578048649 = $(`<div id="html_eb27410feeed48df340302c578048649" style="width: 100.0%; height: 100.0%;"><b>КП 80</b> · Этап 2<br>Пр. Ветеранов, д. 123<br><i>Мемориал в сквере рядом со зданием.</i><br><b>Задание:</b> Количество противотанковых ежей (считать все, которые находятся в сквере)<br><details><summary>Правильный ответ</summary><b>10</b></details><br>Взяли: <b>16/24</b> (67%)<br>Не взяли: 132, 121, 120, 148, 116, 160, 174, 115<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исторический район Лигово находится между Петергофским шоссе, проспектом Маршала Жукова, Балтийской линией железной дороги и рекой Ивановкой. Этот район, чье название происходит от древнего финского наименования реки Дудергофки (&quot;Лига&quot; может переводиться как &quot;грязь, лужа&quot;), известен с XVI века как поселение в составе Водской пятины. В 1710 году Лига была личным имением Петра I, где селились дворцовые служители. Когда в 1716 году на Дудергофке была сооружена плотина, в этой местности образовался Лиговский пруд. Во второй половине XVIII столетия владельцем поселения стал Григорий Орлов, при котором был разбит Лиговский парк, носящий сейчас название Полежаевского.<br><br>Дачный поселок Лигово возник на рубеже XIX-XX веков к северу от одноимённой железнодорожной станции. В 1913 году в честь трёхсотлетия монаршего дома дачный посёлок получил название Романовский. Уже в 1918 году он стал Урицком (в честь председателя Петроградской ЧК Моисея Соломоновича Урицкого). В 1925 году Урицк стал городом. С 19 сентября 1941 года по 10 января 1944 года Урицк был оккупирован германскими войсками и почти полностью уничтожен в ходе боевых действий. В 1960-х годах Урицк и Лигово вошли в состав Ленинграда.</div></details></div>`)[0];

                var html_a1519ac4173ff76865015003578fcf1c = $(`<div id="html_a1519ac4173ff76865015003578fcf1c" style="width: 100.0%; height: 100.0%;"><b>КП 73</b> · Этап 3<br>Старо-Петергофский пр., д. 42<br><i>Участок стены с проемом в сквере рядом с домом</i><br><b>Задание:</b> Количество проходящих насквозь труб в верхней части стены<br><details><summary>Правильный ответ</summary><b>9</b></details><br>Взяли: <b>23/24</b> (96%)<br>Не взяли: 176<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_f20473420597e7bd5f95ff5bbea9dbe0 = $(`<div id="html_f20473420597e7bd5f95ff5bbea9dbe0" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 3<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>22/24</b> (92%)<br>Не взяли: 134, 176<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_8f32086640d8d55bb492319c672e8379 = $(`<div id="html_8f32086640d8d55bb492319c672e8379" style="width: 100.0%; height: 100.0%;"><b>КП 370</b> · Этап 3<br>Наземный вестибюль станции метро &quot;Путиловская&quot;<br><i>Рисунок на стене между входом и выходом</i><br><b>Задание:</b> Селфи на фоне рисунка<br><details><summary>Правильный ответ</summary><b>Селфи</b></details><br>Взяли: <b>22/24</b> (92%)<br>Не взяли: 162, 176<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Станция метро «Путиловская» открылась в декабре 2025 года в Кировском районе, став одной из первых станций новой Красносельско-Калининской линии. Она получила название в память о Путиловском заводе — одном из старейших и крупнейших металлургических и машиностроительных предприятий страны, на протяжении двух веков определявшем жизнь этой части города.<br><br>Вестибюль «Путиловской» также отсылает к истории завода: над наклонным ходом эскалатора размещено масштабное панно, на котором в абстрактной форме изображены чугунолитейное, машиностроительное и художественно-литейное производства. С ним перекликается и композиция на фасаде здания станции, изображающая тоннель, «уходящий в перспективу». В оформлении подземного зала использованы сдержанные серые и металлические оттенки, натуральный камень и лаконичные геометрические формы.<br><br>«Путиловская» стала важным пересадочным узлом – через неё пассажиры переходят на соседний «Кировский завод» Кировско-Выборгской линии. Ради нового перехода пришлось изменить облик старой станции: бюст Ленина, установленный в торце центрального зала, был перенесён в полукруглую нишу между входом и выходом вестибюля «Кировского завода».</div></details></div>`)[0];

                var html_b821c64be53b9f46055ff72c6f6df75a = $(`<div id="html_b821c64be53b9f46055ff72c6f6df75a" style="width: 100.0%; height: 100.0%;"><b>КП 70</b> · Этап 3<br>Пр. Стачек, д. 1<br><i>Плакаты с исторической информацией на стене рядом со входом в антикварный магазин. Плакат к 100-летию Кировского района. Стикер с QR-кодом</i><br><b>Задание:</b> Самое длинное слово<br><details><summary>Правильный ответ</summary><b>болдыревской</b></details><br>Взяли: <b>21/24</b> (88%)<br>Не взяли: 115, 162, 176<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">От угла загаданного дома открывается вид на Нарвские ворота — вторые по счёту. Изначально триумфальные ворота для встречи войск, победивших Наполеона, были деревянными, временными. Они находились примерно между домами 37 и 44 по современному Нарвскому проспекту.<br><br>В 1827 году проект постоянных ворот заказали Василию Петровичу Стасову. По его предложению ворота были быть установлены на гранитном цоколе, выполнены из кирпича и облицованы листовой медью. Восемь статуй гениев Славы на аттике выполнил скульптор Николай Андреевич Токарев, горельефы летящих Слав — Иван Иванович Леппе, группу колесницы богини победы — Степан Степанович Пименов и Василий Иванович Демут-Малиновский (он же создал фигуры воинов). Торжественное открытие монумента состоялось в августе 1834 года.<br><br>Ворота сильно пострадали во время Великой Отечественной войны. В послевоенной реставрации ворот в 1949-1950 годах приняли участие архитекторы Борис Александрович Розадеев и Ирина Николаевна Бенуа, а также скульптор Александр Евстафьевич Громов. С 1987 года внутри ворот работает экспозиция, посвящённая истории строительства памятника и Отечественной войне 1812 года.<br><br>На илл.: Алексей Родионович Лупанов. Нарвские ворота. 1860-е годы.<img src="https://img.runcity.org/storage/c/f7/c97c27231e70fd7e0282317741692f7c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_3880e0fbc738194864cd04280d073fca = $(`<div id="html_3880e0fbc738194864cd04280d073fca" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 4<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>1/24</b> (4%)<br>Не взяли: 118, 163, 151, 133, 117, 140, 132, 121, 120, 148, 116, 160, 174, 101, 126, 104, 134, 115, 162, 176 … +3<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];
