                var html_865d902054218955a348fe26ebd489f4 = $(`<div id="html_865d902054218955a348fe26ebd489f4" style="width: 100.0%; height: 100.0%;"><b>КП 90</b> · Этап 1<br>Петергофское шоссе, д. 47<br><i>Участок газона перед зданием. Закладной камень. Табличка на постаменте</i><br><b>Задание:</b> Самое длинное слово, написанное латиницей<br><details><summary>Правильный ответ</summary><b>foundation</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">«Балтийская жемчужина» — один из крупнейших проектов комплексного освоения территории в Санкт-Петербурге, появившийся на юго-западе города у Финского залива. Проект стартовал в 2005 году при участии китайского инвестора и задумывался как полноценный городской район с жильём, магазинами, ТРК, школами, детскими садами и другой инфраструктурой. На территории площадью около 200 гектаров многие годы формировался самостоятельный городской кластер с жилыми кварталами, общественными пространствами, каналами и набережными.<br><br>Подчиняясь единой концепции, застройка, тем не менее, демонстрирует разнообразие архитектурных решений и неоднородную высотность. Важной частью замысла стала связь района с водой и зелёными пространствами: из локаций внутри комплекса открываются виды на Финский залив, каналы и парки. Одним из самых заметных зданий проекта стал деловой центр «Балтийская жемчужина», построенный в 2006–2007 годах. Его форма обыгрывает название комплекса: изогнутый корпус напоминает раскрытую раковину, а остеклённый сферический объём внутри неё — жемчужину.<br><br>Реализация проекта не уложилась в первоначальные сроки: так, ещё в 2009 году завершение строительства планировалось на 2013 год. Одной из проблем долгое время оставалась транспортная доступность, поскольку развитие нового района опережало возможности прилегающей дорожной сети. В итоге проект «Балтийская жемчужина» был официально завершён только в сентябре 2026 года.</div></details></div>`)[0];

                var html_4565d80e20010680ba13a1845ea31826 = $(`<div id="html_4565d80e20010680ba13a1845ea31826" style="width: 100.0%; height: 100.0%;"><b>КП 80</b> · Этап 2<br>Пр. Ветеранов, д. 123<br><i>Мемориал в сквере рядом со зданием.</i><br><b>Задание:</b> Количество противотанковых ежей (считать все, которые находятся в сквере)<br><details><summary>Правильный ответ</summary><b>10</b></details><br>Взяли: <b>6/7</b> (86%)<br>Не взяли: P316<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исторический район Лигово находится между Петергофским шоссе, проспектом Маршала Жукова, Балтийской линией железной дороги и рекой Ивановкой. Этот район, чье название происходит от древнего финского наименования реки Дудергофки (&quot;Лига&quot; может переводиться как &quot;грязь, лужа&quot;), известен с XVI века как поселение в составе Водской пятины. В 1710 году Лига была личным имением Петра I, где селились дворцовые служители. Когда в 1716 году на Дудергофке была сооружена плотина, в этой местности образовался Лиговский пруд. Во второй половине XVIII столетия владельцем поселения стал Григорий Орлов, при котором был разбит Лиговский парк, носящий сейчас название Полежаевского.<br><br>Дачный поселок Лигово возник на рубеже XIX-XX веков к северу от одноимённой железнодорожной станции. В 1913 году в честь трёхсотлетия монаршего дома дачный посёлок получил название Романовский. Уже в 1918 году он стал Урицком (в честь председателя Петроградской ЧК Моисея Соломоновича Урицкого). В 1925 году Урицк стал городом. С 19 сентября 1941 года по 10 января 1944 года Урицк был оккупирован германскими войсками и почти полностью уничтожен в ходе боевых действий. В 1960-х годах Урицк и Лигово вошли в состав Ленинграда.</div></details></div>`)[0];

                var html_23fd0dd20d580a179899b452e48d55b0 = $(`<div id="html_23fd0dd20d580a179899b452e48d55b0" style="width: 100.0%; height: 100.0%;"><b>КП 190</b> · Этап 3<br>Пр. Ветеранов, д. 99<br><i>Лестница № 4</i><br><b>Задание:</b> Диапазон квартир на 8 этаже согласно данным таблички у входа<br><details><summary>Правильный ответ</summary><b>136-139</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Версий о происхождении названия «Ульянка» несколько. Одна из них связывает наименование района с церковью с созвучным названием, заложенной во времена Петра I. Менее правдоподобная — с некоей Ульяной, владевшей в этой местности кабаком. Третья — с названием финской деревни Уляля, обозначенной на чертеже Ижорской земли Андриана Шхонбека. Заселение этой территории началось вскоре после основания Санкт-Петербурга. Вдоль дороги в Петергоф появились мызы Бутурлина, Брюса, Головина, Воронцовых, Щербатовых и других приближённых императора. В 1857 году, с появлением железной дороги, Ульянка стала дачной местностью. В годы Великой Отечественной войны дачи, как и большинство зданий в районе, были уничтожены. С 1950-х годов началась активная застройка Ульянки, а в 1977 году в районе появилась станция метро «Проспект Ветеранов». Но в первую очередь, этот небольшой район, ограниченный проспектом Маршала Жукова, улицей Козлова и проспектом Народного Ополчения, знаменит своими жителями. В Ульянке жили Михаил Жванецкий, Сергей Довлатов, Иосиф Бродский и Виктор Цой. Последний — в доме 99 по проспекту Ветеранов.</div></details></div>`)[0];

                var html_dbe183bb662a858c120684518df3ee9d = $(`<div id="html_dbe183bb662a858c120684518df3ee9d" style="width: 100.0%; height: 100.0%;"><b>КП 73</b> · Этап 4<br>Старо-Петергофский пр., д. 42<br><i>Участок стены с проемом в сквере рядом с домом</i><br><b>Задание:</b> Количество проходящих насквозь труб в верхней части стены<br><details><summary>Правильный ответ</summary><b>9</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_c6786e812282b92bdae4b90209b1069a = $(`<div id="html_c6786e812282b92bdae4b90209b1069a" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 4<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_adf8e6ae939dc0fd3addfe892984de5a = $(`<div id="html_adf8e6ae939dc0fd3addfe892984de5a" style="width: 100.0%; height: 100.0%;"><b>КП 370</b> · Этап 4<br>Наземный вестибюль станции метро &quot;Путиловская&quot;<br><i>Рисунок на стене между входом и выходом</i><br><b>Задание:</b> Селфи на фоне рисунка<br><details><summary>Правильный ответ</summary><b>Селфи</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Станция метро «Путиловская» открылась в декабре 2025 года в Кировском районе, став одной из первых станций новой Красносельско-Калининской линии. Она получила название в память о Путиловском заводе — одном из старейших и крупнейших металлургических и машиностроительных предприятий страны, на протяжении двух веков определявшем жизнь этой части города.<br><br>Вестибюль «Путиловской» также отсылает к истории завода: над наклонным ходом эскалатора размещено масштабное панно, на котором в абстрактной форме изображены чугунолитейное, машиностроительное и художественно-литейное производства. С ним перекликается и композиция на фасаде здания станции, изображающая тоннель, «уходящий в перспективу». В оформлении подземного зала использованы сдержанные серые и металлические оттенки, натуральный камень и лаконичные геометрические формы.<br><br>«Путиловская» стала важным пересадочным узлом – через неё пассажиры переходят на соседний «Кировский завод» Кировско-Выборгской линии. Ради нового перехода пришлось изменить облик старой станции: бюст Ленина, установленный в торце центрального зала, был перенесён в полукруглую нишу между входом и выходом вестибюля «Кировского завода».</div></details></div>`)[0];

                var html_618e2dcf10562e9a90d1ccaba3489f00 = $(`<div id="html_618e2dcf10562e9a90d1ccaba3489f00" style="width: 100.0%; height: 100.0%;"><b>КП 165</b> · Этап 4<br>Площадь Балтийского вокзала<br><i>Балтийский сад</i><br><b>Задание:</b> Количество противопарковочных полусфер со стороны вокзала<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1856-1857 годах по инициативе барона Александра Людвиговича фон Штиглица была построена Петергофская железная дорога — для сообщения столицы с дачами Стрельны и Петергофа. В Петербурге для новой дороги было воздвигнуто здание Петергофского вокзала по проекту Александра Николаевича Кракау.<br><br>Симметричные башни главного фасада вокзала, двухэтажные флигели с ризалитами и их арочные проёмы отсылают к архитектуре Ренессанса. В центре фасада, выходящего на площадь, размещён полукруглый витраж. В витраже позднее были установлены уличные часы фирмы «Павел Буре».<br><br>В 1859 году начало работу ответвление Петергофской дороги — от станции Красносельская (переименованной в Лиговскую) до Красного Села. В 1864 году основную линию продлили до Ораниенбаума. Спустя шесть лет обе ветки Петергофской железной дороги выкупило Общество Балтийской железной дороги. Благодаря этой сделке линия до Красного села была продлена до Гатчины, а столичный вокзал стал называться Балтийским.<br><br>В 1931-1932 годах из-под купола здания Балтийского вокзала были убраны пути, боковые входы были закрыты, а на месте арочных окон появился центральный вход. Реконструкция прошла для открытия движения электропоездов в 1933 году. В 1955 году к вокзалу был пристроен наземный вестибюль станции метро «Балтийская».<br><br>В 1861 году в пользование Петергофской железной дороге была передана площадь перед вокзалом до набережной Обводного канала. Вскоре на площади был разбит сквер — он тоже содержался на средства железной дороги. В 1907-1908 годы вокруг сквера (в наши дни это Балтийский сад) было было проложено трамвайное кольцо. В 1965 году в сквере, напротив центрального входа в вокзал, был установлен памятник, посвящённый жителям Ленинского района, ушедшим на фронт в составе Ленинградской армии народного ополчения.<br><br>На илл.: Балтийский вокзал. 1913 год.<img src="https://img.runcity.org/storage/0/05/4c8ed293a448f698d0491b9ad906a050.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_6188f693bccbb203c1a7e9851c6e068f = $(`<div id="html_6188f693bccbb203c1a7e9851c6e068f" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 5<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>5/7</b> (71%)<br>Не взяли: P360, P361<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_c133ada54db798c6e132de5bcab46ce6 = $(`<div id="html_c133ada54db798c6e132de5bcab46ce6" style="width: 100.0%; height: 100.0%;"><b>КП 31</b> · Этап 6<br>Пр. Римского-Корсакова, д. 24<br><i>Сквер рядом с домом. Скульптурная композиция в сквере</i><br><b>Задание:</b> Фамилия на хлястике<br><details><summary>Правильный ответ</summary><b>Крьлов</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исидоровская церковь на проспекте Римского-Корсакова появилась благодаря петербургской общине православных эстонцев, сформировавшейся в Коломне в конце XIX века. Храм получил своё название в честь священномученика Исидора Юрьевского — эстонского православного священника XV века, погибшего за веру.<br><br>Сначала собственного храма у общины не было, и богослужения проходили в подвале утраченной Малоколоменской Воскресенской церкви (в наши дни на её месте — Воскресенский сквер). Инициатором строительства нового храма стал священник Павел Петрович Кульбуш (Платон). Он же основал благотворительную организацию общины — Православное русско-эстонское братство в честь священномученика Исидора Юрьевского. Проект церкви поручили члену Братства, молодому архитектору Александру Артемьевичу Полещуку. Первый взнос на строительство сделал Иоанн Кронштадтский. Позднее, в 1903 году, в его же присутствии была освящена временная эстонская церковь.<br><br>Строительство пятиглавой каменной церкви в русском стиле началось в том же году. Храм был вчерне достроен в 1907 году. Кроме основного здания храма, Полещук подготовил проект целого приходского комплекса со школой, общежитием, библиотекой и помещениями для собраний. Для богослужений внутри Исидоровской церкви были предусмотрены верхний храм с тремя приделами и нижняя церковь во имя Николая Чудотворца. Иконостасы были выполнены по рисункам самого Полещука. В 1910-х годах престолы были облицованы белым каррарским мрамором.<br><br>К 1911 году приход насчитывал более 2500 человек, причём службы проходили на русском и эстонском языках. После революции храм постепенно лишился прежней общины и в 1935 году был закрыт – его здание впоследствии использовали для светских нужд. В 1994 году церковь вернули верующим, и сегодня в ней вновь проходят богослужения.<br><br>На илл.:<br><br>Поднятие крестов на эстонскую православную церковь. Сентябрь 1906 года.<img src="https://img.runcity.org/storage/d/fc/b8043e5f096856074252de487b09dfcd.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_dfeeb3f41574c19aca6ba07ffec38154 = $(`<div id="html_dfeeb3f41574c19aca6ba07ffec38154" style="width: 100.0%; height: 100.0%;"><b>КП 69</b> · Этап 6<br>Наб. Обводного канала, д. 199-201<br><i>Участок стены рядом с частью вагона метро. Табличка на стене между вагоном и калиткой</i><br><b>Задание:</b> Надпись на английском языке<br><details><summary>Правильный ответ</summary><b>way out</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Современное название реки Таракановки известно с 1785 года, предположительно, от фамилии владельцев завода — Таракановых. Параллельно до 1849 года существовало и название Чечереновка, произошедшее, вероятно, от фамилии землевладельца Чичерина.<br><br>Некогда её русло шло от Фонтанки (исток находился у Старо-Калинкина моста) по современной улице Циолковского, пересекало русло Обводного канала в районе Таракановского моста. Затем на месте площади Стачек в Таракановку впадала небольшая река Тентелевка (Ольховка), а Таракановка шла дальше к Екатерингофу, отделяя его от материка.<br><br>В 1906 году участок от Фонтанки до Обводного канала был засыпан и превратился в Таракановскую улицу (сейчас она носит имя Константина Эдуардовича Циолковского). В 1920-х годах вместе с Тентелевкой был засыпан и участок от Обводного канала до Бумажного, а все мосты, кроме Молвинского, были разобраны.<br><br>На илл.:<br><br>Таракановка у Нарвских ворот. Начало XX века.<img src="https://img.runcity.org/storage/2/5a/055a2f896b30ffcabb41a18edc9225a2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_0c8e14407aa3e98b497222c9d4b3977a = $(`<div id="html_0c8e14407aa3e98b497222c9d4b3977a" style="width: 100.0%; height: 100.0%;"><b>КП 232</b> · Этап 6<br>Ул. Декабристов, д. 34<br><i>Велопарковка со стороны Крюкова канала. Лист с обращением и запрещающим знаком на пандусе рядом парковкой</i><br><b>Задание:</b> К владельцам чего составлено обращение?<br><details><summary>Правильный ответ</summary><b>мопедов</b></details><br>Взяли: <b>7/7</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
