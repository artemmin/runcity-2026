                var html_3eb2687bbe331603703fc679c3c2c96c = $(`<div id="html_3eb2687bbe331603703fc679c3c2c96c" style="width: 100.0%; height: 100.0%;"><b>КП 71</b> · Этап 1<br>Парк Екатерингоф. Лифляндская ул., д. 5<br><i>Участок газона севернее здания, рядом с пешеходной дорожкой. Клумба с высаженными растениями. Табличка про лаванду узколистную</i><br><b>Задание:</b> Последние две буквы последней строчки на табличке<br><details><summary>Правильный ответ</summary><b>са</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: L544<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1823 году Екатерингоф был благоустроен по инициативе военного генерал-губернатора Петербурга графа Михаила Андреевича Милорадовича — уже как общедоступный парк. По проекту Огюста Монферрана были возведены псевдоготические павильоны Ферма, Львиный и Мавританский, — а также Катальная горка и Воксхолл. Двухэтажная Ферма с башней по сути представляла собой загородный дом генерал-губернатора. Готический (Львиный) павильон был сторожевой башней на берегу Екатерингофки и мог использоваться как маяк. Огромный одноэтажный Вокзал (он же Воксхолл) с круглым танцевальным залом предназначался для балов, музыкальных вечеров и прочих увеселений.<br><br>В связи с возросшей популярностью парка городские власти выделили средства на садовника, смотрителя и другие должности. Для смотрителя в 1830-х годах даже был построен двухэтажный деревянный дом у Молвинского моста. Впрочем, к 1870-м годам парк снова постепенно пришёл в упадок — и из-за недостатка финансирования, и из-за активного строительства в районе заводов и фабрик.<br><br>На илл.: Иван Андреевич Иванов. Пейзаж с рекой. Екатерингоф. 1844 год.<img src="https://img.runcity.org/storage/4/c1/3e0735c9bf1ac80f17f4839d94765c14.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_bc7b355a14b4677faa08409e1168b19d = $(`<div id="html_bc7b355a14b4677faa08409e1168b19d" style="width: 100.0%; height: 100.0%;"><b>КП 73</b> · Этап 1<br>Старо-Петергофский пр., д. 42<br><i>Участок стены с проемом в сквере рядом с домом</i><br><b>Задание:</b> Количество проходящих насквозь труб в верхней части стены<br><details><summary>Правильный ответ</summary><b>9</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_4db65a09a2787d9c052c42d6d09be3ff = $(`<div id="html_4db65a09a2787d9c052c42d6d09be3ff" style="width: 100.0%; height: 100.0%;"><b>КП 74</b> · Этап 1<br>Парк Екатерингоф. Фундамент Екатерингофского дворца<br><i>Куб с табличкой с исторической информацией рядом с фундаментом</i><br><b>Задание:</b> Год в подписи под фотографией<br><details><summary>Правильный ответ</summary><b>1919</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1711 году Пётр I, дабы увековечить память о первой победе русского флота близ деревни Калинкиной, заложил на берегу Финского залива дворец и сад. Новую усадьбу царь назвал Екатерингофом, «двором Екатерины», и подарил своей супруге, будущей императрице Екатерине I. Вскоре к северу от Екатерингофа был построен Подзорный дворец Петра I, а к югу — более скромные дворцы Анненгоф и (ещё южнее) Елизаветгоф, предназначенные для дочерей монаршей четы.<br><br>Их младшая дочь, Елизавета Петровна, став императрицей, распорядилась провести перестройку Екатерингофского дворца и реконструкцию парка. «Разных художеств мастер» Харман ван Болос добавил к зданию второй этаж и два боковых флигеля. Петровский канал перед дворцом и пруды в парке очистили и углубили, в парке были проложены новые регулярные аллеи, высажены новые деревья, кустарники и обустроены клумбы. Появились и усадебные постройки, включавшие скотный двор и молочную ферму. После смерти императрицы парк постепенно пришёл в упадок.<br><br>После 1917 года бывший Екатерингофский дворец ненадолго занял клуб Нарвско-Петергофского района. После двух пожаров в 1920-х годах здание в конечном счёте было разобрано на дрова.<br><br>На илл.: Екатерингофский дворец. Начало XX века.<img src="https://img.runcity.org/storage/7/5c/0422b76033dc888b5f551ba97a41f5c7.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_6548a65b174d97e9d88cbfacddc69fc8 = $(`<div id="html_6548a65b174d97e9d88cbfacddc69fc8" style="width: 100.0%; height: 100.0%;"><b>КП 76</b> · Этап 1<br>Нарвский пр., д. 1/29<br><i>Звонница, выходящая на перекрёсток Нарвского пр. и Старо-Петергофского пр.</i><br><b>Задание:</b> Количество колоколов (на территорию для выполнения задания заходить не требуется)<br><details><summary>Правильный ответ</summary><b>11</b></details><br>Взяли: <b>1/9</b> (11%)<br>Не взяли: L560, L561, L565, L5116, L562, L598, L544, L5120<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Датой основания Успенского монастыря в Старой Ладоге считается 1156 год. На его территории находится собор Успения Пресвятой Богородицы, самый северный домонгольский храм страны. Среди насельниц этой обители — царица Евдокия Лопухина, первая супруга Петра I, и Евдокия Андреевна Ганнибал, первая жена петровского крестника.<br><br>Монастырь выкупил участок под подворье на Нарвском проспекте в 1902 году — вскоре там был освящён временный деревянный храм. Каменный же храм во имя Казанской иконы Божией матери был заложен в июле 1905 года. Проект здания, построенного на пожертвования прихожан, подготовил Василий Антонович Косяков. Главный престол завершённого храма был торжественно освящён в 1910 году.<br><br>После революции подворье было ликвидировано. В 1929 году часовня и иконная лавка были отданы под жилые помещения. В 1935 году бывшую Казанскую церковь передали под универмаг.<br><br>В августе 1989 года комплекс снова стал монастырским подворьем — уже Валаамского мужского монастыря. В январе 1991 года на церкви вновь были установлены кресты. Главный престол был освящён после реставрации в апреле 1994 года. Часовня Новомучеников и Исповедников Российских была освящена в 1995 году.<br><br>На илл.:<br><br>Казанская церковь. Начало XX века.<img src="https://img.runcity.org/storage/d/39/010783c353c08bdc0480819ea59bd39d.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_75bee3fbebd718821379e2cada10fdf7 = $(`<div id="html_75bee3fbebd718821379e2cada10fdf7" style="width: 100.0%; height: 100.0%;"><b>КП 40</b> · Этап 2<br>Псковская ул., д. 6<br><i>Сквер напротив дома. Памятник в сквере</i><br><b>Задание:</b> Количество клумб рядом с памятником<br><details><summary>Правильный ответ</summary><b>6</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В конце XVIII века пустырь в конце Торговой улицы (современная Союза Печатников) назывался Козьим болотом. В 1832 году жители Малой Коломны начали сбор средств на строительство церкви на пустыре. Поводов для её возведения было два: избавление от эпидемии холеры и рождение младшего сына императора – великого князя Михаила Николаевича. Церковь Воскресения Христова и Михаила Архангела в Малой Коломне (таково её полное название) возводили на сваях — местность действительно была болотистой. Образовавшуюся вокруг площадь назвали Воскресенской — по церкви.<br><br>В 1932 году храм был взорван, а спустя двадцать лет и площадь по идеологическим причинам переименовали. Она получила название в честь изобретателя-самоучки Ивана Петровича Кулибина (хотя сам знаменитый механик здесь никогда не жил).<br><br>На илл.: Воскресенская церковь. 1900 год.<img src="https://img.runcity.org/storage/c/09/d6a3ee9933748a1598bbde462435109c.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_df6da53de2c45387f286d7561d1ed466 = $(`<div id="html_df6da53de2c45387f286d7561d1ed466" style="width: 100.0%; height: 100.0%;"><b>КП 135</b> · Этап 3<br>Наб. р. Мойки. Участок напротив арки Новой Голландии<br><i>Ворота дворца Вел. кн. Ксении Александровны. Основание одного из столбов. Цифры, написанные в зеленом прямоугольнике</i><br><b>Задание:</b> Три самые нижние цифры<br><details><summary>Правильный ответ</summary><b>290</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Арка Новой Голландии появилась в XVIII веке как часть большого комплекса складов корабельного леса для Адмиралтейской верфи. Сам остров возник после прокладки Адмиралтейского и Крюкова каналов, которые были нужны для доставки материалов к верфи. По основной версии, название острова связано с «голландским» способом хранения древесины — брёвна здесь сушили и хранили вертикально. Каменные склады начали строить в 1765 году по проекту Саввы Ивановича Чевакинского, а фасады и знаменитую арку спроектировал французский архитектор Жан-Батист Валлен-Деламот.<br><br>Арка через проток, соединяющий внутренний бассейн Новой Голландии с Мойкой, стала центральным элементом фасада складского комплекса. С практической стороны, её конструкция должна была гасить давление брёвен, опиравшихся на торцевые стены складов. Кроме того, по изначальному замыслу, у комплекса должна была появиться и вторая арка – со стороны Крюкова канала, но этот проект так и не был реализован. Валлен-Деламот подготовил проект ещё в середине 1760-х годов, но из-за неточностей в расчётах его пришлось дорабатывать. Строительство началось в 1770 году и закончилось лишь спустя семь лет, причём уже в 1782 году началась реконструкция антамблемента, продлившаяся два года.<br><br>Монументальный портал со стороны Мойки выглядит особенно выразительно благодаря сочетанию красного кирпича и массивных гранитных колонн тосканского ордера. Полуциркульный проём арки украшен триглифами и изящной гирляндой и обрамлён небольшими колоннами, поставленными по берегам протока, ведущего во внутренний бассейн. Высота арки — 23 метра, а ширина пролёта — чуть более восьми метров. Сегодня арка является одним из символов Новой Голландии и одним из важнейших памятников раннего петербургского классицизма.<br><br>Андрей Ефимович Мартынов. Новая Голландия. 1820-е годы.<img src="https://img.runcity.org/storage/3/c9/6e60ac71de5d609f542d91366994fc93.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2b42e997342d11b31951aa8ca8e090e5 = $(`<div id="html_2b42e997342d11b31951aa8ca8e090e5" style="width: 100.0%; height: 100.0%;"><b>КП 137</b> · Этап 3<br>Ул. Писарева. Алексеевский сад<br><i>Спортивная площадка. Плакат с правилами эксплуатации</i><br><b>Задание:</b> Что имитирует степ-тренажер? (в ответ записать три слова)<br><details><summary>Правильный ответ</summary><b>подъем по ступенькам</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1883-1885 годах Максимилиан Егорович Месмахер перестроил особняк на набережной Мойки в дворец для великого князя Алексея Александровича. В 1885 году зодчий перепланировал и сад при дворце.<br><br>Четвёртый сын Александра II, Алексей Александрович, с рождения был зачислен в морской гвардейский экипаж. В 1857 году он получил звание мичмана — в семь лет. С десяти лет великий князь участвовал в плаваниях на военных кораблях. В 1871-1872 годах он путешествовал на фрегате «Светлана» в составе дипломатической эскадры в Северо-Американские Соединенные Штаты. В 1880 году Алексей Александрович стал членом Государственного совета и Главным начальником флота и Морского ведомства.<br><br>Место для дворца Главного начальника флота и Морского ведомства было подобрано неслучайно: поблизости располагались казармы Гвардейского морского экипажа, Адмиралтейские верфи и Новая Голландия. Работая над проектом Алексеевского дворца, Месмахер сохранил существовавшее ранее сочетание разновеликих объёмов особняка и дополнил его двумя башнями. Доминирующее положение в новой композиции заняла четырёхъярусная башня с шатровым верхом. Со стороны реки были обустроены два подъезда: Главный и Собственный. Главный был украшен картушем с гербом великого князя и фонарями на три светильника. На балюстрадах над подъездом было установлено десять бюстов. Собственный подъезд был скромнее: его украсили шесть бюстов.<br><br>После революции дворец был национализирован. В 1920-х годах его занимало Издательство Географического института. В 1960-х годах в здание переехал трест «Ленинградоргстрой». С 2006 года в здании дворца работает Санкт-Петербургский Дом музыки.<br><br>Строительство дворца повлекло за собой прокладку новой улицы — Алексеевской (в наши дни это улица Писарева). От неё высокой каменной стеной был отделён Собственный сад, разбитый перед южным фасадом дворца. Другой сад — парадный — был обращён к Мойке. Важнейшим элементом его художественного решения стала ограда, состоящая из декоративных копий и трезубцев и украшенная коронованной монограммой «АА».<br><br>Пейзажный Собственный сад оттенял разноплановое здание дворца. Сад полностью соответствовал своему названию: там даже хоронили собак великого князя. На местах захоронений были установлены скульптуры. Перед окнами кабинета Алексея Александровича — тоже по проекту Месмахера — был сооружён гранитный фонтан. Его реставрация была проведена в 2013 году.<br><br>На илл.: Сад дворца великого князя Алексея Александровича. Конец XIX века.<img src="https://img.runcity.org/storage/f/03/b714537adf8d51c4dd540be536c1d03f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_d2be612c89c504ad57efe8c628be7362 = $(`<div id="html_d2be612c89c504ad57efe8c628be7362" style="width: 100.0%; height: 100.0%;"><b>КП 232</b> · Этап 3<br>Ул. Декабристов, д. 34<br><i>Велопарковка со стороны Крюкова канала. Лист с обращением и запрещающим знаком на пандусе рядом парковкой</i><br><b>Задание:</b> К владельцам чего составлено обращение?<br><details><summary>Правильный ответ</summary><b>мопедов</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Литовский рынок (со стороны Офицерской улицы и Минского переулка). Начало XX века.<img src="https://img.runcity.org/storage/2/49/3032ffd0dec57c386ac56c608a151492.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_fe3b486f947fde2bebfeef26b9a31f09 = $(`<div id="html_fe3b486f947fde2bebfeef26b9a31f09" style="width: 100.0%; height: 100.0%;"><b>КП 140</b> · Этап 3<br>Пр. Римского-Корсакова, д. 33<br><i>Табличка с QR-кодом, располагающаяся под адресной</i><br><b>Задание:</b> Четырехзначное число в ссылке<br><details><summary>Правильный ответ</summary><b>2612</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: L5120<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Напротив указанного дома расположен Никольский сад, разбитый ещё в XVIII веке. В 1753-1762 годах в его центре по проекту архитектора Саввы Ивановича Чевакинского был построен Никольский морской собор, по которому сад и был назван.<br><br>Отдельно стоящая четырёхъярусная колокольня собора, завершенная высоким шпилем, была возведена в 1755-1758 годах. С 1870 года при Никольском соборе действовало благотворительное общество со школой, больницей, приютом и женской богадельней. После Октябрьской революции собор не был закрыт, а в 1941-1999 годах он и вовсе был кафедральным — на хорах собора даже жили Ленинградские митрополиты. Кроме сада, собор дал название Никольским площади, переулку, рынку, а также Старо- и Ново-Никольскому мостам.<br><br>На илл.:<br><br>Зинаида Серебрякова. Никольский собор. 1910 год.<img src="https://img.runcity.org/storage/5/c1/28089cb46c115282c300481d15bbdc15.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_e4c93408f0d279bea57dc3a27db63de8 = $(`<div id="html_e4c93408f0d279bea57dc3a27db63de8" style="width: 100.0%; height: 100.0%;"><b>КП 31</b> · Этап 4<br>Пр. Римского-Корсакова, д. 24<br><i>Сквер рядом с домом. Скульптурная композиция в сквере</i><br><b>Задание:</b> Фамилия на хлястике<br><details><summary>Правильный ответ</summary><b>Крьлов</b></details><br>Взяли: <b>8/9</b> (89%)<br>Не взяли: L598<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исидоровская церковь на проспекте Римского-Корсакова появилась благодаря петербургской общине православных эстонцев, сформировавшейся в Коломне в конце XIX века. Храм получил своё название в честь священномученика Исидора Юрьевского — эстонского православного священника XV века, погибшего за веру.<br><br>Сначала собственного храма у общины не было, и богослужения проходили в подвале утраченной Малоколоменской Воскресенской церкви (в наши дни на её месте — Воскресенский сквер). Инициатором строительства нового храма стал священник Павел Петрович Кульбуш (Платон). Он же основал благотворительную организацию общины — Православное русско-эстонское братство в честь священномученика Исидора Юрьевского. Проект церкви поручили члену Братства, молодому архитектору Александру Артемьевичу Полещуку. Первый взнос на строительство сделал Иоанн Кронштадтский. Позднее, в 1903 году, в его же присутствии была освящена временная эстонская церковь.<br><br>Строительство пятиглавой каменной церкви в русском стиле началось в том же году. Храм был вчерне достроен в 1907 году. Кроме основного здания храма, Полещук подготовил проект целого приходского комплекса со школой, общежитием, библиотекой и помещениями для собраний. Для богослужений внутри Исидоровской церкви были предусмотрены верхний храм с тремя приделами и нижняя церковь во имя Николая Чудотворца. Иконостасы были выполнены по рисункам самого Полещука. В 1910-х годах престолы были облицованы белым каррарским мрамором.<br><br>К 1911 году приход насчитывал более 2500 человек, причём службы проходили на русском и эстонском языках. После революции храм постепенно лишился прежней общины и в 1935 году был закрыт – его здание впоследствии использовали для светских нужд. В 1994 году церковь вернули верующим, и сегодня в ней вновь проходят богослужения.<br><br>На илл.:<br><br>Поднятие крестов на эстонскую православную церковь. Сентябрь 1906 года.<img src="https://img.runcity.org/storage/d/fc/b8043e5f096856074252de487b09dfcd.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_2a077294a29d29cfa0abcbb1b026bee6 = $(`<div id="html_2a077294a29d29cfa0abcbb1b026bee6" style="width: 100.0%; height: 100.0%;"><b>КП 55</b> · Этап 4<br>Лермонтовский пр., д. 43/1<br><i>Участок газона со флагштоками со стороны Лермонтовского пр.</i><br><b>Задание:</b> Количество клумб рядом со флагштоками<br><details><summary>Правильный ответ</summary><b>4</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_7af6aa2e4b338ac37e7e599acb9ee623 = $(`<div id="html_7af6aa2e4b338ac37e7e599acb9ee623" style="width: 100.0%; height: 100.0%;"><b>КП 54</b> · Этап 5<br>Советский пер., д. 5<br><i>Памятник перед зданием</i><br><b>Задание:</b> Годы на постаменте<br><details><summary>Правильный ответ</summary><b>1412, 1431, 2020</b></details><br>Взяли: <b>1/9</b> (11%)<br>Не взяли: L560, L561, L565, L5116, L562, L598, L544, L5120<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Детский театр «На Неве» был создан Татьяной Савенковой в 1987 году. Первым спектаклем театра был «Кот в сапогах». В 1992 году первый мэр Санкт-Петербурга Анатолий Собчак передал театру здание в Советском переулке. Здание было новым: оно было построено в 1988 году на месте казарм лейб-гвардии Измайловского полка по проекту Фёдора Ивановича Волкова конца XVIII века.<br><br>Постановки театра — несомненно, авторские, — по классическим детским сказкам: от Шарля Перро и Ганса Христиана Андерсена до Евгения Шварца и Аркадия Хайта.<br><br>В 2023 году у здания театра был торжественно открыт памятник национальной героине Франции Жанне д&#x27;Арк. Разрешение на установку памятника дала руководитель театра, Татьяна Савенкова.</div></details></div>`)[0];

                var html_8640b99cbb92febde530713c1f0ffb6e = $(`<div id="html_8640b99cbb92febde530713c1f0ffb6e" style="width: 100.0%; height: 100.0%;"><b>КП 59</b> · Этап 5<br>Наб. Обводного канала, д. 169, стр. 1<br><i>Ближайший корпус с Лермонтовскому проспекту. Газон перед корпусом</i><br><b>Задание:</b> Количество кормушек<br><details><summary>Правильный ответ</summary><b>2</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Провиантские магазины на Обводном канале были построены в 1819–1821 годах по проекту Василия Петровича Стасова для лейб-гвардии Измайловского полка. Магазинами в то время называли военные склады, предназначенные для хранения продовольствия. На Обводном планировалось разместить «35 тысяч кулей» провианта. За основу проекта Стасов взял Троицкие провиантские магазины авторства Фёдора Ивановича Демерцова, построенные в 1808 году (не сохранились).<br><br>Четыре двухэтажных корпуса расположены у южной стороны полкового плаца. Кроме непосредственно материальной задачи, магазины выполнили ещё и художественную, став частью оформления набережной Обводного канала. Выходящим на него строгим классическим фасадам придают парадный вид гладкие ризалиты и аттики.<br><br>В 1915-1916 годах два западных корпуса объединили и приспособили под манеж Николаевского кавалерийского училища. Соединил корпуса шестиколонный дорический портик под гладким фронтоном. Очередная реконструкция комплекса прошла в 1950-е годы – тогда, в частности, были изменены оконные проёмы.<br><br>Мстислав Валерианович Добужинский. Петербург. Обводный канал. 1902 год.<img src="https://img.runcity.org/storage/e/47/289d62d71984688f44739cc8ce94947e.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_02043db40160be91e71ff7cc2e79a9fe = $(`<div id="html_02043db40160be91e71ff7cc2e79a9fe" style="width: 100.0%; height: 100.0%;"><b>КП 69</b> · Этап 5<br>Наб. Обводного канала, д. 199-201<br><i>Участок стены рядом с частью вагона метро. Табличка на стене между вагоном и калиткой</i><br><b>Задание:</b> Надпись на английском языке<br><details><summary>Правильный ответ</summary><b>way out</b></details><br>Взяли: <b>9/9</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Современное название реки Таракановки известно с 1785 года, предположительно, от фамилии владельцев завода — Таракановых. Параллельно до 1849 года существовало и название Чечереновка, произошедшее, вероятно, от фамилии землевладельца Чичерина.<br><br>Некогда её русло шло от Фонтанки (исток находился у Старо-Калинкина моста) по современной улице Циолковского, пересекало русло Обводного канала в районе Таракановского моста. Затем на месте площади Стачек в Таракановку впадала небольшая река Тентелевка (Ольховка), а Таракановка шла дальше к Екатерингофу, отделяя его от материка.<br><br>В 1906 году участок от Фонтанки до Обводного канала был засыпан и превратился в Таракановскую улицу (сейчас она носит имя Константина Эдуардовича Циолковского). В 1920-х годах вместе с Тентелевкой был засыпан и участок от Обводного канала до Бумажного, а все мосты, кроме Молвинского, были разобраны.<br><br>На илл.:<br><br>Таракановка у Нарвских ворот. Начало XX века.<img src="https://img.runcity.org/storage/2/5a/055a2f896b30ffcabb41a18edc9225a2.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
