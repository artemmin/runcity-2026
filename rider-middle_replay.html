                var html_cfb32ecb247be7b430c19d3c553d0516 = $(`<div id="html_cfb32ecb247be7b430c19d3c553d0516" style="width: 100.0%; height: 100.0%;"><b>КП 90</b> · Этап 1<br>Петергофское шоссе, д. 47<br><i>Участок газона перед зданием. Закладной камень. Табличка на постаменте</i><br><b>Задание:</b> Самое длинное слово, написанное латиницей<br><details><summary>Правильный ответ</summary><b>foundation</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">«Балтийская жемчужина» — один из крупнейших проектов комплексного освоения территории в Санкт-Петербурге, появившийся на юго-западе города у Финского залива. Проект стартовал в 2005 году при участии китайского инвестора и задумывался как полноценный городской район с жильём, магазинами, ТРК, школами, детскими садами и другой инфраструктурой. На территории площадью около 200 гектаров многие годы формировался самостоятельный городской кластер с жилыми кварталами, общественными пространствами, каналами и набережными.<br><br>Подчиняясь единой концепции, застройка, тем не менее, демонстрирует разнообразие архитектурных решений и неоднородную высотность. Важной частью замысла стала связь района с водой и зелёными пространствами: из локаций внутри комплекса открываются виды на Финский залив, каналы и парки. Одним из самых заметных зданий проекта стал деловой центр «Балтийская жемчужина», построенный в 2006–2007 годах. Его форма обыгрывает название комплекса: изогнутый корпус напоминает раскрытую раковину, а остеклённый сферический объём внутри неё — жемчужину.<br><br>Реализация проекта не уложилась в первоначальные сроки: так, ещё в 2009 году завершение строительства планировалось на 2013 год. Одной из проблем долгое время оставалась транспортная доступность, поскольку развитие нового района опережало возможности прилегающей дорожной сети. В итоге проект «Балтийская жемчужина» был официально завершён только в сентябре 2026 года.</div></details></div>`)[0];

                var html_e1d60e220528cff7e35adcf97c7834dc = $(`<div id="html_e1d60e220528cff7e35adcf97c7834dc" style="width: 100.0%; height: 100.0%;"><b>КП 80</b> · Этап 2<br>Пр. Ветеранов, д. 123<br><i>Мемориал в сквере рядом со зданием.</i><br><b>Задание:</b> Количество противотанковых ежей (считать все, которые находятся в сквере)<br><details><summary>Правильный ответ</summary><b>10</b></details><br>Взяли: <b>22/23</b> (96%)<br>Не взяли: M377<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Исторический район Лигово находится между Петергофским шоссе, проспектом Маршала Жукова, Балтийской линией железной дороги и рекой Ивановкой. Этот район, чье название происходит от древнего финского наименования реки Дудергофки (&quot;Лига&quot; может переводиться как &quot;грязь, лужа&quot;), известен с XVI века как поселение в составе Водской пятины. В 1710 году Лига была личным имением Петра I, где селились дворцовые служители. Когда в 1716 году на Дудергофке была сооружена плотина, в этой местности образовался Лиговский пруд. Во второй половине XVIII столетия владельцем поселения стал Григорий Орлов, при котором был разбит Лиговский парк, носящий сейчас название Полежаевского.<br><br>Дачный поселок Лигово возник на рубеже XIX-XX веков к северу от одноимённой железнодорожной станции. В 1913 году в честь трёхсотлетия монаршего дома дачный посёлок получил название Романовский. Уже в 1918 году он стал Урицком (в честь председателя Петроградской ЧК Моисея Соломоновича Урицкого). В 1925 году Урицк стал городом. С 19 сентября 1941 года по 10 января 1944 года Урицк был оккупирован германскими войсками и почти полностью уничтожен в ходе боевых действий. В 1960-х годах Урицк и Лигово вошли в состав Ленинграда.</div></details></div>`)[0];

                var html_74df37719bea7375e6a01c77be24361a = $(`<div id="html_74df37719bea7375e6a01c77be24361a" style="width: 100.0%; height: 100.0%;"><b>КП 190</b> · Этап 2<br>Пр. Ветеранов, д. 99<br><i>Лестница № 4</i><br><b>Задание:</b> Диапазон квартир на 8 этаже согласно данным таблички у входа<br><details><summary>Правильный ответ</summary><b>136-139</b></details><br>Взяли: <b>21/23</b> (91%)<br>Не взяли: M375, M346<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Версий о происхождении названия «Ульянка» несколько. Одна из них связывает наименование района с церковью с созвучным названием, заложенной во времена Петра I. Менее правдоподобная — с некоей Ульяной, владевшей в этой местности кабаком. Третья — с названием финской деревни Уляля, обозначенной на чертеже Ижорской земли Андриана Шхонбека. Заселение этой территории началось вскоре после основания Санкт-Петербурга. Вдоль дороги в Петергоф появились мызы Бутурлина, Брюса, Головина, Воронцовых, Щербатовых и других приближённых императора. В 1857 году, с появлением железной дороги, Ульянка стала дачной местностью. В годы Великой Отечественной войны дачи, как и большинство зданий в районе, были уничтожены. С 1950-х годов началась активная застройка Ульянки, а в 1977 году в районе появилась станция метро «Проспект Ветеранов». Но в первую очередь, этот небольшой район, ограниченный проспектом Маршала Жукова, улицей Козлова и проспектом Народного Ополчения, знаменит своими жителями. В Ульянке жили Михаил Жванецкий, Сергей Довлатов, Иосиф Бродский и Виктор Цой. Последний — в доме 99 по проспекту Ветеранов.</div></details></div>`)[0];

                var html_a7b9fa1e4cb96a89e830841b549f2206 = $(`<div id="html_a7b9fa1e4cb96a89e830841b549f2206" style="width: 100.0%; height: 100.0%;"><b>КП 185</b> · Этап 2<br>Пр. Стачек, д. 67, к. 3<br><i>Сквер Маринеско рядом с домом. Табличка на постаменте памятника</i><br><b>Задание:</b> Самое длинное слово в кавычках<br><details><summary>Правильный ответ</summary><b>стоуннеруд</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Территория района Автово была заселена уже в XVII веке, когда Ингерманландией ещё владела Швеция. Так, на составленной по архивным данным 1676 года карте Августа Ивановича Бергенгейма, топографа XIX века, встречается название «Autowa», восходящее, вероятно, к финским словам со значениями «пустошь», «пустынный». В первые годы после основания Санкт-Петербурга рядом с деревней Автово была проложена дорога, связавшая столицу с Петергофом. По левую руку от Петергофской дороги возникла деревня Ямская Слобода. Недалеко от нее, на берегу реки Красненькой в конце XVIII столетия появилось Красненькое кладбище. После того, как деревни Автово и Емельяновка были уничтожены наводнением 1824 года, их восстановление было поручено архитектору Василию Петровичу Стасову. Застройка по проекту Стасова сохранилась в районе до самых 1930-х годов. В начале XIX века в район реки Емельяновки был переведен Кронштадтский Казенный чугунолитейный завод, впоследствии приобретенный Николаем Ивановичем Путиловым, благодаря которому был вырыт Морской канал и построены Морской порт и Путиловские верфи. К концу века через Автово была проложена Окружная железная дорога, связавшая Путиловский завод с Балтийской железной дорогой. В ознаменование горячего участия жителей района в трех русских революциях Петергофское шоссе было переименовано в улицу Стачек, получившую в 1940 году статус проспекта. Автово стало частью города лишь в 1917 году, но перестало считаться окраиной лишь после Великой Отечественной войны, а в топонимике некогда фронтового района отразился героизм защитников Ленинграда. По названию местности в 1955 году получила наименование станция метро «Автово», а в 1956 году – Автовская улица (Автовская прорезка) между улицей Возрождения и проспектом Стачек.</div></details></div>`)[0];

                var html_9fb5183d60c7ac55ad797e229948e2a1 = $(`<div id="html_9fb5183d60c7ac55ad797e229948e2a1" style="width: 100.0%; height: 100.0%;"><b>КП 71</b> · Этап 3<br>Парк Екатерингоф. Лифляндская ул., д. 5<br><i>Участок газона севернее здания, рядом с пешеходной дорожкой. Клумба с высаженными растениями. Табличка про лаванду узколистную</i><br><b>Задание:</b> Последние две буквы последней строчки на табличке<br><details><summary>Правильный ответ</summary><b>са</b></details><br>Взяли: <b>21/23</b> (91%)<br>Не взяли: M390, M346<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1823 году Екатерингоф был благоустроен по инициативе военного генерал-губернатора Петербурга графа Михаила Андреевича Милорадовича — уже как общедоступный парк. По проекту Огюста Монферрана были возведены псевдоготические павильоны Ферма, Львиный и Мавританский, — а также Катальная горка и Воксхолл. Двухэтажная Ферма с башней по сути представляла собой загородный дом генерал-губернатора. Готический (Львиный) павильон был сторожевой башней на берегу Екатерингофки и мог использоваться как маяк. Огромный одноэтажный Вокзал (он же Воксхолл) с круглым танцевальным залом предназначался для балов, музыкальных вечеров и прочих увеселений.<br><br>В связи с возросшей популярностью парка городские власти выделили средства на садовника, смотрителя и другие должности. Для смотрителя в 1830-х годах даже был построен двухэтажный деревянный дом у Молвинского моста. Впрочем, к 1870-м годам парк снова постепенно пришёл в упадок — и из-за недостатка финансирования, и из-за активного строительства в районе заводов и фабрик.<br><br>На илл.: Иван Андреевич Иванов. Пейзаж с рекой. Екатерингоф. 1844 год.<img src="https://img.runcity.org/storage/4/c1/3e0735c9bf1ac80f17f4839d94765c14.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_f514022d2b76de80ec00e51acfcee908 = $(`<div id="html_f514022d2b76de80ec00e51acfcee908" style="width: 100.0%; height: 100.0%;"><b>КП 73</b> · Этап 3<br>Старо-Петергофский пр., д. 42<br><i>Участок стены с проемом в сквере рядом с домом</i><br><b>Задание:</b> Количество проходящих насквозь труб в верхней части стены<br><details><summary>Правильный ответ</summary><b>9</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В апреле 1814 года в Санкт-Петербург с курьером пришло известие о вступлении русских войск в Париж — и о победе в Войне шестой коалиции. Для торжественной встречи победителей в столице было решено установить триумфальные ворота по образцу Арки Тита в Риме. Проект сооружения подготовил Джакомо Кваренги.<br><br>Уже к концу июля близ Нарвской заставы (между домами 37 и 44 по современному Старо-Петергофскому проспекту) были установлены деревянные триумфальные ворота. Они были выполнены в виде однопролётной арки, увенчанной колесницей Славы с шестью конями. Скульптурное убранство памятника было создано из гипса по моделям Ивана Ивановича Теребенёва — автора горельефа «Заведение флота в России» на аттике Адмиралтейства.<br><br>Деревянные ворота быстро обветшали, и потому в 1824 году был создан Комитет по строительству постоянной арки. Председательствовал в нём военный губернатор столицы Михаил Андреевич Милорадович. 400 тысяч рублей на строительство, по распоряжению Александра I, было выделено из состояния покойного генерала Фёдора Петровича Уварова, героя Отечественной войны 1812 года. Тот завещал средства на памятник в честь Гвардейского корпуса, которым в своё время командовал.<br><br>19 ноября (1 декабря) 1825 года скончался Александр I, в том же месяце на Сенатской площади был убит Милорадович — и закономерно работа Комитета была остановлена.<br><br>На илл.:<br><br>Карл Петрович Беггров. Нарвские триумфальные ворота. 1823 год.<img src="https://img.runcity.org/storage/f/c1/1902e0808684d0a21a4821a7c7f97c1f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_bb9475e754126f68df5ff7b52671de9f = $(`<div id="html_bb9475e754126f68df5ff7b52671de9f" style="width: 100.0%; height: 100.0%;"><b>КП 273</b> · Этап 3<br>Парк Екатерингоф. Пруд за памятником героям Краснодона<br><i>Два постамента на западном берегу пруда</i><br><b>Задание:</b> Количество клумб между постаментами<br><details><summary>Правильный ответ</summary><b>4</b></details><br>Взяли: <b>22/23</b> (96%)<br>Не взяли: M346<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1930-е годы на территории бывшей императорской резиденции, получившей название «Парк имени Первого мая», работали цирк, летний кинотеатр, лекторий и библиотека. В 1948 году парк получил новое название в честь 30-летия ВЛКСМ. В январе 1956 году в нём был установлен памятник членам подпольной организации «Молодая гвардия», погибшим в 1943 году. Позднее в западной части парка были построены стадион и конно-спортивная школа. В 1992 году Екатерингоф вернул своё историческое название.<br><br>Следующая реставрация парка запланирована на 2027 год.<br><br>На илл.: И. Урениус. Катальная горка в Екатерингофе. 1824 год.<img src="https://img.runcity.org/storage/a/81/4d10b568d7845cd1db47cceffe63e81a.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_f2d54c7ee6a6bd0bd856f263962ed8d8 = $(`<div id="html_f2d54c7ee6a6bd0bd856f263962ed8d8" style="width: 100.0%; height: 100.0%;"><b>КП 370</b> · Этап 3<br>Наземный вестибюль станции метро &quot;Путиловская&quot;<br><i>Рисунок на стене между входом и выходом</i><br><b>Задание:</b> Селфи на фоне рисунка<br><details><summary>Правильный ответ</summary><b>Селфи</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Станция метро «Путиловская» открылась в декабре 2025 года в Кировском районе, став одной из первых станций новой Красносельско-Калининской линии. Она получила название в память о Путиловском заводе — одном из старейших и крупнейших металлургических и машиностроительных предприятий страны, на протяжении двух веков определявшем жизнь этой части города.<br><br>Вестибюль «Путиловской» также отсылает к истории завода: над наклонным ходом эскалатора размещено масштабное панно, на котором в абстрактной форме изображены чугунолитейное, машиностроительное и художественно-литейное производства. С ним перекликается и композиция на фасаде здания станции, изображающая тоннель, «уходящий в перспективу». В оформлении подземного зала использованы сдержанные серые и металлические оттенки, натуральный камень и лаконичные геометрические формы.<br><br>«Путиловская» стала важным пересадочным узлом – через неё пассажиры переходят на соседний «Кировский завод» Кировско-Выборгской линии. Ради нового перехода пришлось изменить облик старой станции: бюст Ленина, установленный в торце центрального зала, был перенесён в полукруглую нишу между входом и выходом вестибюля «Кировского завода».</div></details></div>`)[0];

                var html_9b303ca6a31770d2f9f55ca5342b88b2 = $(`<div id="html_9b303ca6a31770d2f9f55ca5342b88b2" style="width: 100.0%; height: 100.0%;"><b>КП 165</b> · Этап 3<br>Площадь Балтийского вокзала<br><i>Балтийский сад</i><br><b>Задание:</b> Количество противопарковочных полусфер со стороны вокзала<br><details><summary>Правильный ответ</summary><b>3</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1856-1857 годах по инициативе барона Александра Людвиговича фон Штиглица была построена Петергофская железная дорога — для сообщения столицы с дачами Стрельны и Петергофа. В Петербурге для новой дороги было воздвигнуто здание Петергофского вокзала по проекту Александра Николаевича Кракау.<br><br>Симметричные башни главного фасада вокзала, двухэтажные флигели с ризалитами и их арочные проёмы отсылают к архитектуре Ренессанса. В центре фасада, выходящего на площадь, размещён полукруглый витраж. В витраже позднее были установлены уличные часы фирмы «Павел Буре».<br><br>В 1859 году начало работу ответвление Петергофской дороги — от станции Красносельская (переименованной в Лиговскую) до Красного Села. В 1864 году основную линию продлили до Ораниенбаума. Спустя шесть лет обе ветки Петергофской железной дороги выкупило Общество Балтийской железной дороги. Благодаря этой сделке линия до Красного села была продлена до Гатчины, а столичный вокзал стал называться Балтийским.<br><br>В 1931-1932 годах из-под купола здания Балтийского вокзала были убраны пути, боковые входы были закрыты, а на месте арочных окон появился центральный вход. Реконструкция прошла для открытия движения электропоездов в 1933 году. В 1955 году к вокзалу был пристроен наземный вестибюль станции метро «Балтийская».<br><br>В 1861 году в пользование Петергофской железной дороге была передана площадь перед вокзалом до набережной Обводного канала. Вскоре на площади был разбит сквер — он тоже содержался на средства железной дороги. В 1907-1908 годы вокруг сквера (в наши дни это Балтийский сад) было было проложено трамвайное кольцо. В 1965 году в сквере, напротив центрального входа в вокзал, был установлен памятник, посвящённый жителям Ленинского района, ушедшим на фронт в составе Ленинградской армии народного ополчения.<br><br>На илл.: Балтийский вокзал. 1913 год.<img src="https://img.runcity.org/storage/0/05/4c8ed293a448f698d0491b9ad906a050.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_87b2054fd853d7eaf23ce428f4379379 = $(`<div id="html_87b2054fd853d7eaf23ce428f4379379" style="width: 100.0%; height: 100.0%;"><b>КП 140</b> · Этап 4<br>Пр. Римского-Корсакова, д. 33<br><i>Табличка с QR-кодом, располагающаяся под адресной</i><br><b>Задание:</b> Четырехзначное число в ссылке<br><details><summary>Правильный ответ</summary><b>2612</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Напротив указанного дома расположен Никольский сад, разбитый ещё в XVIII веке. В 1753-1762 годах в его центре по проекту архитектора Саввы Ивановича Чевакинского был построен Никольский морской собор, по которому сад и был назван.<br><br>Отдельно стоящая четырёхъярусная колокольня собора, завершенная высоким шпилем, была возведена в 1755-1758 годах. С 1870 года при Никольском соборе действовало благотворительное общество со школой, больницей, приютом и женской богадельней. После Октябрьской революции собор не был закрыт, а в 1941-1999 годах он и вовсе был кафедральным — на хорах собора даже жили Ленинградские митрополиты. Кроме сада, собор дал название Никольским площади, переулку, рынку, а также Старо- и Ново-Никольскому мостам.<br><br>На илл.:<br><br>Зинаида Серебрякова. Никольский собор. 1910 год.<img src="https://img.runcity.org/storage/5/c1/28089cb46c115282c300481d15bbdc15.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_4e284de9fb229719ab5d81858c58c199 = $(`<div id="html_4e284de9fb229719ab5d81858c58c199" style="width: 100.0%; height: 100.0%;"><b>КП 155</b> · Этап 4<br>Лермонтовский пр., д. 43/1<br><i>Фонтан в сквере перед зданием</i><br><b>Задание:</b> Количество торчащих из воды форсунок, из которых могут бить струи фонтана<br><details><summary>Правильный ответ</summary><b>44</b></details><br>Взяли: <b>22/23</b> (96%)<br>Не взяли: M316<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Гостиница «Советская» между набережной Фонтанки, Лермонтовским и Рижским проспектами была построена в 1963–1968 годах по проекту мастерской №5 института «Ленпроект» под руководством академика Евгения Адольфовича Левинсона. Кроме него в состав группы авторов входили архитекторы Вера Владимировна Ганкевич и Анатолий Исаакович Прибульский, а также инженер Пётр Филиппович Панфилов.<br><br>Высота главного девятнадцатиэтажного корпуса гостиницы составила 52 метра. Архитектура здания характерна для ленинградского модернизма 1960-х годов. Главный корпус отличается лаконичной прямоугольной формой и горизонтальными лентами окон, практически лишёнными декоративного оформления. К нему под прямым углом примыкает более протяжённый пятиэтажный корпус, обращённый в сторону Фонтанки. Стены здания облицованы белой мозаикой.<br><br>На момент строительства главный корпус «Советской» стал самым высоким зданием Ленинграда (его даже называли первым в городе небоскрёбом) и одной из главных новых доминант города. Его появление было особенно заметно в панораме Фонтанки, где до этого преобладала историческая застройка небольшой этажности. «Советская» же, подчёркнуто модернистское здание, оттеняется Петербургом XIX века.<br><br>Гостиница была рассчитана в том числе на приём иностранных туристов и после завершения строительства могла одновременно разместить 1713 гостей. Здесь работали ремонт и чистка одежды, телефон и телеграф, рестораны и кафе. На верхнем этаже находился бар, именуемый в народе «Шайба», с панорамным видом на город. При гостинице также работал магазин «Берёзка», где торговали за иностранную валюту и специальные чеки. Сегодня бывшая гостиница «Советская» известна как «Азимут Отель Санкт-Петербург».<br><br>На илл.:<br><br>Трамвай на Лермонтовском проспекте у гостиницы. 1967–1969 годы.<img src="https://img.runcity.org/storage/8/85/783e80901d2451d22eda8d0a7424a858.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_b19ec1e950ec340896c8bbaa4baa9bcc = $(`<div id="html_b19ec1e950ec340896c8bbaa4baa9bcc" style="width: 100.0%; height: 100.0%;"><b>КП 34</b> · Этап 5<br>Ул. Декабристов, д. 29<br><i>Фасад, выходящий на улицу</i><br><b>Задание:</b> Крупно написанный год на уровне окон второго этажа<br><details><summary>Правильный ответ</summary><b>1950</b></details><br>Взяли: <b>23/23</b> (100%)<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">Вторая сцена Мариинского театра появилась на берегу Крюкова канала в 2013 году — почти через полтора века после открытия исторического здания авторства Альберто Кавоса. Для нового здания освободили целый квартал между улицей Декабристов, Минским переулком, улицей Союза Печатников и Крюковым каналом. В 2005 году в квартале были снесены школа №243 1930-х годов постройки, доходный дом, Дворец культуры имени Первой пятилетки и и жилой дом с лавкой Литовского рынка (сам рынок сгорел в 1920-х годах, и лавка со стороны Крюкова канала оставалась единственным его сохранившимся фрагментом).<br><br>Изначально Мариинский-2 должен был строиться по проекту французского архитектора Доминика Перро. Тот предложил эффектный «золотой кокон» из металлических конструкций и стекла. На международный конкурс 2003 года поступило 11 проектов — от почти классических до совсем футуристических, и именно идея Перро стала победительницей. Позже этот концепт сменился проектом канадского бюро «Diamond &amp; Schmitt Architects» и петербургского «Конструкторского бюро высотных и подземных сооружений».<br><br>Светлый объём из юрского мрамора прорезан большими панорамными окнами: через них изнутри открывается вид на Крюков канал, а снаружи можно увидеть просторное фойе. Вечером здание словно начинает светиться изнутри. Вокруг основного зрительного зала устроено сложное многоуровневое пространство фойе, а сам зал рассчитан примерно на 2000 зрителей.<br><br>Яркий элемент экстерьера театра — стеклянный переход через Крюков канал, соединяющий новую сцену со старым зданием. Его построили для перемещения артистов, декораций и реквизита между двумя корпусами. Однако сначала он буквально упирался в стену исторической Мариинки: необходимый проём долго не согласовывали. Поэтому несколько лет переход выглядел как настоящий «мост в никуда» — соединить два здания удалось только в 2015 году.<br><br>На илл.:<br><br>Дворец культуры им. Первой пятилетки. 1930 год.<img src="https://img.runcity.org/storage/7/11/c95361adaadfedff5204eba3d211c117.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];

                var html_21230cd8eba779ef94cc9b7831fa72c9 = $(`<div id="html_21230cd8eba779ef94cc9b7831fa72c9" style="width: 100.0%; height: 100.0%;"><b>КП 37</b> · Этап 5<br>Ул. Писарева. Алексеевский сад<br><i>Фонтан в саду. Охранная табличка</i><br><b>Задание:</b> Год на табличке<br><details><summary>Правильный ответ</summary><b>1885</b></details><br>Взяли: <b>22/23</b> (96%)<br>Не взяли: M357<br><details><summary>Историческая справка</summary><div style="max-height:260px;overflow:auto;font-size:12px">В 1883-1885 годах Максимилиан Егорович Месмахер перестроил особняк на набережной Мойки в дворец для великого князя Алексея Александровича. В 1885 году зодчий перепланировал и сад при дворце.<br><br>Четвёртый сын Александра II, Алексей Александрович, с рождения был зачислен в морской гвардейский экипаж. В 1857 году он получил звание мичмана — в семь лет. С десяти лет великий князь участвовал в плаваниях на военных кораблях. В 1871-1872 годах он путешествовал на фрегате «Светлана» в составе дипломатической эскадры в Северо-Американские Соединенные Штаты. В 1880 году Алексей Александрович стал членом Государственного совета и Главным начальником флота и Морского ведомства.<br><br>Место для дворца Главного начальника флота и Морского ведомства было подобрано неслучайно: поблизости располагались казармы Гвардейского морского экипажа, Адмиралтейские верфи и Новая Голландия. Работая над проектом Алексеевского дворца, Месмахер сохранил существовавшее ранее сочетание разновеликих объёмов особняка и дополнил его двумя башнями. Доминирующее положение в новой композиции заняла четырёхъярусная башня с шатровым верхом. Со стороны реки были обустроены два подъезда: Главный и Собственный. Главный был украшен картушем с гербом великого князя и фонарями на три светильника. На балюстрадах над подъездом было установлено десять бюстов. Собственный подъезд был скромнее: его украсили шесть бюстов.<br><br>После революции дворец был национализирован. В 1920-х годах его занимало Издательство Географического института. В 1960-х годах в здание переехал трест «Ленинградоргстрой». С 2006 года в здании дворца работает Санкт-Петербургский Дом музыки.<br><br>Строительство дворца повлекло за собой прокладку новой улицы — Алексеевской (в наши дни это улица Писарева). От неё высокой каменной стеной был отделён Собственный сад, разбитый перед южным фасадом дворца. Другой сад — парадный — был обращён к Мойке. Важнейшим элементом его художественного решения стала ограда, состоящая из декоративных копий и трезубцев и украшенная коронованной монограммой «АА».<br><br>Пейзажный Собственный сад оттенял разноплановое здание дворца. Сад полностью соответствовал своему названию: там даже хоронили собак великого князя. На местах захоронений были установлены скульптуры. Перед окнами кабинета Алексея Александровича — тоже по проекту Месмахера — был сооружён гранитный фонтан. Его реставрация была проведена в 2013 году.<br><br>На илл.: Сад дворца великого князя Алексея Александровича. Конец XIX века.<img src="https://img.runcity.org/storage/f/03/b714537adf8d51c4dd540be536c1d03f.jpg" style="max-width:100%;margin-top:6px"></div></details></div>`)[0];
